name: v327 1-head PRE confidence exhibition

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v327_1head_preconf_exhibition.py'
      - '.github/workflows/v327-1head-preconf-exhibition.yml'

jobs:
  v327:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy scikit-learn
      - name: Run v327
        run: python run_v327_1head_preconf_exhibition.py
      - name: Show summary
        if: always()
        run: cat /tmp/v327/summary_v327.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v327-1head-preconf-exhibition
          path: /tmp/v327/
          if-no-files-found: warn
