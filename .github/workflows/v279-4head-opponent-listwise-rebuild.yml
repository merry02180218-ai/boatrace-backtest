name: v279 4head independent opponent listwise rebuild
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v279_4head_opponent_listwise_rebuild.py'
      - '.github/workflows/v279-4head-opponent-listwise-rebuild.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn
      - run: python analyze_v279_4head_opponent_listwise_rebuild.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v279-4head-independent-opponent-rebuild
          path: |
            analysis_v279_4head_opponent_listwise_grid.csv
            analysis_v279_4head_opponent_listwise_predictions.csv
            analysis_v279_4head_opponent_listwise_monthly.csv
            summary_v279_4head_opponent_listwise_rebuild.md
          if-no-files-found: ignore
      - name: Commit v279 outputs
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v279_4head_opponent_listwise_grid.csv analysis_v279_4head_opponent_listwise_predictions.csv analysis_v279_4head_opponent_listwise_monthly.csv summary_v279_4head_opponent_listwise_rebuild.md
          git commit -m "Add v279 independent 4-head opponent rebuild results" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
