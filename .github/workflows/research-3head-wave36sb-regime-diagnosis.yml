name: research-3head-wave36sb-regime-diagnosis
on:
  push:
    branches: [research/3head-v289-addon-expansion]
    paths: ['.github/workflows/research-3head-wave36sb-regime-diagnosis.yml']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy scikit-learn
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34754875342 --repo merry02180218-ai/boatrace-backtest --name 3head-wave21-allrace-source-build --dir source
          cp source/analysis_v289_3head_wave21_allrace_feature_settled.csv .
      - run: python research_v289_3head_wave36sb_regime_diagnosis.py
      - uses: actions/upload-artifact@v4
        with:
          name: 3head-wave36sb-regime-diagnosis
          path: research_v289_3head_wave36sb_regime_diagnosis.json
