name: v289 4head Top4 composite filter

on:
  push:
    paths:
      - 'analyze_v289_4head_top4_comp_filter.py'
      - '.github/workflows/v289-4head-top4-comp-filter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - run: python analyze_v289_4head_top4_comp_filter.py
      - uses: actions/upload-artifact@v4
        with:
          name: v289-4head-top4-comp-filter
          path: |
            analysis_v289_4head_top4_comp_bands.csv
            analysis_v289_4head_top4_comp_floor.csv
            analysis_v289_4head_top4_comp_floor_monthly.csv
            analysis_v289_4head_top4_comp_lomo.csv
            analysis_v289_4head_top4_comp_verify.csv
            summary_v289_4head_top4_comp_filter.md
      - name: Commit v289 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v289_4head_top4_comp_bands.csv analysis_v289_4head_top4_comp_floor.csv analysis_v289_4head_top4_comp_floor_monthly.csv analysis_v289_4head_top4_comp_lomo.csv analysis_v289_4head_top4_comp_verify.csv summary_v289_4head_top4_comp_filter.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add v289 Top4 composite-odds filter results'
          git pull --rebase origin main
          git push origin HEAD:main
