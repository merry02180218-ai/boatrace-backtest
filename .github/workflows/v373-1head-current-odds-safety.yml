name: v373 1-head current-odds safety translation
on:
  push:
    paths:
      - 'run_v373_1head_value_gated_current_odds_safety.py'
      - '.github/workflows/v373-1head-current-odds-safety.yml'
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas
      - name: Download v372 artifact
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10561425801/zip" > /tmp/v372.zip
          mkdir -p /tmp/v372
          unzip -q /tmp/v372.zip -d /tmp/v372
          test -f /tmp/v372/formal_with_preclose_join.csv
      - name: Run v373 safety translation
        run: |
          set -o pipefail
          python run_v373_1head_value_gated_current_odds_safety.py --joined /tmp/v372/formal_with_preclose_join.csv 2>&1 | tee /tmp/v373_run.log
      - name: Show result
        if: always()
        run: cat /tmp/v373-current-odds-safety/result.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v373-current-odds-safety-${{ github.run_id }}
          path: |
            /tmp/v373-current-odds-safety/
            /tmp/v373_run.log
          retention-days: 30
      - name: Publish compact audit record to main
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];run=os.environ['GITHUB_RUN_ID']
          def gh(path):
              p=subprocess.run(['gh','api',path],text=True,capture_output=True)
              if p.returncode:return {}
              try:return json.loads(p.stdout)
              except:return {}
          jobs=gh(f'/repos/{repo}/actions/runs/{run}/jobs')
          arts=gh(f'/repos/{repo}/actions/runs/{run}/artifacts')
          meta={'run_id':int(run),'run_url':f'https://github.com/{repo}/actions/runs/{run}',
                'head_sha':os.environ.get('GITHUB_SHA'),
                'jobs':[{'id':x.get('id'),'name':x.get('name'),'status':x.get('status'),'conclusion':x.get('conclusion')} for x in jobs.get('jobs',[])],
                'artifacts':[{'id':x.get('id'),'name':x.get('name'),'size_in_bytes':x.get('size_in_bytes')} for x in arts.get('artifacts',[])]}
          Path('/tmp/v373_meta.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          PY
          git fetch origin main
          git reset --hard origin/main
          mkdir -p analysis/v373_current_odds_safety
          cp /tmp/v373_meta.json analysis/v373_current_odds_safety/run_meta.json
          cp /tmp/v373_run.log analysis/v373_current_odds_safety/run.log 2>/dev/null || true
          cp /tmp/v373-current-odds-safety/result.json analysis/v373_current_odds_safety/result.json 2>/dev/null || true
          cp /tmp/v373-current-odds-safety/market_only_candidates.csv analysis/v373_current_odds_safety/market_only_candidates.csv 2>/dev/null || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add analysis/v373_current_odds_safety
          git commit -m "audit: publish v373 result run ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:main
