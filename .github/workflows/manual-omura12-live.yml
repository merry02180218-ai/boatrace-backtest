name: manual-omura12-live
on:
  push:
    paths:
      - 'run_manual_omura12_20260907.py'
      - '.github/workflows/manual-omura12-live.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn requests beautifulsoup4
      - name: Run screenshot-direct v109-v162
        run: python run_manual_omura12_20260907.py
      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add manual_omura12_20260907_result.txt
          git diff --cached --quiet || git commit -m 'Save Omura12 live model result'
          git push
