name: research-3head-wave46-selective-ticket-compression
on:
  push:
    branches: [research/3head-v289-addon-expansion]
    paths:
      - 'research_v289_3head_wave46_selective_ticket_compression.py'
      - '.github/workflows/research-3head-wave46-selective-ticket-compression.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy scikit-learn
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34754875342 -n 3head-wave21-allrace-source-build
      - run: python research_v289_3head_wave46_selective_ticket_compression.py
      - uses: actions/upload-artifact@v4
        with:
          name: 3head-wave46-selective-ticket-compression
          path: research_v289_3head_wave46_selective_ticket_compression.json
