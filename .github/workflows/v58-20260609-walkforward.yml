name: v58-20260609-walkforward
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'replay_v58_20260609_walkforward.py'
      - '.github/workflows/v58-20260609-walkforward.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run June 9 walk-forward replay
        run: python replay_v58_20260609_walkforward.py
      - name: Commit v58 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v58_20260609_walkforward.md v58_20260609_direct.csv v58_20260609_settled.csv
          if ! git diff --cached --quiet; then
            git commit -m "Run June 9 strict walk-forward replay"
            git pull --rebase origin main
            git push
          fi
