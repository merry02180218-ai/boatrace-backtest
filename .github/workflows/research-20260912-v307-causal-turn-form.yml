name: v307 1head causal turn form
on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v307_1head_causal_turn_form.py'
      - '.github/workflows/research-20260912-v307-causal-turn-form.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Run v307 causal research
        run: python run_v307_1head_causal_turn_form.py
      - uses: actions/upload-artifact@v4
        with:
          name: v307-1head-causal-turn-form
          path: |
            analysis_v307_1head_causal_turn_form_*.csv
            summary_v307_1head_causal_turn_form.md
      - name: Commit v307 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v307_1head_causal_turn_form_*.csv summary_v307_1head_causal_turn_form.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add v307 causal turn-form outputs'
          git pull --rebase origin main
          git push origin HEAD:main
