name: v389 1-head added71 ticket consensus

on:
  push:
    branches: [ main ]
    paths:
      - 'run_v389_1head_added71_ticket_consensus.py'
      - '.github/workflows/v389-1head-added71-ticket-consensus.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml

      - name: Download frozen v360 prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" > /tmp/v360.zip
          mkdir -p /tmp/v360
          unzip -q /tmp/v360.zip -d /tmp/v360
          PREP=$(find /tmp/v360 -name prepared_rows.pkl -print -quit)
          test -n "$PREP"
          echo "PREP=$PREP" >> "$GITHUB_ENV"

      - name: Run consensus rescue audit
        run: python run_v389_1head_added71_ticket_consensus.py --prepared "$PREP"

      - name: Show result
        if: always()
        run: |
          cat /tmp/v389-added71-ticket-consensus/result.json 2>/dev/null || true
          echo "---- grid ----"
          head -40 /tmp/v389-added71-ticket-consensus/grid.csv 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v389-added71-ticket-consensus-${{ github.run_id }}
          path: /tmp/v389-added71-ticket-consensus/
          retention-days: 30
