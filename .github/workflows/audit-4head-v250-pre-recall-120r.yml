name: audit-4head-v250-pre-recall-120r

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/audit-4head-v250-pre-recall-120r.txt'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy scikit-learn requests joblib beautifulsoup4 lxml
      - name: Run v250 PRE recall audit
        run: |
          mkdir -p /tmp/head4_v250_pre_recall120
          python audit_4head_v250_pre_recall_120r.py | tee /tmp/head4_v250_pre_recall120/run.log
          grep -q 'HEAD4_V250_PRE_RECALL120_OK' /tmp/head4_v250_pre_recall120/run.log
          grep -q '9月_UNREAD' /tmp/head4_v250_pre_recall120/run.log
          grep -q '本番変更なし' /tmp/head4_v250_pre_recall120/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: head4-v250-pre-recall-120r
          path: /tmp/head4_v250_pre_recall120/
