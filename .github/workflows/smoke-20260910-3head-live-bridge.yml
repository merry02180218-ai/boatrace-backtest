name: smoke 2026-09-10 3head live bridge
on:
  push:
    paths:
      - 'smoke_20260910_3head_live_bridge.py'
      - '.github/workflows/smoke-20260910-3head-live-bridge.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn requests beautifulsoup4
      - run: python smoke_20260910_3head_live_bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-20260910-3head-live-bridge
          path: |
            smoke_20260910_3head_live_bridge.json
            smoke_20260910_3head_live_bridge.txt
