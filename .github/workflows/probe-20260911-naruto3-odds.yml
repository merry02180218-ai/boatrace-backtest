name: probe-20260911-naruto3-odds
on:
  push:
    paths: ['.github/workflows/probe-20260911-naruto3-odds.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests beautifulsoup4 pandas
      - name: Fetch current odds
        run: |
          rm -rf naruto3_odds
          python fetch_live_trifecta_odds.py --date 20260911 --jcd 14 --race 3 --out naruto3_odds
          CSV=$(find naruto3_odds -maxdepth 1 -type f -name '*.csv' | sort | tail -1)
          META=$(find naruto3_odds -maxdepth 1 -type f -name '*.json' | sort | tail -1)
          test -n "$CSV" && test -n "$META"
          echo "CSV=$CSV"
          echo "META=$META"
          python - "$CSV" <<'PY'
          import pandas as pd,sys
          df=pd.read_csv(sys.argv[1])
          print('rows=',len(df))
          assert len(df)==120
          print(df.head(10).to_string(index=False))
          PY
