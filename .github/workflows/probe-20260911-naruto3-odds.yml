name: probe-20260911-naruto3-odds
on:
  push:
    paths: ['.github/workflows/probe-20260911-naruto3-odds.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests beautifulsoup4
      - name: Fetch current odds
        run: |
          python fetch_live_trifecta_odds.py --date 20260911 --stadium 14 --race 3 || python fetch_live_trifecta_odds.py 20260911 14 3
