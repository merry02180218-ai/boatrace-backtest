name: head4-july-boundary
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn tabulate requests beautifulsoup4 lxml
      - run: python analyze_4head_july_boundary_20260914.py
      - uses: actions/upload-artifact@v4
        with:
          name: head4-july-boundary
          path: |
            summary_4head_july_boundary_20260914.md
            analysis_4head_july_boundary_daily_20260914.csv
            audit_4head_july_boundary_20260914.json
