name: research-3head-wave34g-motor-confirmation
on:
  push:
    branches: [research/3head-v289-addon-expansion]
    paths:
      - 'research_v289_3head_wave34g_motor_confirmation.py'
      - '.github/workflows/research-3head-wave34c-loss-filter.yml'
  workflow_dispatch:
jobs:
  wave34g:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy scikit-learn
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34754875342 --repo merry02180218-ai/boatrace-backtest --name 3head-wave21-allrace-source-build --dir source
          cp source/analysis_v289_3head_wave21_allrace_feature_settled.csv .
      - run: python research_v289_3head_wave34g_motor_confirmation.py
      - uses: actions/upload-artifact@v4
        with:
          name: 3head-wave34g-motor-confirmation
          path: |
            analysis_v289_3head_wave34g_motor_confirmation.csv
            research_v289_3head_wave34g_motor_confirmation.json
            research_v289_3head_wave34g_motor_confirmation.md
