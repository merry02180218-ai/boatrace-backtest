name: v197 3head turn forward validation
on:
  push:
    paths:
      - 'analyze_v197_3head_turn_forward_validation.py'
      - '.github/workflows/v197-3head-turn-forward-validation.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas
      - run: python analyze_v197_3head_turn_forward_validation.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v197_3head_turn_forward_validation.csv summary_v197_3head_turn_forward_validation.md
          git diff --cached --quiet || git commit -m 'Add v197 forward validation results'
          git pull --rebase
          git push
