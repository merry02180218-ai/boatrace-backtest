name: research v293 1head direct history

on:
  workflow_dispatch:
  push:
    paths:
      - analyze_v293_1head_direct_history_research.py
      - .github/workflows/research-20260911-v293-1head-direct-history.yml

permissions:
  contents: write
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn
      - name: Run strict pre-Jul v293 research
        run: python analyze_v293_1head_direct_history_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v293-1head-direct-history
          path: |
            analysis_v293_1head_direct_history_predictions.csv
            analysis_v293_1head_direct_history_folds.csv
            analysis_v293_1head_direct_history_metrics.csv
            analysis_v293_1head_direct_history_selection.csv
            summary_v293_1head_direct_history_research.md
          if-no-files-found: ignore
      - name: Commit compact research outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add analysis_v293_1head_direct_history_folds.csv \
                  analysis_v293_1head_direct_history_metrics.csv \
                  analysis_v293_1head_direct_history_selection.csv \
                  summary_v293_1head_direct_history_research.md
          if ! git diff --cached --quiet; then
            git commit -m "results: v293 1-head direct/history research"
            git pull --rebase origin main
            git push
          fi
