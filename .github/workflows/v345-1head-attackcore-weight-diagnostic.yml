on:
  push:
    paths:
      - 'run_v345_1head_attackcore_weight_diagnostic.py'
      - '.github/workflows/v345-1head-attackcore-weight-diagnostic.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: v339-julaug-prepare
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34787687379
      - uses: actions/download-artifact@v4
        with:
          name: v339-julaug-second
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34787687379
      - uses: actions/download-artifact@v4
        with:
          name: v339-julaug-base-third
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34787687379
      - uses: actions/download-artifact@v4
        with:
          name: v339-julaug-third
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34787687379
      - uses: actions/download-artifact@v4
        with:
          name: v340-1head-adaptive-odds-dutch-sharded
          path: /tmp/v345/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34796402852
      - run: python run_v345_1head_attackcore_weight_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v345-1head-attackcore-weight-diagnostic
          path: /tmp/v345out/
