name: v351 1-head production regression

on:
  workflow_dispatch:
  push:
    paths:
      - 'onehead_production_profile.py'
      - 'run_v351_1head_production_regression.py'
      - '.github/workflows/v351-1head-production-regression.yml'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage prepare
      - uses: actions/upload-artifact@v4
        with:
          name: v351-julaug-prepare
          path: |
            cache_v321_julaug_nonpristine_slim.csv.gz
            cache_v321_julaug_nonpristine_head.csv
            cache_v321_julaug_nonpristine_meta.csv

  second:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: v351-julaug-prepare
          path: .
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage second
      - uses: actions/upload-artifact@v4
        with:
          name: v351-julaug-second
          path: cache_v321_julaug_second.pkl

  base-third:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: v351-julaug-prepare
          path: .
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage base-third
      - uses: actions/upload-artifact@v4
        with:
          name: v351-julaug-base-third
          path: cache_v321_julaug_base_pc.pkl

  third:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: v351-julaug-prepare
          path: .
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage third
      - uses: actions/upload-artifact@v4
        with:
          name: v351-julaug-third
          path: cache_v321_julaug_third.pkl

  production-regression:
    needs: [prepare, second, base-third, third]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: v351-julaug-prepare
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: v351-julaug-second
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: v351-julaug-base-third
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: v351-julaug-third
          path: .
      - name: Run independent production regression
        run: python run_v351_1head_production_regression.py
      - name: Show result
        if: always()
        run: cat /tmp/v351-production-audit/result_v351_production_regression.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v351-1head-production-regression
          path: /tmp/v351-production-audit/
