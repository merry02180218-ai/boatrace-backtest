name: v321 Jul-Aug NON-PRISTINE validation

on:
  push:
    paths:
      - 'run_v321_1head_julaug_nonpristine_validation.py'
      - '.github/workflows/research-20260913-v321-julaug-nonpristine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Require development inputs
        run: |
          test -f analysis_v308_1head_volume_opponent_joint_pred.csv
          test -f CACHE_V313_1HEAD_OPPONENT_CAUSAL.md
      - name: Prepare Jul-Aug causal NON-PRISTINE cache
        run: python run_v321_1head_julaug_nonpristine_validation.py --stage prepare
      - uses: actions/upload-artifact@v4
        with:
          name: v321-julaug-prepare
          path: |
            cache_v321_julaug_nonpristine_slim.csv.gz
            cache_v321_julaug_nonpristine_head.csv
            cache_v321_julaug_nonpristine_meta.csv

  evaluate:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: v321-julaug-prepare
          path: .
      - name: Require causal opponent caches
        run: |
          test -f cache_v313_1head_opponent_p3.csv.gz
          test -f cache_v313_1head_opponent_p4.csv.gz
          test -f cache_v321_julaug_nonpristine_slim.csv.gz
          test -f cache_v321_julaug_nonpristine_head.csv
          test -f cache_v321_julaug_nonpristine_meta.csv
      - name: Evaluate frozen SECOND THIRD and ticket policy
        run: python run_v321_1head_julaug_nonpristine_validation.py --stage evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: v321-julaug-nonpristine
          path: |
            analysis_v321_1head_julaug_nonpristine_validation_*.csv
            summary_v321_1head_julaug_nonpristine_validation.md
      - name: Commit v321 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v321_1head_julaug_nonpristine_validation_*.csv summary_v321_1head_julaug_nonpristine_validation.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add v321 Jul-Aug NON-PRISTINE validation results'
            git push
          fi
