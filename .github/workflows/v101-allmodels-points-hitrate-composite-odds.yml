name: v101-allmodels-points-hitrate-composite-odds
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v101_allmodels_points_hitrate_composite_odds.py'
      - '.github/workflows/v101-allmodels-points-hitrate-composite-odds.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v101 all-model point analysis
        run: python analyze_v101_allmodels_points_hitrate_composite_odds.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v101_allmodels_points_hitrate_composite_odds.csv summary_v101_allmodels_points_hitrate_composite_odds.md
          if ! git diff --cached --quiet; then
            git commit -m "Add v101 all-model hit rate and composite odds results"
            git pull --rebase origin main
            git push
          fi
