name: v215 3head strict walkforward overfit audit
on:
  push:
    paths:
      - 'analyze_v215_3head_strict_walkforward_overfit_audit.py'
      - '.github/workflows/v215-3head-strict-walkforward-overfit-audit.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - run: python analyze_v215_3head_strict_walkforward_overfit_audit.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v215_3head_strict_walkforward_overfit_audit.csv summary_v215_3head_strict_walkforward_overfit_audit.md
          git commit -m 'Add v215 strict walk-forward overfit audit results' || exit 0
          git push
