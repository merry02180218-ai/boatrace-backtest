name: scan-20260911-3head-v288-pre
on:
  push:
    paths:
      - 'scan_20260911_3head_v288_pre.py'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn catboost requests beautifulsoup4 lhafile
      - name: Download frozen canonical artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34383567078 --repo merry02180218-ai/boatrace-backtest --name v243-3head-expand-feature-audit --dir golden_v243
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
          gh run download 34326743303 --repo merry02180218-ai/boatrace-backtest --name v234-3head-waku10-restored-replay --dir golden_v234
          cp golden_v234/analysis_v234_waku10_reconstruction_coverage.csv .
          mkdir -p data/audit
          cp -r golden_v234/data/audit/v234_waku10 data/audit/
      - name: Build today's race-card and Waku10 directly from Boatcast
        run: |
          git clone -q --depth 1 https://github.com/BoatraceCSV/boatracecsv.github.io.git upstream_boatracecsv
          mkdir -p current_input
          PYTHONPATH=upstream_boatracecsv/scripts python - <<'PY'
          from pathlib import Path
          from boatrace.race_card_scraper import RaceCardScraper
          from boatrace.downloader import RateLimiter
          from boatrace.converter import race_cards_to_csv,waku10_to_csv
          day='2026-09-11'
          # Official BOAT RACE 2026-09-11 holding list at scan time.
          venues=[2,3,5,6,12,13,14,16,17,20,21,24]
          sc=RaceCardScraper(timeout_seconds=12,rate_limiter=RateLimiter(interval_seconds=.08))
          cards=[]; waku=[]
          for jo in venues:
              for r in range(1,13):
                  a=sc.scrape_race(day,jo,r)
                  b=sc.scrape_waku10(day,jo,r)
                  if a is not None: cards.append(a)
                  if b is not None: waku.append(b)
          print('DIRECT_CURRENT',len(cards),len(waku),flush=True)
          if not cards or not waku: raise SystemExit('current Boatcast scrape empty')
          Path('current_input/race_cards.csv').write_text(race_cards_to_csv(cards),encoding='utf-8')
          Path('current_input/waku10.csv').write_text(waku10_to_csv(waku),encoding='utf-8')
          PY
      - name: Run result-blind PRE scan
        run: python scan_20260911_3head_v288_pre.py
      - uses: actions/upload-artifact@v4
        with:
          name: scan-20260911-3head-v288-pre
          path: |
            scan_20260911_3head_v288_pre.csv
            scan_20260911_3head_v288_pre.md
            current_input/race_cards.csv
            current_input/waku10.csv
