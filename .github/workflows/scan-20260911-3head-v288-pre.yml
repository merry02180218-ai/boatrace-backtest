name: scan-20260911-3head-v288-pre
on:
  push:
    paths:
      - 'scan_20260911_3head_v288_pre.py'
      - '.github/workflows/scan-20260911-3head-v288-pre.yml'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests beautifulsoup4 pandas lxml
      - name: Probe Kyoteibiyori current page
        run: |
          python - <<'PY'
          import requests,re
          u='https://kyoteibiyori.com/race_shusso.php?hiduke=20260911&place_no=16&race_no=1&slider=1'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=20)
          print('STATUS',r.status_code,'LEN',len(r.text))
          print('HAS10', '直近10走比較表' in r.text)
          for pat in ['直近10走比較表','枠別平均ST','過去10走','モータ2連']:
            print(pat, r.text.find(pat))
          open('kyotei_probe.html','w',encoding='utf-8').write(r.text)
          print(re.sub(r'\s+',' ',r.text[r.text.find('直近10走比較表')-500:r.text.find('直近10走比較表')+3000]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyoteibiyori-probe-20260911
          path: kyotei_probe.html
