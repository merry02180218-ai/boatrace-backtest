name: scan-20260911-3head-v288-pre
on:
  push:
    paths:
      - 'fetch_kyoteibiyori_v288_pre_inputs.py'
      - 'scan_20260911_3head_v288_pre.py'
      - 'build_20260911_3head_v288_live_cache.py'
      - 'build_20260911_3head_v288_daily_bundle.py'
      - 'run_20260911_3head_v288_live.py'
      - '.github/workflows/scan-20260911-3head-v288-pre.yml'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn catboost requests beautifulsoup4 joblib
      - name: Download frozen canonical artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34383567078 --repo merry02180218-ai/boatrace-backtest --name v243-3head-expand-feature-audit --dir golden_v243
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
          gh run download 34326743303 --repo merry02180218-ai/boatrace-backtest --name v234-3head-waku10-restored-replay --dir golden_v234
          cp golden_v234/analysis_v234_waku10_reconstruction_coverage.csv .
          mkdir -p data/audit
          cp -r golden_v234/data/audit/v234_waku10 data/audit/
      - name: Build current PRE inputs from Kyoteibiyori
        run: python fetch_kyoteibiyori_v288_pre_inputs.py
      - name: Build result-blind PRE scan and frozen deadline cache once
        run: python build_20260911_3head_v288_daily_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: scan-20260911-3head-v288-pre
          path: |
            current_input/race_cards.csv
            current_input/waku10.csv
            scan_20260911_3head_v288_pre.csv
            scan_20260911_3head_v288_pre.md
            cache_20260911_3head_v288_live.joblib
# rerun-marker: 2026-09-11-single-pass-bundle
