name: scan-20260911-3head-v288-pre
on:
  push:
    paths:
      - 'scan_20260911_3head_v288_pre.py'
      - '.github/workflows/scan-20260911-3head-v288-pre.yml'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests beautifulsoup4 pandas lxml
      - name: Inspect Kyoteibiyori JS
        run: |
          python - <<'PY'
          import requests,re
          h={'User-Agent':'Mozilla/5.0'}
          for u in ['https://kyoteibiyori.com/js/race_shusso.js?242','https://kyoteibiyori.com/js/user_custom.js?23']:
            r=requests.get(u,headers=h,timeout=20)
            print('URL',u,'STATUS',r.status_code,'LEN',len(r.text))
            for m in re.finditer(r'(?:url\s*:\s*["\']([^"\']+)|request_[A-Za-z0-9_./-]+\.php|kako10|直近10)',r.text,re.I):
              i=m.start(); print(re.sub(r'\s+',' ',r.text[max(0,i-350):i+700])[:1050])
            open('js_'+str(abs(hash(u)))+'.txt','w',encoding='utf-8').write(r.text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyoteibiyori-js-probe-20260911
          path: js_*.txt
