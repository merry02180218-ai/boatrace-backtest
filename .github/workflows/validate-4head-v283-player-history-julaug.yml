name: validate-4head-v283-player-history-julaug
on:
  workflow_dispatch:
  push:
    paths:
      - 'build_4head_v283_player_history_julaug.py'
      - 'verify_4head_v283_player_history_julaug.py'
      - '.github/workflows/validate-4head-v283-player-history-julaug.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile build_4head_v283_player_history_julaug.py verify_4head_v283_player_history_julaug.py
      - name: Verify causal player-history contract
        run: python verify_4head_v283_player_history_julaug.py | tee head4-v283-player-history-julaug-verify.txt
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: head4-v283-player-history-julaug-verify
          path: head4-v283-player-history-julaug-verify.txt
          if-no-files-found: error
