name: v37-environment
on:
  push:
    paths:
      - 'analyze_v37_environment.py'
      - '.github/workflows/v37-environment.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python analyze_v37_environment.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v37_environment.md analysis_v37_environment.csv
          git diff --cached --quiet || git commit -m "Add v37 environment results"
          git push
