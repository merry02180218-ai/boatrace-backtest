name: legacy-4head-research-trigger-only
on: [push]
jobs:
  run:
    if: contains(github.event.head_commit.message, 'start 4-head exhibition original study')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scikit-learn requests beautifulsoup4
      - run: |
          set -o pipefail
          grep -q "END=date(2026,8,31)" analyze_4head_exhibition_original_trainonly.py
          grep -q "September outcome access blocked" analyze_4head_exhibition_original_trainonly.py
          grep -q "turn_available" analyze_4head_exhibition_original_trainonly.py
          grep -q "straight_available" analyze_4head_exhibition_original_trainonly.py
          grep -q "orig_avg_available" analyze_4head_exhibition_original_trainonly.py
          python analyze_4head_exhibition_original_trainonly.py | tee /tmp/run.log
          cp /tmp/run.log /tmp/head4_exhibition/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: head4-exhibition-original-trainonly-v2
          retention-days: 14
          path: /tmp/head4_exhibition/*
