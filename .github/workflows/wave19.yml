name: wave19-production276-rescue-audit

# trigger 20260917-final5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wave19.yml'
      - 'analyze_v351_wave19_production276_rescue_audit.py'
      - 'onehead_production_profile.py'

jobs:
  wave19:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy scikit-learn requests beautifulsoup4
      - name: Prepare frozen production data
        run: python run_v321_1head_julaug_nonpristine_validation.py --stage prepare
      - name: Audit canonical production 276R
        run: python analyze_v351_wave19_production276_rescue_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave19-production276-rescue-audit
          path: /tmp/wave19
