name: v221 3-head scenario pair audit
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'analyze_v221_3head_scenario_pair.py'
      - '.github/workflows/v221-3head-scenario-pair.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn
      - name: Compile
        run: python -m py_compile analyze_v221_3head_scenario_pair.py
      - name: Run v221 clean audit
        run: python analyze_v221_3head_scenario_pair.py
      - name: Contamination guard
        run: |
          python - <<'PY'
          import pandas as pd
          a=pd.read_csv('analysis_v221_3head_scenario_pair.csv')
          assert len(a)>0
          d=pd.to_datetime(a['date'])
          assert (d < pd.Timestamp('2026-07-01')).all()
          assert set(a['month']).issubset({'2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'})
          print('guard ok',len(a))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v221-3head-scenario-pair
          path: |
            analysis_v221_3head_scenario_pair.csv
            summary_v221_3head_scenario_pair.md
