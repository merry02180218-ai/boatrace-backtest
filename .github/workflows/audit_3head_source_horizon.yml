name: audit-3head-source-horizon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/run_3head_source_horizon_audit.py'
      - '.github/workflows/audit_3head_source_horizon.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Download frozen Wave21 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10317157868/zip > /tmp/wave21.zip
          unzip -oq /tmp/wave21.zip -d /tmp/wave21
          SRC=$(find /tmp/wave21 -type f -name 'analysis_v289_3head_wave21_allrace_feature_settled.csv' | head -1)
          test -n "$SRC"
          cp "$SRC" analysis_v289_3head_wave21_allrace_feature_settled.csv
      - name: Audit source horizon and recent-meet schema
        run: python research/run_3head_source_horizon_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-3head-source-horizon
          path: research_3head_source_horizon_audit.json
          if-no-files-found: ignore
