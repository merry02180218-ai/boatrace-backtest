name: v172 3head venue development OOS
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v172_3head_venue_development_oos.py'
      - '.github/workflows/v172-3head-venue-development-oos.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn
      - name: Run v172
        run: python analyze_v172_3head_venue_development_oos.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v172_3head_venue_development_oos.csv summary_v172_3head_venue_development_oos.md
          git diff --cached --quiet || git commit -m "Add v172 venue development OOS results"
          git push
