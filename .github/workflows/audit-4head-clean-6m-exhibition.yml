name: audit-4head-clean-6m-exhibition
on:
  workflow_dispatch:
  push:
    paths:
      - 'audit_4head_clean_6m_exhibition.py'
      - '.github/workflows/audit-4head-clean-6m-exhibition.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
          sparse-checkout: |
            data/programs/race_cards/2026/03
            data/programs/race_cards/2026/04
            data/programs/race_cards/2026/05
            data/programs/race_cards/2026/06
            data/programs/race_cards/2026/07
            data/programs/race_cards/2026/08
            data/results/realtime/2026/03
            data/results/realtime/2026/04
            data/results/realtime/2026/05
            data/results/realtime/2026/06
            data/results/realtime/2026/07
            data/results/realtime/2026/08
            data/previews/tkz
            data/previews/stt
            data/previews/original_exhibition
      - run: pip install -q numpy pandas scikit-learn scipy
      - env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python audit_4head_clean_6m_exhibition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-clean-6m-exhibition
          path: /tmp/head4_clean_6m_exhibition/
          retention-days: 30
