name: v152 Jun Jul strict agreement ROI
on:
  push:
    paths:
      - 'analyze_v152_jun_jul_strict_agreement_roi.py'
      - '.github/workflows/v152-jun-jul-strict-agreement-roi.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn requests pandas
      - name: Run v152
        run: python analyze_v152_jun_jul_strict_agreement_roi.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add analysis_v152_jun_jul_strict_agreement_roi.csv summary_v152_jun_jul_strict_agreement_roi.md
          git diff --cached --quiet || git commit -m 'Add v152 Jun Jul strict agreement ROI results'
          git push
