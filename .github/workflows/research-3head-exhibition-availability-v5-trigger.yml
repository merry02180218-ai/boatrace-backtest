name: research-3head-exhibition-availability-v5-trigger
on:
  push:
    branches: [main]
    paths: ['.github/workflows/research-3head-exhibition-availability-v5-trigger.yml']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/3head-player-attack-mode
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - run: python research/audit_3head_exhibition_availability_v5.py | tee research_v289_3head_exhibition_availability_v5.log
      - uses: actions/upload-artifact@v4
        with:
          name: research-3head-exhibition-availability-v5
          path: |
            research_v289_3head_exhibition_availability_v5.csv
            research_v289_3head_exhibition_availability_v5.log
