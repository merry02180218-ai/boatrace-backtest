name: v54-relative-4corner

on:
  push:
    paths:
      - 'backtest_v54_relative_4corner.py'
      - '.github/workflows/v54-relative-4corner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v54 relative 4-corner
        run: python backtest_v54_relative_4corner.py
      - name: Commit v54 results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add summary_v54_relative_4corner.md analysis_v54_relative_4corner.csv
          git diff --cached --quiet || git commit -m "Add v54 relative 4-corner results"
          git push
