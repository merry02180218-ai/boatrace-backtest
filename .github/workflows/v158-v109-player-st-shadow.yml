name: v158 v109 player ST shadow
on:
  push:
    paths:
      - 'analyze_v158_v109_player_st_shadow.py'
      - '.github/workflows/v158-v109-player-st-shadow.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn requests pandas beautifulsoup4
      - name: Run v158
        run: python analyze_v158_v109_player_st_shadow.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add analysis_v158_v109_player_st_shadow.csv summary_v158_v109_player_st_shadow.md
          git diff --cached --quiet || git commit -m 'Add v158 v109 player ST shadow results'
          git push
