name: v261-4head-old-vs-new-monthly
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v261_4head_old_vs_new_monthly.py'
      - '.github/workflows/v261-4head-old-vs-new-monthly.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python analyze_v261_4head_old_vs_new_monthly.py
      - uses: actions/upload-artifact@v4
        with:
          name: v261-4head-old-vs-new-monthly
          path: summary_v261_4head_old_vs_new_monthly.md
