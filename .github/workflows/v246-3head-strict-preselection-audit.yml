name: v246 3-head strict preselection audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v246_3head_strict_preselection_audit.py'
      - '.github/workflows/v246-3head-strict-preselection-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn requests
      - name: Download canonical cached v243 artifact
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io
          u='https://api.github.com/repos/merry02180218-ai/boatrace-backtest/actions/artifacts/10118044294/zip'
          req=urllib.request.Request(u,headers={'Authorization':'Bearer ${{ github.token }}','Accept':'application/vnd.github+json'})
          b=urllib.request.urlopen(req).read()
          zipfile.ZipFile(io.BytesIO(b)).extractall('.')
          PY
      - name: Run v246 strict PRE audit
        run: python analyze_v246_3head_strict_preselection_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v246-3head-strict-preselection-audit
          path: |
            analysis_v246_3head_strict_preselection_audit.csv
            summary_v246_3head_strict_preselection_audit.md
