name: v246 3-head strict preselection audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v246_3head_strict_preselection_audit.py'
      - '.github/workflows/v246-3head-strict-preselection-audit.yml'
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn requests
      - name: Download canonical cached v243 artifact
        uses: actions/download-artifact@v4
        with:
          name: v243-3head-expand-feature-audit
          path: .
          repository: merry02180218-ai/boatrace-backtest
          run-id: 34383567078
          github-token: ${{ github.token }}
      - name: Run v246 strict PRE audit
        run: python analyze_v246_3head_strict_preselection_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v246-3head-strict-preselection-audit
          path: |
            analysis_v246_3head_strict_preselection_audit.csv
            summary_v246_3head_strict_preselection_audit.md
