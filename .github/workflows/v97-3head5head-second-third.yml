name: v97-3head5head-second-third
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v97_3head5head_second_third.py'
      - '.github/workflows/v97-3head5head-second-third.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v97 second-third diagnostic
        run: python analyze_v97_3head5head_second_third.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v97_3head5head_second_third.csv summary_v97_3head5head_second_third.md
          git diff --cached --quiet || git commit -m 'Add v97 3-head 5-head second-third results'
          git push
