name: v290 4head Top4 composite risk audit

on:
  push:
    paths:
      - 'analyze_v290_4head_top4_comp_risk_audit.py'
      - '.github/workflows/v290-4head-top4-comp-risk-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python analyze_v290_4head_top4_comp_risk_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v290-4head-top4-comp-risk-audit
          path: |
            analysis_v290_4head_top4_comp_risk_summary.csv
            analysis_v290_4head_top4_comp_monthly.csv
            analysis_v290_4head_top4_comp_layer.csv
            analysis_v290_4head_top4_comp_venue.csv
            analysis_v290_4head_top4_comp_selected_detail.csv
            summary_v290_4head_top4_comp_risk_audit.md
      - name: Commit v290 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v290_4head_top4_comp_risk_summary.csv analysis_v290_4head_top4_comp_monthly.csv analysis_v290_4head_top4_comp_layer.csv analysis_v290_4head_top4_comp_venue.csv analysis_v290_4head_top4_comp_selected_detail.csv summary_v290_4head_top4_comp_risk_audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add v290 Top4 composite risk audit results'
          git pull --rebase origin main
          git push origin HEAD:main
