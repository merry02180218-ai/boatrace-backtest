name: v91-st-weight-walkforward

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_v91_st_weight_walkforward.py'
      - '.github/workflows/v91-st-weight-walkforward.yml'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v91 ST weight walk-forward
        run: python backtest_v91_st_weight_walkforward.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v91_st_weight_walkforward.csv summary_v91_st_weight_walkforward.md
          git diff --cached --quiet || git commit -m "Add v91 ST weight walk-forward results"
          git push
