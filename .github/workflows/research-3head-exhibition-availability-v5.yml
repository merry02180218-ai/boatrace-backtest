name: research-3head-exhibition-availability-v5
on:
  push:
    branches: [research/3head-player-attack-mode]
    paths:
      - 'research/audit_3head_exhibition_availability_v5.py'
      - '.github/workflows/research-3head-exhibition-availability-v5.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - name: Audit exhibition availability
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/research" python research/audit_3head_exhibition_availability_v5.py | tee research_v289_3head_exhibition_availability_v5.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-exhibition-availability-v5
          path: |
            research_v289_3head_exhibition_availability_v5.csv
            research_v289_3head_exhibition_availability_v5.log
