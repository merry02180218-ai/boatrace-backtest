name: v35-tilt-interaction
on:
  push:
    paths:
      - 'backtest_v35_tilt_interaction.py'
      - '.github/workflows/v35-tilt-interaction.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python backtest_v35_tilt_interaction.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v35_tilt_interaction.md races_v35_tilt_interaction.csv
          git diff --cached --quiet || git commit -m "Save v35 tilt interaction results"
          git push
