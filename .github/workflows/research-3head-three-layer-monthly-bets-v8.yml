name: research-3head-three-layer-monthly-bets-v8
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research/run_3head_three-layer-monthly-bets-v8.trigger
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn requests
      - name: Download frozen v243 CORE membership source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p golden
          gh run download 34383567078 --repo ${{ github.repository }} --name v243-3head-expand-feature-audit --dir golden
          cp golden/analysis_v243_3head_expand_feature_audit.csv .
          test -s analysis_v243_3head_expand_feature_audit.csv
      - name: Preflight
        run: |
          python -m py_compile research/run_3head_three_layer_monthly_bets_v8.py research/run_3head_a60_playerhistory_curve_v1.py analyze_3head_player_history_3v2_ablation_v2.py research/run_3head_wave20_manual_gate.py verify_v288_operational_pre_replay.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('research/run_3head_three_layer_monthly_bets_v8.py')
          s=p.read_text()
          ast.parse(s)
          assert chr(92)+'n' not in s
          assert "MISSING_FROZEN_V243_CORE_SOURCE" in s
          assert "analysis_v243_3head_expand_feature_audit.csv" in s
          assert "core_codes=set(core.race_code)" in s
          assert "CORE>A60>FULL3V2" in s
          print('STATIC_PREFLIGHT_OK')
          PY
          ! grep -E '2026[-/, ]*09|202609' research/run_3head_three_layer_monthly_bets_v8.py
      - name: Run exact layered audit
        run: python research/run_3head_three_layer_monthly_bets_v8.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-three-layer-monthly-bets-v8
          path: |
            research_3head_three_layer_monthly_bets_v8.json
            research_3head_three_layer_monthly_bets_v8.csv
          retention-days: 30
