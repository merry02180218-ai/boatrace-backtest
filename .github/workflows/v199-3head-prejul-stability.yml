name: v199 3head pre-Jul stability
on:
  push:
    paths:
      - 'analyze_v199_3head_prejul_stability.py'
      - '.github/workflows/v199-3head-prejul-stability.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas
      - run: python analyze_v199_3head_prejul_stability.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v199_3head_prejul_stability.csv summary_v199_3head_prejul_stability.md
          git diff --cached --quiet || git commit -m 'Add v199 pre-Jul stability results'
          git pull --rebase
          git push
