name: manual-live-1head-v351-exhibition

# Manual LIVE only: no cron/push. Any race_code may be requested.
'on':
  workflow_dispatch:
    inputs:
      race_code:
        description: '12-digit race code (YYYYMMDDJJRR)'
        required: true
        type: string
permissions: {contents: read, actions: read}
jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo '1HEAD AUTO LIVE DISABLED'
