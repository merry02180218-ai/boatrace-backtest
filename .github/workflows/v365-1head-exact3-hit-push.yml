name: v365 1-head exact3 hit push
on:
  push:
    paths:
      - 'run_v365_1head_exact3_hit_push.py'
      - '.github/workflows/v365-1head-exact3-hit-push.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Download v360 prepared artifact
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" > /tmp/v360.zip
          mkdir -p /tmp/v360
          unzip -q /tmp/v360.zip -d /tmp/v360
          test -f /tmp/v360/prepared_rows.pkl
      - name: Run exact3 hit push audit
        run: python run_v365_1head_exact3_hit_push.py --prepared /tmp/v360/prepared_rows.pkl
      - name: Show result
        if: always()
        run: |
          cat /tmp/v365-exact3-hit-push/result.json 2>/dev/null || true
          cat /tmp/v365-exact3-hit-push/monthly_live165.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v365-exact3-hit-push-${{ github.run_id }}
          path: /tmp/v365-exact3-hit-push/
          retention-days: 30
