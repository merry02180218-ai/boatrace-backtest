name: v89-4corner-venue-wind-walkforward
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_v89_4corner_venue_wind_walkforward.py'
      - '.github/workflows/v89-4corner-venue-wind-walkforward.yml'
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v89 4-corner venue-wind walk-forward
        run: python -u backtest_v89_4corner_venue_wind_walkforward.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898218+github-actions[bot]@users.noreply.github.com"
          git add summary_v89_4corner_venue_wind_walkforward.md analysis_v89_4corner_venue_wind_walkforward.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add v89 4-corner venue-wind results"
            git pull --rebase origin main
            git push
          fi
