name: analyze-4head-v283-rescue-close-margin
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn
      - name: Analyze rescue and close-margin ticket expansion
        run: python analyze_4head_v283_rescue_close_margin.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-v283-rescue-close-margin
          path: /tmp/head4_v283_rescue_margin/
          if-no-files-found: warn
