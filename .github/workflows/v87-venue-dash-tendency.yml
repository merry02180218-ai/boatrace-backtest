name: v87-venue-dash-tendency
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v87_venue_dash_tendency.py'
      - '.github/workflows/v87-venue-dash-tendency.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v87 venue dash tendency analysis
        run: python -u analyze_v87_venue_dash_tendency.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v87_venue_dash_tendency.md analysis_v87_venue_dash_tendency.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add v87 venue dash tendency results"
            git pull --rebase origin main
            git push
          fi
