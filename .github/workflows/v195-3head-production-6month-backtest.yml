name: v195 3head production 6month backtest
on:
  push:
    paths:
      - 'analyze_v195_3head_production_6month_backtest.py'
      - '.github/workflows/v195-3head-production-6month-backtest.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - run: python analyze_v195_3head_production_6month_backtest.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v195_3head_production_6month_backtest.csv summary_v195_3head_production_6month_backtest.md
          git diff --cached --quiet || git commit -m 'Add v195 3head production six-month backtest results'
          git pull --rebase
          git push
