name: audit-3head-union-head53-opponent-v15
on:
  push:
    paths: [research/run_3head_union_head53_opponent_v15.fire]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scikit-learn requests
      - name: Download CORE107
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p core107
          gh run download 35892602362 --repo ${{ github.repository }} --name research-3head-newcore-fast-v20 --dir core107
      - run: python -m py_compile research/audit_3head_union_head53_opponent_v15.py
      - run: python research/audit_3head_union_head53_opponent_v15.py | tee union_head53_v15.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-3head-union-head53-opponent-v15
          path: |
            union_head53_v15.log
            accepted_union_identity_v15.csv
            accepted_union_head53_opponents_v15.csv
