name: research-3head-split-route-v27
on:
  push:
    paths: [research/run_3head_split_route_v27.fire]
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scikit-learn requests
      - name: Download CORE107
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p core107
          gh run download 35892602362 --repo ${{ github.repository }} --name research-3head-newcore-fast-v20 --dir core107
      - name: Preflight compile
        run: python -m py_compile research/research_3head_split_route_v27.py
      - name: Run split-route research
        shell: bash
        run: |
          set -o pipefail
          python research/research_3head_split_route_v27.py | tee split_route_v27.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-split-route-v27
          path: |
            split_route_v27.log
            split_route_research_v27.csv
