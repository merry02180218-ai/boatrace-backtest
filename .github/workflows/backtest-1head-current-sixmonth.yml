name: 1HEAD current six-month backtest
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  backtest:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        shell: powershell
        run: |
          python -c "import numpy,pandas,sklearn,requests,bs4,lxml" 2>$null
          if ($LASTEXITCODE -ne 0) { python -m pip install -q --disable-pip-version-check numpy pandas 'scikit-learn==1.6.1' requests beautifulsoup4 lxml }
      - name: Compile
        shell: powershell
        run: python -m py_compile backtest_1head_current_sixmonth.py
      - name: Download frozen prepared
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'v360'
          $zip=Join-Path $env:RUNNER_TEMP 'v360.zip'
          if (-not (Test-Path (Join-Path $root 'prepared_rows.pkl'))) {
            if (Test-Path $root) { Remove-Item -Recurse -Force $root }
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $headers=@{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
            Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" -Headers $headers -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
            $prep=Get-ChildItem -Path $root -Recurse -File | Where-Object { $_.Extension -in '.pkl','.pickle' } | Select-Object -First 1
            if (-not $prep) { throw 'No prepared pickle' }
            Copy-Item $prep.FullName (Join-Path $root 'prepared_rows.pkl') -Force
          }
          "PREP=$(Join-Path $root 'prepared_rows.pkl')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
      - name: Run
        shell: powershell
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python backtest_1head_current_sixmonth.py --prepared "$env:PREP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 1head-current-sixmonth-${{ github.run_id }}
          path: ${{ runner.temp }}/1head-current-sixmonth
