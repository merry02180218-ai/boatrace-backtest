name: v313 opponent causal cache

on:
  workflow_dispatch:
  push:
    paths:
      - 'build_v313_1head_opponent_causal_cache.py'
      - '.github/workflows/research-20260913-v313-opponent-causal-cache.yml'

permissions:
  contents: write

jobs:
  build-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Build reusable causal cache once
        run: python build_v313_1head_opponent_causal_cache.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v313-opponent-causal-cache
          path: |
            cache_v313_1head_opponent_pre.csv.gz
            cache_v313_1head_opponent_p3.csv.gz
            cache_v313_1head_opponent_p4.csv.gz
            CACHE_V313_1HEAD_OPPONENT_CAUSAL.md
          if-no-files-found: error
      - name: Commit cache
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache_v313_1head_opponent_pre.csv.gz cache_v313_1head_opponent_p3.csv.gz cache_v313_1head_opponent_p4.csv.gz CACHE_V313_1HEAD_OPPONENT_CAUSAL.md
          git diff --cached --quiet || git commit -m 'Add v313 reusable opponent causal cache'
          git pull --rebase origin main
          git push
