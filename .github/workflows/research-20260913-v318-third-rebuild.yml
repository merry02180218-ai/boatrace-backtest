name: v318 conditional THIRD rebuild
on:
  push:
    paths:
      - 'run_v318_1head_opponent_third_rebuild.py'
      - '.github/workflows/research-20260913-v318-third-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Require reusable causal cache
        run: |
          test -f CACHE_V313_1HEAD_OPPONENT_CAUSAL.md
          test -f cache_v313_1head_opponent_pre.csv.gz
          test -f cache_v313_1head_opponent_p3.csv.gz
          test -f cache_v313_1head_opponent_p4.csv.gz
      - name: Run v318 conditional THIRD rebuild
        run: python run_v318_1head_opponent_third_rebuild.py
      - uses: actions/upload-artifact@v4
        with:
          name: v318-third-rebuild
          path: |
            summary_v318_1head_opponent_third_rebuild.md
            analysis_v318_1head_opponent_third_rebuild_*.csv
      - name: Commit v318 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add summary_v318_1head_opponent_third_rebuild.md analysis_v318_1head_opponent_third_rebuild_*.csv
          git diff --cached --quiet || git commit -m 'Add v318 conditional THIRD results'
          git pull --rebase origin main
          git push
