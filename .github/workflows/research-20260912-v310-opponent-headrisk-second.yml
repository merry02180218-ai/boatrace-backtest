name: v310 opponent headrisk second
on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v310_1head_opponent_headrisk_second.py'
      - '.github/workflows/research-20260912-v310-opponent-headrisk-second.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Run v310 opponent headrisk second
        run: python run_v310_1head_opponent_headrisk_second.py
      - uses: actions/upload-artifact@v4
        with:
          name: v310-opponent-headrisk-second
          path: |
            analysis_v310_1head_opponent_headrisk_second_*.csv
            summary_v310_1head_opponent_headrisk_second.md
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v310_1head_opponent_headrisk_second_*.csv summary_v310_1head_opponent_headrisk_second.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add v310 opponent headrisk outputs'
          git pull --rebase origin main
          git push origin HEAD:main
