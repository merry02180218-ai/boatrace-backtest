name: v128-allmodels-sixmonth-7ticket-composite
on:
  push:
    paths:
      - 'analyze_v128_allmodels_sixmonth_7ticket_composite.py'
      - '.github/workflows/v128-allmodels-sixmonth-7ticket-composite.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn requests beautifulsoup4
      - run: python analyze_v128_allmodels_sixmonth_7ticket_composite.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add analysis_v128_allmodels_sixmonth_7ticket_composite.csv summary_v128_allmodels_sixmonth_7ticket_composite.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate v128 six-month all-model 7-ticket results"
            git pull --rebase origin main
            git push
          fi
