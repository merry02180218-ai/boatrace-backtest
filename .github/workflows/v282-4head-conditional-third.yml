name: v282 4head conditional third

on:
  push:
    paths:
      - 'analyze_v282_4head_conditional_third.py'
      - '.github/workflows/v282-4head-conditional-third.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn
      - run: python analyze_v282_4head_conditional_third.py
      - uses: actions/upload-artifact@v4
        with:
          name: v282-conditional-third
          path: |
            analysis_v282_4head_conditional_third.csv
            analysis_v282_4head_conditional_third_grid.csv
            analysis_v282_4head_conditional_pair_grid.csv
            analysis_v282_4head_conditional_monthly.csv
            analysis_v282_4head_conditional_third_coefficients.csv
            summary_v282_4head_conditional_third.md
      - name: Commit v282 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v282_4head_conditional_third.csv analysis_v282_4head_conditional_third_grid.csv analysis_v282_4head_conditional_pair_grid.csv analysis_v282_4head_conditional_monthly.csv analysis_v282_4head_conditional_third_coefficients.csv summary_v282_4head_conditional_third.md
          git diff --cached --quiet || git commit -m 'Add v282 conditional third results'
          git pull --rebase origin main
          git push origin HEAD:main
