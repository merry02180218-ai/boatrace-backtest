name: 1HEAD PLAYER_HISTORY expansion audit
on:
  push:
    branches: [ research/1head-player-history-expansion ]
    paths:
      - 'run_1head_player_history_expansion.py'
      - 'build_4head_player_history_live.py'
      - '.github/workflows/onehead-player-history-expansion.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Download frozen v360 prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" > /tmp/v360.zip
          mkdir -p /tmp/v360
          unzip -q /tmp/v360.zip -d /tmp/v360
          PREP=$(find /tmp/v360 -type f \( -name '*.pkl' -o -name '*.pickle' \) -print -quit)
          test -n "$PREP"
          echo "PREP=$PREP" >> "$GITHUB_ENV"
      - name: Run causal PLAYER_HISTORY coverage audit
        run: python run_1head_player_history_expansion.py --prepared "$PREP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onehead-player-history-expansion-${{ github.run_id }}
          path: /tmp/1head-player-history-expansion
          retention-days: 30
