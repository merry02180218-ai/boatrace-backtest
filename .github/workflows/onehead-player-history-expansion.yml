name: 1HEAD PLAYER_HISTORY expansion audit
on:
  push:
    branches: [ research/1head-player-history-expansion ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner Python
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python -c "import sys; print(sys.executable)"
      - name: Install research dependencies
        run: python -m pip install -q --disable-pip-version-check numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Download frozen v360 prepared artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'v360'
          $zip = Join-Path $env:RUNNER_TEMP 'v360.zip'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" -Headers $headers -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $prep = Get-ChildItem -Path $root -Recurse -File | Where-Object { $_.Extension -in '.pkl', '.pickle' } | Select-Object -First 1
          if (-not $prep) { throw 'No prepared pickle found in frozen v360 artifact' }
          "PREP=$($prep.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
      - name: Run causal PLAYER_HISTORY coverage audit
        shell: powershell
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python run_1head_player_history_expansion.py --prepared "$env:PREP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onehead-player-history-expansion-${{ github.run_id }}
          path: ${{ runner.temp }}/1head-player-history-expansion
          retention-days: 30
