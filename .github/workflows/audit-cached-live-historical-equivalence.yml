name: audit cached LIVE historical equivalence

on:
  workflow_dispatch:
  push:
    paths:
      - audit_cached_live_historical_equivalence.py
      - backtest.py
      - .github/workflows/audit-cached-live-historical-equivalence.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Canonical external-data snapshot immediately preceding frozen v243 run 34383567078.
      # LIVE code still defaults to BoatraceCSV main when this env var is absent.
      BOATRACECSV_REF: f4552b6a02b5cf3eb78e85eb650f4a1b1a4cd39b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy scikit-learn requests beautifulsoup4 joblib
      - name: Download frozen restored-Waku10 cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34326743303 --repo ${{ github.repository }} --name v234-3head-waku10-restored-replay --dir .
          test -f analysis_v234_waku10_reconstruction_coverage.csv
          test -f data/audit/v234_waku10/restored/2026/08/31.csv
      - name: Download frozen v243 golden artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p golden_v243
          gh run download 34383567078 --repo ${{ github.repository }} --name v243-3head-expand-feature-audit --dir golden_v243
          test -f golden_v243/analysis_v243_3head_expand_feature_audit.csv
      - name: Run equivalence audit
        id: equivalence
        continue-on-error: true
        run: python audit_cached_live_historical_equivalence.py
      - name: Record diagnostic verdict
        if: always()
        run: |
          echo "equivalence_outcome=${{ steps.equivalence.outcome }}"
          if [ "${{ steps.equivalence.outcome }}" = "failure" ]; then
            echo "MODEL_EQUIVALENCE=FAIL (diagnostic mismatch; artifacts retained for investigation)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MODEL_EQUIVALENCE=PASS" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cached-live-historical-equivalence
          path: |
            audit_cached_live_historical_equivalence.csv
            audit_cached_live_historical_equivalence.json
            summary_cached_live_historical_equivalence.md
          if-no-files-found: ignore
