name: research-3head-a-loss-patterns
'on':
  workflow_dispatch: {}
  push:
    paths:
      - '.github/triggers/research-3head-a-loss-patterns.txt'
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas tabulate
      - name: Download frozen March adopted audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10588428193/zip > /tmp/a.zip
          unzip -oq /tmp/a.zip -d /tmp/a
          find /tmp/a -type f -maxdepth 3 -print
          D=$(find /tmp/a -type f -name '*summary*.json' | head -1)
          test -n "$D"
          cp "$D" research_3head_a_purchase_gate_march_summary.json
      - run: python research/analyze_3head_a_adopted_loss_patterns.py
      - uses: actions/upload-artifact@v4
        with:
          name: research-3head-a-loss-patterns
          path: |
            analysis_3head_a_adopted_loss_patterns.csv
            analysis_3head_a_adopted_losses17.csv
            summary_3head_a_adopted_loss_patterns.md
