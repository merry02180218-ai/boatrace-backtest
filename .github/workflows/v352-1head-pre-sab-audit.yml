name: v352 1-head PRE SAB audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v352_1head_pre_sab_audit.py'
      - '.github/workflows/v352-1head-pre-sab-audit.yml'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage prepare
      - uses: actions/upload-artifact@v4
        with:
          name: v352-julaug-prepare
          path: |
            cache_v321_julaug_nonpristine_slim.csv.gz
            cache_v321_julaug_nonpristine_head.csv
            cache_v321_julaug_nonpristine_meta.csv
  second:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with: {name: v352-julaug-prepare, path: .}
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage second
      - uses: actions/upload-artifact@v4
        with: {name: v352-julaug-second, path: cache_v321_julaug_second.pkl}
  base-third:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with: {name: v352-julaug-prepare, path: .}
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage base-third
      - uses: actions/upload-artifact@v4
        with: {name: v352-julaug-base-third, path: cache_v321_julaug_base_pc.pkl}
  third:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with: {name: v352-julaug-prepare, path: .}
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage third
      - uses: actions/upload-artifact@v4
        with: {name: v352-julaug-third, path: cache_v321_julaug_third.pkl}
  audit:
    needs: [prepare, second, base-third, third]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with: {name: v352-julaug-prepare, path: .}
      - uses: actions/download-artifact@v4
        with: {name: v352-julaug-second, path: .}
      - uses: actions/download-artifact@v4
        with: {name: v352-julaug-base-third, path: .}
      - uses: actions/download-artifact@v4
        with: {name: v352-julaug-third, path: .}
      - name: Download independently audited v351 frozen races
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34900768805 -n v351-1head-production-regression -D /tmp/v351-fixed
      - name: Run fast PRE S/A/B audit
        env:
          V351_FROZEN_RACES: /tmp/v351-fixed/v351_production_races.csv
        run: python run_v352_1head_pre_sab_audit.py
      - if: always()
        run: cat /tmp/v352-pre-sab-audit/result_v352_pre_sab_audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v352-1head-pre-sab-audit
          path: /tmp/v352-pre-sab-audit/
