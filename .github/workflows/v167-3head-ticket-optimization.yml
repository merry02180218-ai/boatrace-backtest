name: v167 3head ticket optimization

on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v167_3head_ticket_optimization.py'
      - '.github/workflows/v167-3head-ticket-optimization.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn
      - name: Run v167
        run: python analyze_v167_3head_ticket_optimization.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v167_3head_ticket_optimization.csv summary_v167_3head_ticket_optimization.md
          git diff --cached --quiet || git commit -m "Add v167 3-head ticket optimization results"
          git push
