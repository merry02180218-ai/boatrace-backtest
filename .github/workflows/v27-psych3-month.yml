name: v27-psych3-month
on:
  push:
    paths:
      - 'backtest_v27_psych3_month.py'
      - '.github/workflows/v27-psych3-month.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python backtest_v27_psych3_month.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v27_psych3_month.md races_v27_psych3_month.csv bets_v27_psych3_month.csv
          git diff --cached --quiet || git commit -m "Run v27 psychology-aware 3-boat monthly backtest"
          git push
