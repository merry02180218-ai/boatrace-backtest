name: Research 4-head v291 A target-composite rescue

on:
  push:
    paths:
      - 'freeze_4head_v291_downstream_artifacts.py'
      - 'recover_4head_v291_exact_a_live_curves.py'
      - 'analyze_4head_v291_a_targetcomp_rescue.py'
      - 'analyze_4head_v291_base_variable_n.py'
      - 'analysis_v288_4head_composite_odds_alln_detail.csv'
      - 'artifacts/head4_v273_a_live_20260630.json'
      - 'artifacts/head4_v291_downstream_20260630.json'
      - 'head4_v273_a_live_inference.py'
      - 'head4_v291_downstream_inference.py'
      - 'analyze_v250_4head_rebuild_baseline.py'
      - 'analyze_v264_4head_feature_exhaustive.py'
      - 'analyze_v270_4head_win_feature_importance.py'
      - 'analyze_v271_4head_arank_expansion.py'
      - 'analyze_v274_4head_opponent_feature_audit.py'
      - 'analyze_v278_4head_opponent_current_exhibition_audit.py'
      - 'analyze_v279_4head_opponent_listwise_rebuild.py'
      - 'analyze_v281_4head_opponent_third_scenario.py'
      - 'analyze_v282_4head_conditional_third.py'
      - 'analyze_v283_4head_conditional_pair_order.py'
      - 'data/official_closing_odds3t/**'
      - '.github/workflows/research-4head-v291-a-targetcomp.yml'
  workflow_dispatch:

concurrency:
  group: research-4head-v291-a-targetcomp
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scipy scikit-learn
      - name: Syntax check
        run: |
          python -m py_compile freeze_4head_v291_downstream_artifacts.py
          python -m py_compile head4_v291_downstream_inference.py
          python -m py_compile recover_4head_v291_exact_a_live_curves.py
          python -m py_compile analyze_4head_v291_a_targetcomp_rescue.py
          python -m py_compile analyze_4head_v291_base_variable_n.py
      - name: Build and validate frozen v291 downstream artifact
        run: |
          rm -f artifacts/head4_v291_downstream_20260630.json artifacts/head4_v291_downstream_parity_20260630.json
          python freeze_4head_v291_downstream_artifacts.py
          python head4_v291_downstream_inference.py
          python - <<'PY'
          import json
          a=json.load(open('artifacts/head4_v291_downstream_20260630.json'))
          p=json.load(open('artifacts/head4_v291_downstream_parity_20260630.json'))
          assert a['policy']=='HEAD4_V291_COMP7'
          assert a['frozen_training_cutoff']=='2026-06-30'
          assert a['jul_aug_labels_used'] is False
          assert a['september_labels_used'] is False
          assert a['v96_production_signal_used'] is False
          assert a['parity']['status']=='PASS'
          assert p['status']=='PASS'
          PY
      - name: Recover exact frozen A-LIVE curves and run rescue research
        run: python recover_4head_v291_exact_a_live_curves.py
      - name: Validate leakage, exact curve recovery and rescue outputs
        run: |
          python - <<'PY'
          import json,pandas as pd
          p=json.load(open('head4_v291_a_targetcomp_rescue_candidate.json'))
          a=json.load(open('audit_4head_v291_a_live_identity.json'))
          r=json.load(open('audit_4head_v291_a_live_curve_recovery.json'))
          assert p['development_months']==['2026-04','2026-05','2026-06']
          assert p['jul_aug_outcomes_used'] is False
          assert p['september_outcomes_used'] is False
          assert p['v96_used'] is False
          assert a['development_months']==['2026-04','2026-05','2026-06']
          assert a['jul_aug_outcomes_used'] is False
          assert a['september_outcomes_used'] is False
          assert r['development_months']==['2026-04','2026-05','2026-06']
          assert r['jul_aug_outcomes_used'] is False
          assert r['september_outcomes_used'] is False
          assert r['v96_used'] is False
          assert r['status']=='PASS'
          assert r['missing_before_R']==r['recovered_R']
          assert a['missing_curve_R']==0
          assert a['status']=='PASS_EXACT_CURVES_AVAILABLE'
          q=pd.read_csv('analysis_v291_4head_composite_odds_alln_exactalive.csv')
          assert set(q.month.astype(str))=={'2026-04','2026-05','2026-06'}
          l=pd.read_csv('analysis_4head_v291_a_targetcomp_rescue_lomo.csv')
          if len(l): assert set(l.holdout_month.astype(str))=={'2026-04','2026-05','2026-06'}
          PY
      - name: Run immutable-base variable-N research
        run: python analyze_4head_v291_base_variable_n.py
      - name: Validate variable-N leakage and immutable entry set
        run: |
          python - <<'PY'
          import json,pandas as pd
          p=json.load(open('head4_v291_base_variable_n_candidate.json'))
          assert p['development_months']==['2026-04','2026-05','2026-06']
          assert p['jul_aug_outcomes_used'] is False
          assert p['september_outcomes_used'] is False
          assert p['v96_used'] is False
          assert p['base']['policy']=='HEAD4_V291_COMP7'
          assert p['base']['R']==29
          assert p['base']['immutable_entry_set'] is True
          q=pd.read_csv('analysis_4head_v291_base_variable_n.csv')
          assert len(q)>0
          assert q.R.eq(29).all()
          assert (q.avg_n>=4.0).all()
          m=pd.read_csv('analysis_4head_v291_base_variable_n_monthly.csv')
          assert set(m.month.astype(str))=={'2026-04','2026-05','2026-06'}
          l=pd.read_csv('analysis_4head_v291_base_variable_n_lomo.csv')
          assert set(l.holdout_month.astype(str))=={'2026-04','2026-05','2026-06'}
          print(json.dumps(p,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: head4-v291-operational-research
          path: |
            artifacts/head4_v291_downstream_parity_20260630.json
            audit_4head_v291_a_live_curve_recovery.json
            audit_4head_v291_a_live_identity.json
            analysis_v291_4head_composite_odds_alln_exactalive.csv
            analysis_4head_v291_a_targetcomp_rescue.csv
            analysis_4head_v291_a_targetcomp_rescue_monthly.csv
            analysis_4head_v291_a_targetcomp_rescue_lomo.csv
            summary_4head_v291_a_targetcomp_rescue.md
            head4_v291_a_targetcomp_rescue_candidate.json
            analysis_4head_v291_base_variable_n.csv
            analysis_4head_v291_base_variable_n_monthly.csv
            analysis_4head_v291_base_variable_n_lomo.csv
            summary_4head_v291_base_variable_n.md
            head4_v291_base_variable_n_candidate.json
      - name: Persist research outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/head4_v291_downstream_parity_20260630.json audit_4head_v291_a_live_curve_recovery.json audit_4head_v291_a_live_identity.json analysis_v291_4head_composite_odds_alln_exactalive.csv analysis_4head_v291_a_targetcomp_rescue*.csv summary_4head_v291_a_targetcomp_rescue.md head4_v291_a_targetcomp_rescue_candidate.json analysis_4head_v291_base_variable_n*.csv summary_4head_v291_base_variable_n.md head4_v291_base_variable_n_candidate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record v291 operational variable-N research'
          git pull --rebase origin main
          git push origin HEAD:main
