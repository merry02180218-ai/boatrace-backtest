name: audit-4head-ph5-live-walkforward
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
          sparse-checkout: |
            data/programs/race_cards
            data/programs/waku10
            data/results/realtime
            data/previews/tkz
            data/previews/stt
            data/previews/original_exhibition
            data/previews/od3
      - run: pip install -q numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Preflight
        run: |
          python -m py_compile prepare_4head_6m_v93_neutral_waku.py audit_4head_ph5_live_walkforward.py research_4head_opponent_player_waku_v1.py research_4head_opponent_second_rerank_v2.py research_4head_opponent_regime_v1.py research_4head_structural_broad_6m_v1.py research_4head_three_survive_ticket_shadow_v1.py audit_4head_inner_adoption_parity_v1.py research_4head_v291_phwaku_additive_v1.py audit_4head_live_v291_restore_v1.py research_4head_v291_staking_audit_v1.py
          ! grep -n '\\\\n' audit_4head_ph5_live_walkforward.py research_4head_opponent_player_waku_v1.py research_4head_opponent_second_rerank_v2.py research_4head_structural_broad_6m_v1.py research_4head_three_survive_ticket_shadow_v1.py
      - name: Prepare historical LIVE primitives
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python prepare_4head_6m_v93_neutral_waku.py
      - name: PH5 LIVE walk-forward replay
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
          STRICT_ROWS: /tmp/head4_clean_long_dataset/dataset.csv
          V93_ROWS: /tmp/head4_v93_all_parent/v93_all_parent.csv
        run: python audit_4head_ph5_live_walkforward.py
      - name: LIVE restored v291 opponent parity
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python audit_4head_live_v291_restore_v1.py
      - name: Frozen v291 staking audit
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python research_4head_v291_staking_audit_v1.py
      - name: Opponent PLAYERHistory Waku10 research
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python research_4head_opponent_player_waku_v1.py
      - name: Opponent SECOND rerank v2
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python research_4head_opponent_second_rerank_v2.py
      - name: Opponent regime discovery v1
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python research_4head_opponent_regime_v1.py
      - name: Broad six-month structural robustness audit
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python research_4head_structural_broad_6m_v1.py
      - name: 3-survival ticket shadow on adopted INNER_SURVIVE
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python research_4head_three_survive_ticket_shadow_v1.py
      - name: INNER_SURVIVE adoption parity audit
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python audit_4head_inner_adoption_parity_v1.py
      - name: v291 additive PH Waku research
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python research_4head_v291_phwaku_additive_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-ph5-live-walkforward
          path: |
            /tmp/head4_ph5_live_walkforward/
            /tmp/head4_opponent_player_waku_v1/
            /tmp/head4_opponent_second_rerank_v2/
            /tmp/head4_opponent_regime_v1/
            /tmp/head4_structural_broad_6m_v1/
            /tmp/head4_three_survive_ticket_shadow_v1/
            /tmp/head4_inner_adoption_parity_v1/
            /tmp/head4_v291_phwaku_additive_v1/
            /tmp/head4_live_v291_restore_audit_v1/
            /tmp/head4_v291_staking_audit_v1/
          retention-days: 30
