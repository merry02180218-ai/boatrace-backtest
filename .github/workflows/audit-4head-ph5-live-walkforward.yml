name: audit-4head-ph5-live-walkforward
on:
  workflow_dispatch:
  push:
    paths:
      - 'audit_4head_ph5_live_walkforward.py'
      - '.github/workflows/audit-4head-ph5-live-walkforward.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
          sparse-checkout: |
            data/programs/race_cards
            data/programs/waku10
            data/results/realtime
            data/previews/tkz
            data/previews/stt
            data/previews/original_exhibition
            data/previews/od3
      - run: pip install -q numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Preflight
        run: |
          python -m py_compile prepare_4head_6m_v93_neutral_waku.py audit_4head_ph5_live_walkforward.py research_4head_opponent_player_waku_v1.py
          ! grep -n '\\\\n' audit_4head_ph5_live_walkforward.py
      - name: Prepare historical LIVE primitives
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python prepare_4head_6m_v93_neutral_waku.py
      - name: PH5 LIVE walk-forward replay
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
          STRICT_ROWS: /tmp/head4_clean_long_dataset/dataset.csv
          V93_ROWS: /tmp/head4_v93_all_parent/v93_all_parent.csv
        run: python audit_4head_ph5_live_walkforward.py
      - name: Opponent PLAYERHistory Waku10 research\n        env:\n          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv\n        run: python research_4head_opponent_player_waku_v1.py\n      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-ph5-live-walkforward
          path: |\n            /tmp/head4_ph5_live_walkforward/\n            /tmp/head4_opponent_player_waku_v1/
          retention-days: 30
