name: research-3head-wave36sf-two-layer
on:
  workflow_dispatch:
  push:
    branches: [research/3head-v289-addon-expansion]
    paths:
      - 'research_v289_3head_wave36sf_two_layer.py'
      - '.github/workflows/research-3head-wave36sf-two-layer.yml'

jobs:
  wave36sf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy scikit-learn
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34754875342 --repo merry02180218-ai/boatrace-backtest --name 3head-wave21-allrace-source-build --dir source
          cp source/analysis_v289_3head_wave21_allrace_feature_settled.csv .
      - name: Run Wave36S-F
        run: python research_v289_3head_wave36sf_two_layer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3head-wave36sf-two-layer
          path: |
            analysis_v289_3head_wave36sf_two_layer.csv
            research_v289_3head_wave36sf_two_layer.json
            research_v289_3head_wave36sf_two_layer.md
