name: v227 3-head odds zone robustness
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'analyze_v227_3head_odds_zone.py'
      - '.github/workflows/v227-3head-odds-zone.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scikit-learn
      - name: Regenerate v226 race rows
        run: python analyze_v226_3head_closing_odds_exploration.py
      - run: python analyze_v227_3head_odds_zone.py
      - name: Guard
        run: |
          python - <<'PY'
          import pandas as pd
          a=pd.read_csv('analysis_v226_3head_closing_odds_exploration.csv')
          assert len(a)>0
          assert set(a.month).issubset({'2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'})
          b=pd.read_csv('analysis_v227_3head_odds_zone.csv');assert len(b)>0
          print('guard ok',len(a),len(b))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v227-3head-odds-zone
          path: |
            analysis_v227_3head_odds_zone.csv
            summary_v227_3head_odds_zone.md
