name: audit-4head-env-waku-v16
'on':
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scikit-learn
      - name: Preflight
        run: |
          python -m py_compile prepare_4head_6m_v93_neutral_waku.py audit_4head_clean_6m_exhibition.py audit_4head_waku10_rel43_regime_v6.py audit_4head_frozen_ph_rel43_v13.py audit_4head_waku_sr_st_v15.py audit_4head_env_waku_v16.py
          grep -q 'result_fields_used_as_features.*False' audit_4head_env_waku_v16.py
          grep -q 'SEPTEMBER_OUTCOMES_READ.*False' audit_4head_env_waku_v16.py
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: boatracecsv
      - name: Build causal parent
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/boatracecsv
        run: python prepare_4head_6m_v93_neutral_waku.py
      - name: Environment Waku audit
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/boatracecsv
        run: python audit_4head_env_waku_v16.py
      - uses: actions/upload-artifact@v4
        with:
          name: head4-env-waku-v16
          path: /tmp/head4_env_waku_v16
