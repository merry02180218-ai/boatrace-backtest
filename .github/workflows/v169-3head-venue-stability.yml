name: v169 3head venue stability
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v169_3head_venue_stability.py'
      - '.github/workflows/v169-3head-venue-stability.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn
      - name: Run v169
        run: python analyze_v169_3head_venue_stability.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v169_3head_venue_stability.csv summary_v169_3head_venue_stability.md
          git diff --cached --quiet || git commit -m "Add v169 corrected venue stability results"
          git push
