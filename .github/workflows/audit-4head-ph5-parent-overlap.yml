name: audit-4head-ph5-parent-overlap
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/audit-4head-ph5-parent-overlap.txt'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
          sparse-checkout: |
            data/programs/race_cards
            data/programs/waku10
            data/results/realtime
            data/previews/tkz
            data/previews/stt
            data/previews/original_exhibition
            data/previews/od3
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Build historical primitives
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python prepare_4head_6m_v93_neutral_waku.py
      - name: Run PH5 replay with monitoring-parent overlap
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
          STRICT_ROWS: /tmp/head4_clean_long_dataset/dataset.csv
          V93_ROWS: /tmp/head4_v93_all_parent/v93_all_parent.csv
        run: python audit_4head_ph5_live_walkforward.py
      - name: Show overlap funnel
        run: |
          cat /tmp/head4_ph5_live_walkforward/volume_funnel.json
          cat /tmp/head4_ph5_live_walkforward/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-ph5-parent-overlap
          path: |
            /tmp/head4_ph5_live_walkforward/volume_funnel.json
            /tmp/head4_ph5_live_walkforward/result.json
            /tmp/head4_ph5_live_walkforward/race_detail.csv
          retention-days: 30
