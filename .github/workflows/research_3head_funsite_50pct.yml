name: research-3head-funsite-50pct
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy scikit-learn
      - name: Download frozen Wave21 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10317157868/zip > /tmp/wave21.zip
          unzip -o /tmp/wave21.zip -d /tmp/wave21
          find /tmp/wave21 -type f -maxdepth 3 -print
          SRC=$(find /tmp/wave21 -type f -name 'analysis_v289_3head_wave21_allrace_feature_settled.csv' | head -1)
          test -n "$SRC"
          cp "$SRC" analysis_v289_3head_wave21_allrace_feature_settled.csv
          test -s analysis_v289_3head_wave21_allrace_feature_settled.csv
      - name: Run February-frozen March one-shot head model
        run: python research/run_3head_funsite_50pct_model.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-funsite-50pct-model
          path: research_3head_funsite_50pct_model_result.json
          if-no-files-found: ignore
