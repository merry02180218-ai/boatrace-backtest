name: research-3head-funsite-50pct
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe February fun-site sources
        run: python research/run_3head_funsite_50pct_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: research-3head-funsite-50pct-probe
          path: research_3head_funsite_50pct_probe.json
