name: v131-1head-b1-a1-vs-a2-split
on:
  push:
    paths:
      - 'analyze_v131_1head_b1_a1_vs_a2_split.py'
      - '.github/workflows/v131-1head-b1-a1-vs-a2-split.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn requests beautifulsoup4
      - run: python analyze_v131_1head_b1_a1_vs_a2_split.py
      - name: commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add analysis_v131_1head_b1_a1_vs_a2_split.csv summary_v131_1head_b1_a1_vs_a2_split.md
          git diff --cached --quiet || git commit -m "Generate v131 B1 A1-vs-A2 split results"
          git push
