name: v185 3head dynamic ticket count

on:
  push:
    paths:
      - 'analyze_v185_3head_dynamic_ticket_count.py'
      - '.github/workflows/v185-3head-dynamic-ticket-count.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn requests
      - run: python analyze_v185_3head_dynamic_ticket_count.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v185_3head_dynamic_ticket_count.csv summary_v185_3head_dynamic_ticket_count.md
          git diff --cached --quiet || git commit -m 'Add v185 dynamic ticket count results'
          git pull --rebase origin main
          git push
