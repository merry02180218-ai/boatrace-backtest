name: inspect-3head-a-ticket-source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/inspect_3head_a_ticket_source.py'
      - '.github/workflows/inspect-3head-a-ticket-source.yml'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Download frozen Wave21 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10317157868/zip > /tmp/wave21.zip
          unzip -oq /tmp/wave21.zip -d /tmp/wave21
          SRC=$(find /tmp/wave21 -type f -name 'analysis_v289_3head_wave21_allrace_feature_settled.csv' | head -1)
          test -n "$SRC"
          cp "$SRC" analysis_v289_3head_wave21_allrace_feature_settled.csv
      - run: python research/inspect_3head_a_ticket_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: inspect-3head-a-ticket-source
          path: inspect_3head_a_ticket_source_result.json
