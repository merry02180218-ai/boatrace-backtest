name: v29-psych3-zones
on:
  push:
    paths:
      - 'backtest_v29_psych3_zones_month.py'
      - '.github/workflows/v29-psych3-zones.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python backtest_v29_psych3_zones_month.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v29_psych3_zones_month.md races_v29_psych3_zones_month.csv bets_v29_psych3_zones_month.csv
          git commit -m "Add v29 three-zone backtest results" || exit 0
          git push
