name: research-v288-operational-monthly-parity
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas
      - name: Preflight
        run: |
          python -m py_compile research/audit_v288_operational_monthly_parity.py verify_v288_operational_pre_replay.py
          python - <<'PY'
          from pathlib import Path
          s=Path('research/audit_v288_operational_monthly_parity.py').read_text()
          banned=['date(2026,9','date(2026, 9','20260901','20260930']
          hit=[x for x in banned if x in s]
          assert not hit, f'September data access token found: {hit}'
          print('SEPTEMBER_ACCESS_STATIC_CHECK_OK')
          PY
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('.').resolve()))
          import verify_v288_operational_pre_replay
          print('ROOT_IMPORT_OK')
          PY
      - name: Download exact frozen v243 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34383567078 --repo merry02180218-ai/boatrace-backtest --name v243-3head-expand-feature-audit --dir golden_v243
          test -s golden_v243/analysis_v243_3head_expand_feature_audit.csv
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
      - name: Reproduce v288 monthly parity
        run: python research/audit_v288_operational_monthly_parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-v288-operational-monthly-parity
          path: research_v288_operational_monthly_parity.json
