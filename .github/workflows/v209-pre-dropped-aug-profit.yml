name: v209 PRE-dropped August profit audit
on:
  push:
    paths:
      - 'analyze_v209_pre_dropped_aug_profit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python analyze_v209_pre_dropped_aug_profit.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_v209_pre_dropped_aug_profit.csv summary_v209_pre_dropped_aug_profit.md
          git diff --cached --quiet || git commit -m 'Add v209 PRE-dropped August audit results'
          git push
