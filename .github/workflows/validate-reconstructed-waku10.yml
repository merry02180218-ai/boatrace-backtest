name: validate-reconstructed-waku10
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: boatcast-waku10-2026-*
          path: data/reconstructed_waku10_boatcast/2026
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: "35547108828"
      - name: Validate format and overlap against saved BoatraceCSV
        run: python validate_reconstructed_waku10.py
