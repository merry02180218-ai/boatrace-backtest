name: v46-history-softscore
on:
  push:
    paths:
      - 'analyze_v46_history_softscore.py'
      - '.github/workflows/v46-history-softscore.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python analyze_v46_history_softscore.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v46_history_softscore.md analysis_v46_history_softscore.csv
          git diff --cached --quiet || git commit -m "Add v46 history soft-score results"
          git push
