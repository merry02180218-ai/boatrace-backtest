name: v388 1-head added71 opponent confidence

on:
  push:
    branches: [ main ]
    paths:
      - 'run_v388_1head_added71_opponent_confidence.py'
      - '.github/workflows/v388-1head-added71-opponent-confidence.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml

      - name: Download frozen v360 prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" > /tmp/v360.zip
          mkdir -p /tmp/v360
          unzip -q /tmp/v360.zip -d /tmp/v360
          PREP=$(find /tmp/v360 -name prepared_rows.pkl -print -quit)
          test -n "$PREP"
          echo "PREP=$PREP" >> "$GITHUB_ENV"

      - name: Run opponent confidence audit
        run: python run_v388_1head_added71_opponent_confidence.py --prepared "$PREP"

      - name: Show result
        if: always()
        run: cat /tmp/v388-added71-opponent-confidence/result.json 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v388-added71-opponent-confidence-${{ github.run_id }}
          path: /tmp/v388-added71-opponent-confidence/
          retention-days: 30
