name: v93-4corner-second-third

on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v93_4corner_second_third.py'
      - '.github/workflows/v93-4corner-second-third.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v93 second-third diagnostic
        run: python analyze_v93_4corner_second_third.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v93_4corner_second_third.csv summary_v93_4corner_second_third.md
          git diff --cached --quiet || git commit -m "Add v93 second-third diagnostic results"
          git push
