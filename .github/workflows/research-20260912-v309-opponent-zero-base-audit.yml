name: v309 opponent zero-base audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v309_1head_opponent_zero_base_audit.py'
      - '.github/workflows/research-20260912-v309-opponent-zero-base-audit.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Run v309 opponent audit
        run: python run_v309_1head_opponent_zero_base_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v309-opponent-zero-base-audit
          path: |
            analysis_v309_1head_opponent_zero_base_audit_*.csv
            summary_v309_1head_opponent_zero_base_audit.md
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v309_1head_opponent_zero_base_audit_*.csv summary_v309_1head_opponent_zero_base_audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add v309 opponent zero-base audit outputs'
          git pull --rebase origin main
          git push origin HEAD:main
