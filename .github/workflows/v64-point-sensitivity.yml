name: v64-point-sensitivity
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'analyze_v64_point_sensitivity.py'
      - '.github/workflows/v64-point-sensitivity.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python analyze_v64_point_sensitivity.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v64_point_sensitivity.md
          if ! git diff --cached --quiet; then
            git commit -m "Add v64 point sensitivity results"
            git pull --rebase origin main
            git push
          fi
