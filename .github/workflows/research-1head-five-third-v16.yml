name: 1HEAD five-third mechanism v16
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research_1head_five_third_v16.py'
      - '.github/workflows/research-1head-five-third-v16.yml'
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        shell: bash
        run: python -m pip install -q --disable-pip-version-check numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Download frozen v360 prepared
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'v360';$zip=Join-Path $env:RUNNER_TEMP 'v360.zip'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" -Headers $h -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $p=Get-ChildItem $root -Recurse -File|Where-Object{$_.Extension -in '.pkl','.pickle'}|Select-Object -First 1
          "PREP=$($p.FullName)"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Five-third v16
        shell: pwsh
        run: python research_1head_five_third_v16.py --prepared "$env:PREP"
