name: v315 outer boat-specific SECOND research

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['v314 role-split SECOND autoresearch']
    types: [completed]

permissions:
  contents: write

jobs:
  research:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Sync latest main after v314 output commit
        run: git pull --rebase origin main
      - name: Verify causal cache
        run: |
          test -f CACHE_V313_1HEAD_OPPONENT_CAUSAL.md
          test -f cache_v313_1head_opponent_pre.csv.gz
          test -f cache_v313_1head_opponent_p3.csv.gz
          test -f cache_v313_1head_opponent_p4.csv.gz
      - name: Run v315 boat-specific outer research
        run: python run_v315_1head_outer_boat_specific.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v315-outer-boat-specific
          path: |
            summary_v315_1head_outer_boat_specific.md
            analysis_v315_1head_outer_boat_specific_*.csv
          if-no-files-found: warn
      - name: Commit v315 outputs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add summary_v315_1head_outer_boat_specific.md analysis_v315_1head_outer_boat_specific_*.csv
          git diff --cached --quiet || git commit -m 'Add v315 outer boat-specific SECOND results'
          git pull --rebase origin main
          git push
