name: v260 4-head adaptive comp target
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v260_4head_adaptive_comp_target.py'
      - '.github/workflows/v260-4head-adaptive-comp-target.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn requests beautifulsoup4
      - run: python analyze_v260_4head_adaptive_comp_target.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v260_4head_adaptive_comp_target.csv summary_v260_4head_adaptive_comp_target.md
          git diff --cached --quiet || git commit -m 'Add v260 adaptive comp target results'
          git pull --rebase
          git push
