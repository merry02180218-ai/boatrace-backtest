name: audit-head4-actual-live-artifacts-20260925

on:
  push:
    paths:
      - '.github/triggers/audit-head4-actual-live-artifacts-20260925.txt'

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download actual terminal watchdog artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/live_artifacts/zips /tmp/live_artifacts/unpacked
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > /tmp/live_artifacts/pages.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          pages=json.loads(Path('/tmp/live_artifacts/pages.json').read_text())
          arts=[]
          for z in pages:
              arts.extend(z.get('artifacts',[]))
          pat=re.compile(r'^head4-120r-watchdog-20260925-\d{2}-\d+$')
          sel=[a for a in arts if pat.match(a.get('name','')) and not a.get('expired')]
          Path('/tmp/live_artifacts/artifacts.json').write_text(json.dumps(sel,ensure_ascii=False,indent=2))
          print('CANONICAL_ARTIFACTS',len(sel))
          for a in sel: print(a['id'],a['name'])
          PY
          python - <<'PY'
          import json,subprocess,zipfile
          from pathlib import Path
          arts=json.loads(Path('/tmp/live_artifacts/artifacts.json').read_text())
          for a in arts:
              zp=Path('/tmp/live_artifacts/zips')/f"{a['id']}.zip"
              with zp.open('wb') as f:
                  subprocess.run(['gh','api',f"repos/{__import__('os').environ['GITHUB_REPOSITORY']}/actions/artifacts/{a['id']}/zip"],stdout=f,check=True)
              out=Path('/tmp/live_artifacts/unpacked')/str(a['id']);out.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(zp) as z:z.extractall(out)
          PY
      - name: Aggregate actual LIVE decisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('/tmp/live_artifacts/unpacked').rglob('*.json'):
              try:z=json.loads(p.read_text(encoding='utf-8'))
              except:continue
              if str(z.get('race_code','')).startswith('20260925') and 'monitoring_parent' in z:
                  sh=z.get('wall3_open_shadow') or {}
                  hp=z.get('head_prob'); mass=z.get('opponent_mass'); comp=z.get('composite_odds')
                  q=(float(hp)+1.5*float(mass)) if hp is not None and mass is not None else None
                  old164=bool(z.get('old164_struct'))
                  base120=bool(z.get('base120_selected'))
                  wall_ready=(sh.get('not_ready_reason') is None)
                  open_risk=sh.get('open_risk')
                  base120_rescue=bool((not base120) and wall_ready and comp is not None and float(comp)>=2.5
                                      and open_risk is not None and float(open_risk)>0 and q is not None
                                      and q+0.10*float(open_risk)>=.82)
                  rows.append({
                    'race_code':str(z.get('race_code')),
                    'decision':z.get('decision'),
                    'decision_time_jst':z.get('decision_time_jst'),
                    'head_prob':hp,
                    'mass':mass,
                    'comp':comp,
                    'st4_adv_inside':z.get('st4_adv_inside'),
                    'orig4_adv_inside':z.get('orig4_adv_inside'),
                    'orig_avg_available':z.get('orig_avg_available'),
                    'old164_struct':old164,
                    'base120_selected':base120,
                    'base77':bool(z.get('base77')),
                    'wall_ready':wall_ready,
                    'would_rescue_broad':bool(sh.get('would_rescue')),
                    'base120_pass_rescue':base120_rescue,
                    'eligible_current_pass':bool(sh.get('eligible_current_pass')),
                    'wall_score':sh.get('wall_score'),
                    'wall_ex_gap':(sh.get('gaps') or {}).get('ex'),
                    'wall_st_gap':(sh.get('gaps') or {}).get('st'),
                    'wall_straight_gap':(sh.get('gaps') or {}).get('straight'),
                    'wall_avg_gap':(sh.get('gaps') or {}).get('orig_avg'),
                    'open_risk':open_risk,
                    'base_quality':q,
                    'shadow_quality':sh.get('shadow_quality'),
                    'artifact_json':str(p),
                  })
          # canonical artifact names should yield one terminal JSON/race; dedupe defensively.
          by={}
          for r in rows: by[r['race_code']]=r
          rows=[by[k] for k in sorted(by)]
          cutoff='2026-09-25T16:00:00+09:00'
          before=[r for r in rows if str(r.get('decision_time_jst') or '') < cutoff]
          out={
            'profile':'HEAD4_ACTUAL_LIVE_ARTIFACT_AUDIT_20260925',
            'terminal_R':len(rows),
            'before_1600_R':len(before),
            'before_1600_broad_rescue_R':sum(r['would_rescue_broad'] for r in before),
            'before_1600_broad_rescue_codes':[r['race_code'] for r in before if r['would_rescue_broad']],
            'before_1600_base120_pass_rescue_R':sum(r['base120_pass_rescue'] for r in before),
            'before_1600_base120_pass_rescue_codes':[r['race_code'] for r in before if r['base120_pass_rescue']],
            'decision_counts':{},
            'wall3_broad_rescue_R':sum(r['would_rescue_broad'] for r in rows),
            'wall3_broad_rescue_codes':[r['race_code'] for r in rows if r['would_rescue_broad']],
            'base120_pass_rescue_R':sum(r['base120_pass_rescue'] for r in rows),
            'base120_pass_rescue_codes':[r['race_code'] for r in rows if r['base120_pass_rescue']],
            'rows':rows,
            'recomputed':False,
            'source':'actual canonical watchdog terminal artifacts'
          }
          for r in rows: out['decision_counts'][r['decision']]=out['decision_counts'].get(r['decision'],0)+1
          Path('/tmp/live_artifacts/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: head4-actual-live-artifact-audit-20260925
          path: /tmp/live_artifacts/result.json
          retention-days: 7
