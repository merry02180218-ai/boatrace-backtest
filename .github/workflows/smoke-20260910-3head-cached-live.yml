name: smoke 2026-09-10 3head cached live

on:
  workflow_dispatch:
  push:
    paths:
      - build_20260910_3head_live_cache.py
      - run_20260910_3head_live_from_cache.py
      - .github/workflows/smoke-20260910-3head-cached-live.yml

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy scikit-learn requests beautifulsoup4 joblib
      - name: Download frozen v234 restored-Waku10 cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34326743303 --repo ${{ github.repository }} --name v234-3head-waku10-restored-replay --dir .
          test -f analysis_v234_waku10_reconstruction_coverage.csv
          test -f data/audit/v234_waku10/restored/2026/08/31.csv
      - name: One-time build model cache
        run: python build_20260910_3head_live_cache.py
      - name: Deadline-time cached LIVE smoke
        run: python run_20260910_3head_live_from_cache.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-20260910-3head-cached-live
          path: |
            cache_20260910_3head_live.joblib
            smoke_20260910_3head_cached_live.json
            smoke_20260910_3head_cached_live.txt
          if-no-files-found: ignore
