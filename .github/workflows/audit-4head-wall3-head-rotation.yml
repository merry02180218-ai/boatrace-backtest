name: audit-4head-wall3-head-rotation

on:
  workflow_dispatch:
  push:
    paths:
      - 'audit_4head_wall3_head_rotation.py'
      - '.github/workflows/audit-4head-wall3-head-rotation.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sparse checkout archived exhibition data
        uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
          sparse-checkout: |
            data/previews/tkz/2025/10
            data/previews/tkz/2025/11
            data/previews/tkz/2025/12
            data/previews/tkz/2026/01
            data/previews/tkz/2026/02
            data/previews/tkz/2026/03
            data/previews/tkz/2026/04
            data/previews/tkz/2026/05
            data/previews/tkz/2026/06
            data/previews/tkz/2026/07
            data/previews/tkz/2026/08
            data/previews/stt/2025/10
            data/previews/stt/2025/11
            data/previews/stt/2025/12
            data/previews/stt/2026/01
            data/previews/stt/2026/02
            data/previews/stt/2026/03
            data/previews/stt/2026/04
            data/previews/stt/2026/05
            data/previews/stt/2026/06
            data/previews/stt/2026/07
            data/previews/stt/2026/08
            data/previews/original_exhibition/2025/10
            data/previews/original_exhibition/2025/11
            data/previews/original_exhibition/2025/12
            data/previews/original_exhibition/2026/01
            data/previews/original_exhibition/2026/02
            data/previews/original_exhibition/2026/03
            data/previews/original_exhibition/2026/04
            data/previews/original_exhibition/2026/05
            data/previews/original_exhibition/2026/06
            data/previews/original_exhibition/2026/07
            data/previews/original_exhibition/2026/08
      - run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Download frozen 164R source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen164
          gh run download 35302541048 -n head4-market-regime-structure-shift -D frozen164
          RACE_DETAIL="$(find frozen164 -type f -name 'race_detail.csv' | head -1)"
          test -n "$RACE_DETAIL"
          echo "HEAD4_FROZEN_RACE_DETAIL=$RACE_DETAIL" >> "$GITHUB_ENV"
      - name: Run 4HEAD formal wall3 rotation audit
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python audit_4head_wall3_head_rotation.py
      - name: Show result
        if: always()
        run: |
          cat /tmp/head4_wall3_head_rotation/result.json 2>/dev/null || true
          head -25 /tmp/head4_wall3_head_rotation/dev_ranked_top200.csv 2>/dev/null || true
          cat /tmp/head4_wall3_head_rotation/wall_strata.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-wall3-head-rotation
          path: /tmp/head4_wall3_head_rotation/
          retention-days: 30
