on:
  push:
    paths:
      - 'run_v342_1head_skip_threshold_stability.py'
      - '.github/workflows/v342-1head-skip-threshold-stability.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with:
          name: v340-1head-adaptive-odds-dutch-sharded
          path: /tmp/v342/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34796402852
      - run: python run_v342_1head_skip_threshold_stability.py
      - uses: actions/upload-artifact@v4
        with:
          name: v342-1head-skip-threshold-stability
          path: /tmp/v342out/
