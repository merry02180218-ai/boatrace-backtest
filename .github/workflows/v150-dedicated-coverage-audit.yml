name: v150 dedicated coverage audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v150_dedicated_coverage_audit.py'
      - '.github/workflows/v150-dedicated-coverage-audit.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v150 coverage audit
        run: python analyze_v150_dedicated_coverage_audit.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v150_dedicated_coverage_audit.csv summary_v150_dedicated_coverage_audit.md
          git diff --cached --quiet || git commit -m 'Add v150 dedicated coverage audit results'
          git push
