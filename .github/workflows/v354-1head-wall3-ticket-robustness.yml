name: v354 1-head wall3 ticket robustness
on:
  push:
    paths:
      - 'run_v354_1head_wall3_ticket_robustness.py'
      - '.github/workflows/v354-1head-wall3-ticket-robustness.yml'
permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Download v353 research artifact
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10534735142/zip" > /tmp/v353.zip
          mkdir -p /tmp/v353
          unzip -q /tmp/v353.zip -d /tmp/v353
          test -f /tmp/v353/race_predictions.csv
      - name: Run robustness audit
        run: python run_v354_1head_wall3_ticket_robustness.py --race-predictions /tmp/v353/race_predictions.csv
      - name: Show result
        if: always()
        run: |
          cat /tmp/v354-wall3-ticket-robustness/result.json 2>/dev/null || true
          cat /tmp/v354-wall3-ticket-robustness/nested_lomo.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v354-wall3-ticket-robustness-${{ github.run_id }}
          path: /tmp/v354-wall3-ticket-robustness/
          retention-days: 30
