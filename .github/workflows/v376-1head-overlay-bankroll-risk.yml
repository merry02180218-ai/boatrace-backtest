name: v376 1-head overlay bankroll risk
on:
  push:
    paths:
      - 'run_v376_1head_overlay_bankroll_risk.py'
      - '.github/workflows/v376-1head-overlay-bankroll-risk.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy
      - name: Download v374 artifact
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10548879270/zip" > /tmp/v374.zip
          mkdir -p /tmp/v374
          unzip -q /tmp/v374.zip -d /tmp/v374
          test -f /tmp/v374/rows_LIVE165.csv
      - name: Run bankroll risk audit
        run: python run_v376_1head_overlay_bankroll_risk.py --v374-dir /tmp/v374
      - name: Show result
        if: always()
        run: |
          cat /tmp/v376-overlay-bankroll-risk/result.json 2>/dev/null || true
          cat /tmp/v376-overlay-bankroll-risk/risk_metrics.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v376-overlay-bankroll-risk-${{ github.run_id }}
          path: /tmp/v376-overlay-bankroll-risk/
          retention-days: 30
