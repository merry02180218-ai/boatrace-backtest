name: v286 4head variable-N Dutch

on:
  push:
    paths:
      - 'analyze_v286_4head_variable_n_dutch.py'
      - '.github/workflows/v286-4head-variable-n-dutch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn
      - run: python analyze_v286_4head_variable_n_dutch.py
      - uses: actions/upload-artifact@v4
        with:
          name: v286-4head-variable-n-dutch
          path: |
            analysis_v286_4head_variable_n_tune_grid.csv
            analysis_v286_4head_variable_n_confidence.csv
            analysis_v286_4head_variable_n_holdout.csv
            analysis_v286_4head_variable_n_monthly.csv
            analysis_v286_4head_variable_n_detail.csv
            summary_v286_4head_variable_n_dutch.md
      - name: Commit v286 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v286_4head_variable_n_tune_grid.csv analysis_v286_4head_variable_n_confidence.csv analysis_v286_4head_variable_n_holdout.csv analysis_v286_4head_variable_n_monthly.csv analysis_v286_4head_variable_n_detail.csv summary_v286_4head_variable_n_dutch.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add v286 variable-N Dutch results'
          git pull --rebase origin main
          git push origin HEAD:main
