name: v265-4head-consensus-ensemble

on:
  push:
    paths:
      - 'analyze_v265_4head_ensemble_consensus.py'
      - 'analysis_v264_4head_feature_exhaustive.csv'
      - '.github/workflows/v265-4head-consensus-ensemble.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python analyze_v265_4head_ensemble_consensus.py
      - uses: actions/upload-artifact@v4
        with:
          name: v265-4head-consensus-ensemble
          path: |
            analysis_v265_4head_ensemble_consensus.csv
            summary_v265_4head_ensemble_consensus.md
      - name: Commit v265 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v265_4head_ensemble_consensus.csv summary_v265_4head_ensemble_consensus.md
          if git diff --cached --quiet; then
            echo "No v265 output changes to commit"
          else
            git commit -m "Add v265 4-head consensus ensemble results"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
