name: v211 3head variable points new ROI

on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v211_3head_variable_points_newroi.py'
      - '.github/workflows/v211-3head-variable-points-newroi.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - run: python analyze_v211_3head_variable_points_newroi.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v211_3head_variable_points_newroi.csv summary_v211_3head_variable_points_newroi.md
          git diff --cached --quiet || git commit -m 'Generate v211 3head variable-points new-ROI results'
          git push
