name: v372 1-head preclose edge boost validation
on:
  push:
    paths:
      - 'run_v372_1head_preclose_edge_boost_validation.py'
      - '.github/workflows/v372-1head-preclose-edge-boost-validation.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Download v370 dynamic staking artifact
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10545859624/zip" > /tmp/v370.zip
          mkdir -p /tmp/v370
          unzip -q /tmp/v370.zip -d /tmp/v370
          test -f /tmp/v370/formal_with_closing_odds.csv
      - name: Run preclose validation
        run: python run_v372_1head_preclose_edge_boost_validation.py --v370-csv /tmp/v370/formal_with_closing_odds.csv
      - name: Show result
        if: always()
        run: |
          cat /tmp/v372-preclose-edge-boost/result.json 2>/dev/null || true
          cat /tmp/v372-preclose-edge-boost/periods.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v372-preclose-edge-boost-${{ github.run_id }}
          path: /tmp/v372-preclose-edge-boost/
          retention-days: 30
