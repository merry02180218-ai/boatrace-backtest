name: audit-4head-exact-final-stage2
on:
  workflow_dispatch:
  push:
    paths:
      - 'audit_4head_exact_final_stage2.py'
      - '.github/workflows/audit-4head-exact-final-stage2.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Download exact parent exhibition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p s1
          gh run download 35486864940 -n head4-exact-final-replay-stage1 -D s1
          P="$(find s1 -name parent_exhibition.csv | head -1)"; test -n "$P"; echo "PARENT_EXHIBITION=$P" >> "$GITHUB_ENV"
      - name: Download frozen headprob
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          mkdir -p hp
          gh run download 35234326600 -n head4-boatracecsv-leakage-audit -D hp
          P="$(find hp -name corrected_scored_races.csv | head -1)"; test -n "$P"; echo "HEADPROB_SCORED=$P" >> "$GITHUB_ENV"
      - run: python audit_4head_exact_final_stage2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-exact-final-stage2
          path: /tmp/head4_exact_final_stage2/
          retention-days: 30
