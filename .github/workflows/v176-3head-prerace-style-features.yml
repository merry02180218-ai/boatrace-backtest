name: v176 3head prerace style features
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v176_3head_prerace_style_features.py'
      - '.github/workflows/v176-3head-prerace-style-features.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn
      - name: Run v176
        run: python analyze_v176_3head_prerace_style_features.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v176_3head_prerace_style_features.csv summary_v176_3head_prerace_style_features.md
          git diff --cached --quiet || git commit -m "Add v176 prerace style diagnostic results"
          git push
