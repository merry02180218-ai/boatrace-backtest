name: audit-4head-nested-linear-high-volume

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/audit-4head-nested-linear-high-volume.txt'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy scikit-learn requests joblib beautifulsoup4 lxml
      - name: Run nested linear high-volume audit
        run: |
          mkdir -p /tmp/head4_nested_linear_frontier
          python audit_4head_nested_linear_high_volume.py | tee /tmp/head4_nested_linear_frontier/run.log
          grep -q '4号艇_NESTED_LINEAR_HIGH_VOLUME_OK' /tmp/head4_nested_linear_frontier/run.log
          grep -q '9月_UNREAD' /tmp/head4_nested_linear_frontier/run.log
          grep -q '本番変更なし' /tmp/head4_nested_linear_frontier/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: head4-nested-linear-high-volume
          path: /tmp/head4_nested_linear_frontier/
