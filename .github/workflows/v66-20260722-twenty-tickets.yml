name: v66-20260722-twenty-tickets
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'replay_v66_20260722_twenty_tickets.py'
      - '.github/workflows/v66-20260722-twenty-tickets.yml'
jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Jul 22 twenty-ticket replay
        run: python replay_v66_20260722_twenty_tickets.py
      - name: Commit replay result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v66_20260722_twenty_tickets.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate Jul 22 twenty-ticket replay"
            git pull --rebase origin main
            git push
          fi
