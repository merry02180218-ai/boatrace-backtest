name: backtest-4head-v291-third010-sixmonth

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn requests beautifulsoup4 lxml
      - name: Run six-month THIRD010 retrospective audit
        run: python backtest_4head_v291_third010_sixmonth.py
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head4-third010-sixmonth
          path: /tmp/head4_third010_sixmonth/
          if-no-files-found: warn
