name: v153 exhibition ST ablation
on:
  push:
    paths:
      - 'analyze_v153_exhibition_st_ablation.py'
      - '.github/workflows/v153-exhibition-st-ablation.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn
      - name: Run v153
        run: python analyze_v153_exhibition_st_ablation.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add analysis_v153_exhibition_st_ablation.csv summary_v153_exhibition_st_ablation.md
          git diff --cached --quiet || git commit -m 'Add v153 exhibition ST ablation results'
          git push
