name: promote-shared-historical-waku10
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run ID of successful reconstruction
        required: true
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boatcast-waku10-mar-jun
          path: data/reconstructed_waku10_boatcast
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact_run_id }}
      - run: python promote_shared_historical_waku10.py
      - name: Commit shared canonical Waku10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shared_historical/waku10_boatcast
          git diff --cached --quiet || git commit -m "data: add shared historical Boatcast Waku10 Mar-Jun 2026"
          git push
