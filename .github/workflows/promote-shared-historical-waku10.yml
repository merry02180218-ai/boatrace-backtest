name: promote-shared-historical-waku10
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run ID of successful reconstruction
        required: true
        default: "35547108828"
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: boatcast-waku10-2026-*
          path: data/reconstructed_waku10_boatcast/2026
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Normalize monthly artifact layout
        run: |
          set -euo pipefail
          for m in 03 04 05 06; do
            src="data/reconstructed_waku10_boatcast/2026/boatcast-waku10-2026-$m"
            test -d "$src"
            mkdir -p "data/reconstructed_waku10_boatcast/2026/$m"
            cp -a "$src"/. "data/reconstructed_waku10_boatcast/2026/$m/"
            rm -rf "$src"
          done
          test "$(find data/reconstructed_waku10_boatcast/2026 -type f -name '*.txt' | wc -l)" -eq 18171
      - run: python promote_shared_historical_waku10.py
      - name: Verify promotion before commit
        run: |
          set -euo pipefail
          test "$(find data/shared_historical/waku10_boatcast/2026 -type f -name '*.txt' | wc -l)" -eq 18171
          python -m json.tool data/shared_historical/waku10_boatcast/manifest.json >/dev/null
          grep -q '"result_files_read": false' data/shared_historical/waku10_boatcast/manifest.json
          grep -q '"september_outcomes_read": false' data/shared_historical/waku10_boatcast/manifest.json
      - name: Commit shared canonical Waku10
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shared_historical/waku10_boatcast
          git diff --cached --quiet || git commit -m "data: add shared historical Boatcast Waku10 Mar-Jun 2026"
          git push
