name: v306 1head unsafe feature attribution
# trigger: 2026-09-12T18:26+09:00
on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v306_1head_unsafe_feature_leavein.py'
      - '.github/workflows/research-20260912-v306-unsafe-feature-attribution.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Run v306 unsafe attribution
        run: python run_v306_1head_unsafe_feature_leavein.py
      - uses: actions/upload-artifact@v4
        with:
          name: v306-1head-unsafe-attribution
          path: |
            analysis_v306_1head_unsafe_feature_leavein_*.csv
            summary_v306_1head_unsafe_feature_leavein.md
      - name: Commit v306 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v306_1head_unsafe_feature_leavein_*.csv summary_v306_1head_unsafe_feature_leavein.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add v306 unsafe feature attribution outputs'
          git pull --rebase origin main
          git push origin HEAD:main
