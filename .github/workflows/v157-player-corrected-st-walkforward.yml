name: v157 player corrected ST walk-forward
on:
  push:
    paths:
      - 'analyze_v157_player_corrected_st_walkforward.py'
      - '.github/workflows/v157-player-corrected-st-walkforward.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn requests pandas beautifulsoup4
      - name: Run v157
        run: python analyze_v157_player_corrected_st_walkforward.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add analysis_v157_player_corrected_st_walkforward.csv summary_v157_player_corrected_st_walkforward.md
          git diff --cached --quiet || git commit -m 'Add v157 player corrected ST results'
          git push
