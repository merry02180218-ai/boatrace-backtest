name: v346 1-head v345 artifact fast verify

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v346_1head_v345_artifact_fast_verify.py'
      - '.github/workflows/v346-1head-v345-artifact-fast-verify.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Download repaired v337 canonical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v337prev
          gh run download 34782769446 --name v337-1head-head-cutoff-volume --dir /tmp/v337prev
          test -f /tmp/v337prev/analysis_v337_candidate_exhibition.csv
      - name: Verify v345 production identity
        run: python run_v346_1head_v345_artifact_fast_verify.py /tmp/v337prev/analysis_v337_candidate_exhibition.csv
      - name: Show result
        if: always()
        run: cat /tmp/v346fast/result_v346_fast.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v346-1head-v345-artifact-fast-verify
          path: /tmp/v346fast/
