name: research-3head-dual-feb-core-native-replay
on:
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn requests beautifulsoup4 joblib
      - name: Preflight
        run: |
          python -m py_compile prepare_v288_historical_pre_input.py build_3head_v288_operational_month_day.py replay_v288_operational_day.py verify_v288_operational_pre_replay.py
      - name: Download frozen canonical v243 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34383567078 --repo merry02180218-ai/boatrace-backtest --name v243-3head-expand-feature-audit --dir golden_v243
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
      - name: Materialize frozen v234 Waku10 reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
          V233_DIR: /tmp/v233
        run: |
          rm -rf /tmp/v233 data/audit/v234_waku10
          gh run download 34324515336 --repo merry02180218-ai/boatrace-backtest --name v233-waku10-coverage-backfill --dir /tmp/v233
          python - <<'PY'
          import pandas as pd
          import analyze_v234_3head_waku10_restored_replay as v234
          q=v234.reconstruct()
          q['date']=q['date'].astype(str)
          chk=q[(q.date>='2025-12-01')&(q.date<='2026-01-31')].copy()
          assert len(chk)==62, len(chk)
          assert not (chk.source=='missing').any(), chk[chk.source=='missing'].to_dict('records')
          assert (chk.rows>0).all(), chk[chk.rows<=0].to_dict('records')
          assert v234.COV.exists() and v234.COV.stat().st_size>0
          print('V234_WAKU_READY',len(q),'frozen_history_days',len(chk),'rows',int(chk.rows.sum()))
          PY
          test -s analysis_v234_waku10_reconstruction_coverage.csv
          test -d data/audit/v234_waku10/restored
      - name: Resolve frozen February CORE dates
        run: |
          python verify_v288_operational_pre_replay.py >/tmp/v288.txt
          python - <<'PY'
          import pandas as pd
          q=pd.read_csv('analysis_v243_3head_expand_feature_audit.csv',dtype={'race_code':str})
          # exact CORE membership is reconstructed by the verifier logic, not inferred from outcomes
          import verify_v288_operational_pre_replay as v
          q.date=q.date.astype(str);q['month']=q.date.str[:7];q['_target']=v.target(q).astype(int)
          ms=sorted(q.month.unique());cs=v.precols(q);pred=[]
          for i,m in enumerate(ms):
              if i<2:continue
              tr=q[q.month.isin(ms[:i])].copy();te=q[q.month==m].copy();fs=v.learned_features(tr,cs)
              trs=v.score_with(tr,tr,fs);te['_score']=v.score_with(tr,te,fs)
              te['grade']=__import__('numpy').where(te._score>=float(trs.quantile(v.S_Q)),'S',__import__('numpy').where(te._score>=float(trs.quantile(v.A_Q)),'A','B'));pred.append(te)
          u=pd.concat(pred,ignore_index=True);u=u[u.grade.isin(['S','A'])].copy();n=lambda c:pd.to_numeric(u[c],errors='coerce')
          final=u._target==1;core=(n('f__c_b3_minus_b4_waku_st')<=v.WAKU34)&(n('f__c_b3_minus_b4_st')>=v.ST34)&(n('f__c_b3_meetst')<=v.MEETST)
          s=final&core;p=u.bet==1;a=p&(~s)&(n('f__c_b3_minus_b4_st')>=v.A_ST34)&(n('f__c_wall12_weak')<=v.A_WALL);b=p&(~s)&(~a)&(n('f__c_b3_minus_b2_motor')>=v.B_MOTOR)&(n('f__c_b3_inside_nst')<=v.B_NST)
          z=u[(s|a|b)&u.month.eq('2026-02')].copy()
          assert len(z)==8,len(z)
          codes=z.race_code.astype(str).str.zfill(12).tolist()
          dates=sorted(set(x[:8] for x in codes))
          open('/tmp/core_dates','w').write(chr(10).join(dates)+chr(10))
          open('/tmp/core_codes','w').write(chr(10).join(codes)+chr(10))
          print('CORE_CODES',codes);print('CORE_DATES',dates)
          PY
      - name: Native v288 replay on CORE dates
        run: |
          mkdir -p core_replay identity_manifests
          while read d8; do
            d="${d8:0:4}-${d8:4:2}-${d8:6:2}"
            python prepare_v288_historical_pre_input.py --date "$d"
            python build_3head_v288_operational_month_day.py --date "$d" --month-first 2026-02-01 --month-next 2026-03-01 --history-cutoff 2026-01-31 --bias-start 2025-10-01 --force-full-cache
            cp "live_outputs/v288_operational/$d8/pre_scan.csv" "identity_manifests/$d8-pre_scan.csv" 2>/dev/null || true
            cp "live_outputs/v288_operational/$d8/daily_manifest.json" "identity_manifests/$d8-daily_manifest.json"
            python replay_v288_operational_day.py --date "$d" --cache "live_outputs/v288_operational/$d8/live_cache.joblib" --outdir "core_replay/$d8" --history-cutoff 2026-01-31
          done </tmp/core_dates
      - name: Audit frozen CORE identity
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          frozen=[x.strip().zfill(12) for x in Path('/tmp/core_codes').read_text().splitlines() if x.strip()]
          rows=[]
          for code in frozen:
              d8=code[:8]; mp=Path('identity_manifests')/f'{d8}-daily_manifest.json'; m=json.loads(mp.read_text())
              native=[str(x).zfill(12) for x in m.get('pre_candidate_race_codes',[])]
              p=Path('identity_manifests')/f'{d8}-pre_scan.csv'
              q=pd.read_csv(p,dtype={'race_code':str}) if p.exists() and p.stat().st_size else pd.DataFrame()
              rec={'frozen_core_code':code,'date':d8,'native_pre_candidate':code in native,'native_candidates':'|'.join(native),'pre_candidate_count':len(native),'manifest_force_full_cache':m.get('force_full_cache'),'result_or_payout_used':m.get('result_or_payout_used')}
              if not q.empty and 'race_code' in q:
                  hit=q[q.race_code.astype(str).str.zfill(12).eq(code)]
                  rec['present_in_pre_scan']=not hit.empty
                  if not hit.empty:
                      for col in ['grade','score','pre_grade','pre_score','route','decision']:
                          if col in hit: rec[col]=hit.iloc[0][col]
              else: rec['present_in_pre_scan']=False
              rows.append(rec)
          z=pd.DataFrame(rows);z.to_csv('core_identity_audit.csv',index=False)
          summary={'frozen_core':len(z),'exact_native_pre_matches':int(z.native_pre_candidate.sum()),'mismatches':int((~z.native_pre_candidate).sum()),'result_or_payout_used_any':bool(z.result_or_payout_used.fillna(False).any())}
          Path('core_identity_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+chr(10))
          print(z.to_string(index=False));print(json.dumps(summary,ensure_ascii=False,indent=2));print('CORE_IDENTITY_AUDIT_OK')
          PY
      - name: Aggregate CORE native replay
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          fs=[]
          for p in Path('core_replay').rglob('day_replay.csv'):
              q=pd.read_csv(p,dtype={'race_code':str});fs.append(q)
          z=pd.concat(fs,ignore_index=True)
          bets=z[z.decision.eq('BET')].copy()
          out={'policy':'CORE v288 native February replay','rows':len(z),'bets':len(bets),'hits':int(bets.hit.sum()),'stake':float(bets.total_stake.sum()),'payout':float(bets.return_yen.sum())}
          out['roi_pct']=100*out['payout']/out['stake'] if out['stake'] else None
          Path('core_native_feb_summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+chr(10))
          z.to_csv('core_native_feb_replay.csv',index=False)
          print(json.dumps(out,ensure_ascii=False,indent=2));print('CORE_NATIVE_FEB_REPLAY_OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-dual-feb-core-native-replay
          path: |
            core_native_feb_summary.json
            core_native_feb_replay.csv
            core_replay/**/day_summary.json
            core_identity_audit.csv
            core_identity_summary.json
            identity_manifests/*
