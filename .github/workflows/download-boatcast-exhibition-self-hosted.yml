name: download Boatcast exhibition (self-hosted Japan)

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: YYYYMMDD
        required: true
        default: '20260907'
      stadium:
        description: e.g. 01kiryu
        required: true
        default: '01kiryu'
      race:
        description: race number 1-12
        required: true
        default: '12'

permissions:
  contents: read
  actions: read

jobs:
  download:
    runs-on: [self-hosted, japan]
    timeout-minutes: 20
    env:
      RACE_DATE: ${{ inputs.race_date }}
      STADIUM: ${{ inputs.stadium }}
      RACE: ${{ inputs.race }}
      LOCAL_PYTHON: C:\Users\merry\AppData\Local\Programs\Python\Python311\python.exe
    steps:
      - uses: actions/checkout@v4
      - name: Check local Python 3.11
        shell: powershell
        run: |
          & $env:LOCAL_PYTHON --version
          & $env:LOCAL_PYTHON -m pip --version
      - name: Install Python dependencies
        shell: powershell
        run: '& $env:LOCAL_PYTHON -m pip install -q playwright'
      - name: Install Chromium
        shell: powershell
        run: '& $env:LOCAL_PYTHON -m playwright install chromium'
      - name: Check ffmpeg
        shell: powershell
        run: ffmpeg -version
      - name: Download exhibition replay
        shell: powershell
        run: '& $env:LOCAL_PYTHON download_boatcast_exhibition.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boatcast-exhibition-${{ inputs.race_date }}-${{ inputs.stadium }}-${{ inputs.race }}
          path: |
            boatcast_*_exhibition.mp4
            boatcast_*_exhibition.json
          if-no-files-found: ignore
