name: v137-1head-legacy-pre-topn-opt
on:
  push:
    paths:
      - 'analyze_v137_1head_legacy_pre_topn_opt.py'
      - '.github/workflows/v137-1head-legacy-pre-topn-opt.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python analyze_v137_1head_legacy_pre_topn_opt.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add analysis_v137_1head_legacy_pre_topn_opt.csv summary_v137_1head_legacy_pre_topn_opt.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate v137 legacy PRE top-N results"
            git pull --rebase origin main
            git push
          fi
