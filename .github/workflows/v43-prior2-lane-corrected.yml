name: v43-prior2-lane-corrected
on:
  push:
    paths:
      - 'analyze_v43_prior2_lane_corrected.py'
      - '.github/workflows/v43-prior2-lane-corrected.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python analyze_v43_prior2_lane_corrected.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v43_prior2_lane_corrected.md analysis_v43_prior2_lane_corrected.csv
          git diff --cached --quiet || git commit -m "Add v43 prior two-race lane corrected results"
          git push
