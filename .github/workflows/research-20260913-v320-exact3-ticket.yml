name: v320 exact-3-ticket policy autoresearch
on:
  push:
    paths:
      - 'run_v320_1head_exact3_ticket_policy.py'
      - '.github/workflows/research-20260913-v320-exact3-ticket.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Require reusable causal cache
        run: |
          test -f CACHE_V313_1HEAD_OPPONENT_CAUSAL.md
          test -f cache_v313_1head_opponent_pre.csv.gz
          test -f cache_v313_1head_opponent_p3.csv.gz
          test -f cache_v313_1head_opponent_p4.csv.gz
      - name: Run v320 exact-3-ticket policy research
        run: python run_v320_1head_exact3_ticket_policy.py
      - uses: actions/upload-artifact@v4
        with:
          name: v320-exact3-ticket-policy
          path: |
            summary_v320_1head_exact3_ticket_policy.md
            analysis_v320_1head_exact3_ticket_policy_*.csv
      - name: Commit v320 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add summary_v320_1head_exact3_ticket_policy.md analysis_v320_1head_exact3_ticket_policy_*.csv
          git diff --cached --quiet || git commit -m 'Add v320 exact-3-ticket policy results'
          git pull --rebase origin main
          git push
