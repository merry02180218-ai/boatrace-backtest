name: v276 4head opponent direct pair feature audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v276_4head_opponent_pair_feature_audit.py'
      - '.github/workflows/v276-4head-opponent-pair-feature-audit.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - run: python analyze_v276_4head_opponent_pair_feature_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v276-4head-opponent-pair-feature-audit
          path: |
            analysis_v276_4head_opponent_pair_family.csv
            analysis_v276_4head_opponent_pair_monthly.csv
            summary_v276_4head_opponent_pair_feature_audit.md
      - name: Commit v276 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v276_4head_opponent_pair_family.csv analysis_v276_4head_opponent_pair_monthly.csv summary_v276_4head_opponent_pair_feature_audit.md
          git commit -m "Add v276 4-head direct pair feature results" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
