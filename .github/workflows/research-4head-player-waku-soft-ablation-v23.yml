name: research-4head-player-waku-soft-ablation-v23

'on':
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scikit-learn
      - name: Preflight
        run: |
          python -m py_compile prepare_4head_6m_v93_neutral_waku.py research_4head_waku10_rel43_v4.py research_4head_player_waku_soft_ablation_v23.py
          grep -q "SEPTEMBER_OUTCOMES_READ.*False" research_4head_player_waku_soft_ablation_v23.py
          grep -q "holdout_used_for_selection.*False" research_4head_player_waku_soft_ablation_v23.py
          grep -q "BASE_CORE" research_4head_player_waku_soft_ablation_v23.py
          grep -q "PH4_REL43_W43" research_4head_player_waku_soft_ablation_v23.py
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: boatracecsv
      - name: Build causal parent
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/boatracecsv
        run: python prepare_4head_6m_v93_neutral_waku.py
      - name: Run soft rerank and feature ablation
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/boatracecsv
        run: python research_4head_player_waku_soft_ablation_v23.py
      - uses: actions/upload-artifact@v4
        with:
          name: head4-player-waku-soft-ablation-v23
          path: /tmp/head4_player_waku_soft_ablation_v23
