name: v315 pairwise SECOND autoresearch

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v315_1head_opponent_pairwise_second.py'
      - '.github/workflows/research-20260913-v315-pairwise-second.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Require reusable causal cache
        run: |
          test -f CACHE_V313_1HEAD_OPPONENT_CAUSAL.md
          test -f cache_v313_1head_opponent_pre.csv.gz
          test -f cache_v313_1head_opponent_p3.csv.gz
          test -f cache_v313_1head_opponent_p4.csv.gz
      - name: Run v315 pairwise SECOND research
        run: python run_v315_1head_opponent_pairwise_second.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v315-pairwise-second
          path: |
            summary_v315_1head_opponent_pairwise_second.md
            analysis_v315_1head_opponent_pairwise_second_*.csv
          if-no-files-found: warn
      - name: Commit v315 outputs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add summary_v315_1head_opponent_pairwise_second.md analysis_v315_1head_opponent_pairwise_second_*.csv
          git diff --cached --quiet || git commit -m 'Add v315 pairwise SECOND results'
          git pull --rebase origin main
          git push
