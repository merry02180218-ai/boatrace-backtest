name: v205 3head operational PRE to pickup replay
on:
  push:
    paths:
      - analyze_v205_3head_operational_replay.py
      - .github/workflows/v205-3head-operational-replay.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Run v205
        run: python analyze_v205_3head_operational_replay.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v205_3head_operational_replay.csv summary_v205_3head_operational_replay.md
          git diff --cached --quiet || git commit -m 'Run v205 operational replay'
          git pull --rebase
          git push
