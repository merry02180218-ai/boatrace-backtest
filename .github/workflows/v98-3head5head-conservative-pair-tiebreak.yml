name: v98-3head5head-conservative-pair-tiebreak
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v98_3head5head_conservative_pair_tiebreak.py'
      - '.github/workflows/v98-3head5head-conservative-pair-tiebreak.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v98 conservative pair tiebreak
        run: python analyze_v98_3head5head_conservative_pair_tiebreak.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v98_3head5head_conservative_pair_tiebreak.csv summary_v98_3head5head_conservative_pair_tiebreak.md
          git diff --cached --quiet || git commit -m 'Add v98 3-head 5-head conservative pair results'
          git push
