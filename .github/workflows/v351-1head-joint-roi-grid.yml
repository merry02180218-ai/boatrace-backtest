name: v351 1-head joint ROI grid
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grid-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build guarded joint-grid manifest
        run: python run_v351_1head_joint_roi_grid.py
      - name: Show manifest
        run: cat /tmp/v351-joint-roi-grid/grid_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: v351-joint-roi-grid-${{ github.run_id }}
          path: /tmp/v351-joint-roi-grid/
          retention-days: 30
