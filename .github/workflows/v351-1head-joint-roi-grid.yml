name: v351 1-head joint ROI grid
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run 441-cell joint ROI audit
        run: python run_v351_1head_joint_roi_grid.py
      - name: Show top rows
        run: head -21 /tmp/v351-joint-roi-grid/summary.csv && cat /tmp/v351-joint-roi-grid/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v351-joint-roi-grid-${{ github.run_id }}
          path: /tmp/v351-joint-roi-grid/
          retention-days: 30
