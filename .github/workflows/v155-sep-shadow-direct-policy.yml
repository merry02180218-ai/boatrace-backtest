name: v155 Sep shadow direct policy
on:
  push:
    paths:
      - 'analyze_v155_sep_shadow_direct_policy.py'
      - '.github/workflows/v155-sep-shadow-direct-policy.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn requests pandas beautifulsoup4
      - name: Run v155
        run: python analyze_v155_sep_shadow_direct_policy.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add analysis_v155_sep_shadow_direct_policy.csv summary_v155_sep_shadow_direct_policy.md
          git diff --cached --quiet || git commit -m 'Add v155 Sep shadow direct policy results'
          git push

