name: research-3head-a-opponent-feb-oneshot
on:
  push:
    paths:
      - '.github/triggers/research-3head-a-opponent-feb-oneshot.txt'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn requests
      - name: Strict preflight
        run: |
          python -m py_compile research/run_3head_a_opponent_feb_oneshot.py
          python -m py_compile research/run_3head_a_purchase_gate_dev.py
          find . -name 'analyze_v221_3head_scenario_pair.py' -print -quit | grep -q .
          grep -q "THRESHOLD=.50" research/run_3head_a_opponent_feb_oneshot.py
          grep -q "date(2026,2,28)" research/run_3head_a_opponent_feb_oneshot.py
          grep -q "day<=date(2026,1,31)" research/run_3head_a_opponent_feb_oneshot.py
          grep -q "order=v221.order" research/run_3head_a_opponent_feb_oneshot.py
          grep -q "make_pre_scores frame contract" research/run_3head_a_opponent_feb_oneshot.py
          grep -q "v221.END=date(2026,2,28)" research/run_3head_a_opponent_feb_oneshot.py
          grep -q "direct,ntrain=v221.fit_pair" research/run_3head_a_opponent_feb_oneshot.py
          if grep -Fq '\\n from datetime' research/run_3head_a_opponent_feb_oneshot.py; then echo "literal newline escape found"; exit 1; fi
          if grep -q "date(2026,3" research/run_3head_a_opponent_feb_oneshot.py; then echo "March access forbidden"; exit 1; fi
      - name: One-shot February validation
        run: cd research && python run_3head_a_opponent_feb_oneshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-a-opponent-feb-oneshot
          path: |
            research/research_3head_a_opponent_feb_oneshot.json
            research/research_3head_a_opponent_feb_oneshot.csv
