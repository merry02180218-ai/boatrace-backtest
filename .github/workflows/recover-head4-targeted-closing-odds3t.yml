name: recover head4 targeted closing odds3t

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy scikit-learn
      - name: Recover only uncovered HEAD4 Apr-Aug candidate odds
        run: python tools/fetch_head4_targeted_closing_odds3t.py
      - name: Commit recovered odds
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/official_closing_odds3t
          if git diff --cached --quiet; then
            echo 'No new odds files'
          else
            git commit -m 'data: recover targeted HEAD4 official closing odds'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
