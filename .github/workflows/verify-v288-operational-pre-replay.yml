name: verify-v288-operational-pre-replay
on:
  push:
    paths:
      - 'verify_v288_operational_pre_replay.py'
      - '.github/workflows/verify-v288-operational-pre-replay.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas
      - name: Download frozen canonical v243 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34383567078 --repo merry02180218-ai/boatrace-backtest --name v243-3head-expand-feature-audit --dir golden_v243
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
      - name: Replay leakage-free operational PRE + canonical v288 routes
        run: python verify_v288_operational_pre_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: verify-v288-operational-pre-replay
          path: verify_v288_operational_pre_replay.json
