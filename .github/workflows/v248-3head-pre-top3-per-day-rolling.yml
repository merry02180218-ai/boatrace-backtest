name: v248 3-head PRE top3 per day rolling
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v248_3head_pre_top3_per_day_rolling.py'
      - '.github/workflows/v248-3head-pre-top3-per-day-rolling.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas
      - uses: actions/download-artifact@v4
        with:
          name: v243-3head-expand-feature-audit
          run-id: 34383567078
          github-token: ${{ github.token }}
          path: .
      - run: python analyze_v248_3head_pre_top3_per_day_rolling.py
      - uses: actions/upload-artifact@v4
        with:
          name: v248-3head-pre-top3-per-day-rolling
          path: |
            analysis_v248_3head_pre_top3_per_day_rolling.csv
            summary_v248_3head_pre_top3_per_day_rolling.md
