name: Research 4-head v291 A rescue standalone

on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_4head_v291_a_rescue_standalone.py'
      - '.github/workflows/research-4head-v291-a-rescue-standalone.yml'

permissions:
  contents: write

concurrency:
  group: research-4head-v291-a-rescue-standalone
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Syntax check
        run: python -m py_compile analyze_4head_v291_a_rescue_standalone.py
      - name: Run A-layer standalone rescue research
        run: python analyze_4head_v291_a_rescue_standalone.py
      - name: Validate leakage guards and output
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          q=pd.read_csv('analysis_v288_4head_composite_odds_alln_detail.csv')
          assert set(q.month.astype(str).unique()) == {'2026-04','2026-05','2026-06'}
          j=json.loads(Path('head4_v291_a_rescue_candidate.json').read_text())
          assert j['jul_aug_outcomes_used'] is False
          assert j['september_outcomes_used'] is False
          assert j['v96_used'] is False
          assert j['base']['policy']=='HEAD4_V291_COMP7' and j['base']['immutable'] is True
          l=pd.read_csv('analysis_4head_v291_a_rescue_standalone_lomo.csv')
          assert set(l.holdout_month)=={'2026-04','2026-05','2026-06'}
          print(Path('summary_4head_v291_a_rescue_standalone.md').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: head4-v291-a-rescue-standalone
          path: |
            analysis_4head_v291_a_rescue_standalone.csv
            analysis_4head_v291_a_rescue_standalone_monthly.csv
            analysis_4head_v291_a_rescue_standalone_lomo.csv
            head4_v291_a_rescue_candidate.json
            summary_4head_v291_a_rescue_standalone.md
      - name: Persist results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_4head_v291_a_rescue_standalone.csv \
                  analysis_4head_v291_a_rescue_standalone_monthly.csv \
                  analysis_4head_v291_a_rescue_standalone_lomo.csv \
                  head4_v291_a_rescue_candidate.json \
                  summary_4head_v291_a_rescue_standalone.md
          git diff --cached --quiet && exit 0
          git commit -m 'Add A-layer standalone rescue research results'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
