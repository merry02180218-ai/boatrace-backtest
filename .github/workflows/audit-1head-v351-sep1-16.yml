name: audit-1head-v351-sep1-16
on:
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Verify daily rolling chronology guard
        run: |
          python - <<'PY'
          import pandas as pd
          import run_v323_1head_frozen_live_adapter as live
          prior=pd.DataFrame([{'date':'2026-09-01','month':'2026-09','race_code':'202609010101'}])
          live._audit_history(prior,'2026-09-02',True)
          fallback=pd.DataFrame([{'month':'2026-09','race_code':'202609010101'}])
          live._audit_history(fallback,'2026-09-02',True)
          for bad_date in ('2026-09-02','2026-09-03'):
            bad=pd.DataFrame([{'date':bad_date,'month':'2026-09','race_code':bad_date.replace('-','')+'0101'}])
            try:
              live._audit_history(bad,'2026-09-02',True)
            except RuntimeError:
              pass
            else:
              raise AssertionError(f'rolling guard accepted forbidden date {bad_date}')
          try:
            live._audit_history(prior,'2026-09-02',False)
          except RuntimeError:
            pass
          else:
            raise AssertionError('strict guard accepted current-month history')
          old=pd.DataFrame([{'date':'2026-08-31','month':'2026-08','race_code':'202608310101'}])
          live._audit_history(old,'2026-09-02',False)
          print('DAILY_ROLLING_CHRONOLOGY_GUARD_OK')
          PY
      - name: Verify production ticket policy mapping
        run: |
          python - <<'PY'
          import onehead_production_profile as prod
          import prepare_1head_v351_rolling_models as rolling
          import run_v299_1head_trifecta3_policy_search as v299
          import run_1head_v351_live_finalize as fin
          name=rolling.resolve_ticket_strategy(prod.TICKET_POLICY)
          assert prod.TICKET_POLICY=='v320_HYBRID'
          assert name=='HYBRID'
          p2={2:.40,3:.25,4:.15,5:.12,6:.08}
          pc={(s,t):.25 for s in range(2,7) for t in range(2,7) if s!=t}
          pair=v299.pair_prob(p2,pc,prod.TICKET_ALPHA)
          a=v299.STRATEGIES[name](p2,pc,pair)[:3]
          b=fin.v299.STRATEGIES['HYBRID'](p2,pc,pair)[:3]
          assert a==b and len(a)==3 and len(set(a))==3
          try:
            rolling.resolve_ticket_strategy('v320_NOT_REAL')
          except RuntimeError:
            pass
          else:
            raise AssertionError('unsupported ticket policy did not fail closed')
          print('V351_TICKET_POLICY_MAPPING_OK',a)
          PY
      - name: Rebuild chronology-safe September source through Sep16
        run: python build_1head_september_training_source.py --target-date 2026-09-17 --start-date 2026-09-01 --out-dir /tmp/sep
      - name: Prepare canonical v321 frozen history caches
        run: |
          /usr/bin/time -f 'v321_prepare_wall_sec=%e v321_prepare_max_rss_kb=%M' python run_v321_1head_julaug_nonpristine_validation.py --stage prepare
          test -s cache_v321_julaug_nonpristine_head_full.csv.gz
          test -s cache_v321_julaug_nonpristine_slim.csv.gz
      - name: Package audit inputs
        run: |
          mkdir -p audit_inputs
          cp /tmp/sep/september_training_rows.csv audit_inputs/
          cp cache_v321_julaug_nonpristine_head_full.csv.gz audit_inputs/
          cp cache_v321_julaug_nonpristine_slim.csv.gz audit_inputs/
      - uses: actions/upload-artifact@v4
        with:
          name: audit-v351-inputs-${{ github.run_id }}
          retention-days: 2
          path: audit_inputs/

  backtest:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 1, end: 2}
          - {start: 3, end: 4}
          - {start: 5, end: 6}
          - {start: 7, end: 8}
          - {start: 9, end: 10}
          - {start: 11, end: 12}
          - {start: 13, end: 14}
          - {start: 15, end: 16}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: audit-v351-inputs-${{ github.run_id }}
          path: audit_inputs
      - name: Restore canonical caches
        run: |
          cp audit_inputs/cache_v321_julaug_nonpristine_head_full.csv.gz .
          cp audit_inputs/cache_v321_julaug_nonpristine_slim.csv.gz .
          test -s audit_inputs/september_training_rows.csv
      - name: Backtest Sep ${{ matrix.start }}-${{ matrix.end }}
        run: |
          python audit_1head_v351_sep_chunk.py \
            --start-day ${{ matrix.start }} \
            --end-day ${{ matrix.end }} \
            --sep-source audit_inputs/september_training_rows.csv \
            --out-dir out_chunk
      - uses: actions/upload-artifact@v4
        with:
          name: audit-v351-sep-chunk-${{ matrix.start }}-${{ matrix.end }}-${{ github.run_id }}
          retention-days: 30
          path: out_chunk/

  aggregate:
    needs: [prepare, backtest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: audit-v351-sep-chunk-*-${{ github.run_id }}
          merge-multiple: true
          path: out_chunks
      - name: Aggregate and verify Sep1-16 audit
        run: |
          python - <<'PY'
          import csv,json
          from collections import defaultdict
          from pathlib import Path
          files=sorted(Path('out_chunks').glob('rows_*.csv'))
          if len(files)!=8:raise RuntimeError(f'expected 8 chunk row files, got {len(files)}: {files}')
          rows=[]
          for p in files:
            with p.open(encoding='utf-8-sig',newline='') as f:rows.extend(csv.DictReader(f))
          rows.sort(key=lambda r:(r['date'],r['race_code']))
          for r in rows:
            code=str(r['race_code']).zfill(12)
            if code.startswith('20260917') or not code.startswith('202609'):
              raise RuntimeError(f'forbidden race in audit output: {code}')
            day=int(code[6:8])
            if not (1<=day<=16):raise RuntimeError(f'out-of-range race in audit output: {code}')
          out=Path('out');out.mkdir(exist_ok=True)
          fields=['date','race_code','tickets','winner','head1','combo','payout100','hit','stake','return','final_head_p','opp_mass']
          with (out/'rows.csv').open('w',encoding='utf-8-sig',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          def yes(v):return str(v).strip().lower()=='true'
          n=len(rows);stake=sum(int(float(r['stake'] or 0)) for r in rows);ret=sum(int(float(r['return'] or 0)) for r in rows);h1=sum(yes(r['head1']) for r in rows);hits=sum(yes(r['hit']) for r in rows)
          daily=defaultdict(lambda:{'buy_races':0,'head1':0,'exact3_hits':0,'stake_yen':0,'return_yen':0})
          for r in rows:
            d=daily[r['date']];d['buy_races']+=1;d['head1']+=int(yes(r['head1']));d['exact3_hits']+=int(yes(r['hit']));d['stake_yen']+=int(float(r['stake'] or 0));d['return_yen']+=int(float(r['return'] or 0))
          daily_rows=[]
          for day in sorted(daily):
            d=daily[day];d.update({'date':day,'head1_rate':d['head1']/d['buy_races'] if d['buy_races'] else None,'exact3_rate':d['exact3_hits']/d['buy_races'] if d['buy_races'] else None,'roi':d['return_yen']/d['stake_yen'] if d['stake_yen'] else None});daily_rows.append(d)
          with (out/'daily.csv').open('w',encoding='utf-8-sig',newline='') as f:
            fs=['date','buy_races','head1','head1_rate','exact3_hits','exact3_rate','stake_yen','return_yen','roi'];w=csv.DictWriter(f,fieldnames=fs);w.writeheader();w.writerows(daily_rows)
          s={'period':'20260901-20260916','buy_races':n,'head1':h1,'head1_rate':h1/n if n else None,'exact3_hits':hits,'exact3_rate':hits/n if n else None,'stake_yen':stake,'return_yen':ret,'roi':ret/stake if stake else None,'production_profile':'1HEAD_PRODUCTION_20260915_HEAD078_V351_OPPONENTCORE_G2_045_G3_100','today_20260917_used':False,'chronology_guard':True,'chunk_files':len(files),'source':'BoatraceCSV + existing v351 rolling path; 2-day parallel chunks'}
          (out/'summary.json').write_text(json.dumps(s,ensure_ascii=False,indent=2));print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audit-v351-sep1-16-${{ github.run_id }}
          retention-days: 30
          path: out/
