name: audit-4head-joint-headprob-opponentmass-lastminute
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 依存関係をインストール
        run: pip install pandas numpy scipy scikit-learn requests joblib beautifulsoup4
      - name: 3次元ROI監査
        run: python audit_4head_joint_headprob_opponentmass_lastminute.py
      - name: 結果を保存
        uses: actions/upload-artifact@v4
        with:
          name: head4-joint-headprob-opponentmass-lastminute
          path: /tmp/head4_joint_grid/
          if-no-files-found: error
