name: v148 v145 branch ticket ROI
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v148_v145_branch_ticket_roi.py'
      - '.github/workflows/v148-v145-branch-ticket-roi.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python analyze_v148_v145_branch_ticket_roi.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v148_v145_branch_ticket_roi.csv summary_v148_v145_branch_ticket_roi.md
          git diff --cached --quiet || git commit -m 'Generate v148 branch ticket ROI results'
          git pull --rebase origin main
          git push
