name: v134-1head-preclose-replace3
on:
  push:
    branches: [ main ]
    paths:
      - 'analyze_v134_1head_preclose_replace3.py'
      - '.github/workflows/v134-1head-preclose-replace3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn requests beautifulsoup4
      - run: python analyze_v134_1head_preclose_replace3.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add analysis_v134_1head_preclose_replace3.csv summary_v134_1head_preclose_replace3.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate v134 pre-close 3x replacement results"
            git pull --rebase origin main
            git push
          fi
