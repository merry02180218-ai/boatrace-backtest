name: v305 1head leakage audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v305_1head_leakage_audit.py'
      - '.github/workflows/research-20260912-v305-1head-leakage-audit.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Run v305 leakage audit
        run: python run_v305_1head_leakage_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v305-1head-leakage-audit
          path: |
            analysis_v305_1head_leakage_audit_*.csv
            summary_v305_1head_leakage_audit.md
      - name: Commit v305 outputs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add analysis_v305_1head_leakage_audit_*.csv summary_v305_1head_leakage_audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add v305 leakage audit outputs'
          git pull --rebase origin main
          git push
