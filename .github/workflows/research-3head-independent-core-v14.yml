name: research-3head-independent-core-v14
on:
  push:
    paths: [research/run_3head_independent_core_v14.fire]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scikit-learn requests
      - name: Download accepted CORE107
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p core107
          gh run download 35892602362 --repo ${{ github.repository }} --name research-3head-newcore-fast-v20 --dir core107
          python - <<'PY'
          import pandas as pd
          q=pd.read_csv('core107/accepted_core_fast_v20.csv',dtype={'race_code':str})
          assert len(q)==107
          print('CORE107_OK',len(q))
          PY
      - name: Preflight
        run: |
          python -m py_compile research/run_3head_three_layer_independent_core_v14.py
          grep -q "CORE_MONTH_ASSERT_FAIL" research/run_3head_three_layer_independent_core_v14.py
          grep -q "FOCUS_2PLUS_MODELS" research/run_3head_three_layer_independent_core_v14.py
      - name: Run
        run: |
          python research/run_3head_three_layer_independent_core_v14.py | tee v14.log
          grep -q "EXACT_ACCEPTED_CORE107 107" v14.log
          grep -q "SEPTEMBER_UNREAD" v14.log
          grep -q "PRODUCTION_UNCHANGED" v14.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-independent-core-v14
          path: |
            research_3head_three_layer_monthly_bets_v9.json
            research_3head_three_layer_monthly_bets_v9.csv
            v14.log
