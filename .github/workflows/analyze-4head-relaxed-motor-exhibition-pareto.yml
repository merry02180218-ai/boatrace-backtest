name: head4-relaxed-motor-exhibition-pareto
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_4head_relaxed_motor_exhibition_pareto.py'
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scikit-learn requests beautifulsoup4
      - run: |
          set -o pipefail
          grep -q "TRAIN=('2026-04','2026-05','2026-06')" analyze_4head_relaxed_motor_exhibition_pareto.py
          grep -q "HOLD=('2026-07','2026-08')" analyze_4head_relaxed_motor_exhibition_pareto.py
          python analyze_4head_relaxed_motor_exhibition_pareto.py | tee /tmp/run.log
          cp /tmp/run.log /tmp/head4_relaxed_motor/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: head4-relaxed-motor-exhibition-pareto
          retention-days: 14
          path: /tmp/head4_relaxed_motor/*
