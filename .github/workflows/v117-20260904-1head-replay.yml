name: v117-20260904-1head-replay
on:
  push:
    branches: [ main ]
    paths:
      - 'replay_v117_20260904_1head.py'
      - '.github/workflows/v117-20260904-1head-replay.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn requests beautifulsoup4
      - name: Run Sep 4 v109 v110 no-leak replay
        run: python replay_v117_20260904_1head.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add replay_v117_20260904_1head.csv summary_v117_20260904_1head.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate Sep 4 v109 v110 no-leak replay"
            git pull --rebase origin main
            git push
          fi
