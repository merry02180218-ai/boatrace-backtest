name: v173 3head venue second prior
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v173_3head_venue_second_prior.py'
      - '.github/workflows/v173-3head-venue-second-prior.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn
      - name: Run v173
        run: python analyze_v173_3head_venue_second_prior.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v173_3head_venue_second_prior.csv summary_v173_3head_venue_second_prior.md
          git diff --cached --quiet || git commit -m "Add v173 venue second-prior results"
          git push
