name: v23-daypreview
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'analyze_v23_20260902_daypreview.py'
      - '.github/workflows/v23.yml'
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v23 Sep 2 same-day exhibition diagnostic
        run: python analyze_v23_20260902_daypreview.py
      - name: Commit v23 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add analysis_v23_20260902.md races_v23_20260902.csv
          if ! git diff --cached --quiet; then
            git commit -m "Run v23 Sep 2 same-day preview diagnostic"
            git push
          fi
