name: 1HEAD inner ST weakness v7
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research_1head_inner_st_weakness_v7.py'
      - '.github/workflows/research-1head-inner-st-v7.yml'
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
      - name: Dependencies
        shell: bash
        run: python -m pip install -q --disable-pip-version-check numpy pandas
      - name: Download frozen v360 prepared
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'v360'; New-Item -ItemType Directory -Force -Path $root | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'v360.zip'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" -Headers $headers -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $prep=Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in '.pkl','.pickle' } | Select-Object -First 1
          "PREP=$($prep.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Inner ST weakness v7
        shell: pwsh
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python research_1head_inner_st_weakness_v7.py --prepared "$env:PREP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onehead-inner-st-v7-${{ github.run_id }}
          path: ${{ runner.temp }}/1head-mechanism-discovery-v7
