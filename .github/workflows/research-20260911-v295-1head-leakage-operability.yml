name: research v295 1head leakage operability

on:
  workflow_dispatch:
  push:
    paths:
      - analyze_v295_1head_leakage_operability_audit.py
      - .github/workflows/research-20260911-v295-1head-leakage-operability.yml

permissions:
  contents: write
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn
      - name: Run v295 leakage and operability audit
        run: python analyze_v295_1head_leakage_operability_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v295-1head-leakage-operability
          path: |
            analysis_v295_1head_leakage_operability_slot_audit.csv
            analysis_v295_1head_leakage_operability_folds.csv
            analysis_v295_1head_leakage_operability_monthly.csv
            analysis_v295_1head_leakage_operability_univariate.csv
            summary_v295_1head_leakage_operability.md
          if-no-files-found: ignore
      - name: Commit compact audit outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add analysis_v295_1head_leakage_operability_slot_audit.csv \
                  analysis_v295_1head_leakage_operability_folds.csv \
                  analysis_v295_1head_leakage_operability_monthly.csv \
                  analysis_v295_1head_leakage_operability_univariate.csv \
                  summary_v295_1head_leakage_operability.md
          if ! git diff --cached --quiet; then
            git commit -m "results: v295 1-head leakage operability audit"
            git pull --rebase origin main
            git push
          fi
