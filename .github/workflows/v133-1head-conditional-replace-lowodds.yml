name: v133-1head-conditional-replace-lowodds
on:
  push:
    paths:
      - 'analyze_v133_1head_conditional_replace_lowodds.py'
      - '.github/workflows/v133-1head-conditional-replace-lowodds.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn requests beautifulsoup4
      - run: python analyze_v133_1head_conditional_replace_lowodds.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add analysis_v133_1head_conditional_replace_lowodds.csv summary_v133_1head_conditional_replace_lowodds.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate v133 conditional low-odds replacement results"
            git pull --rebase origin main
            git push
          fi
