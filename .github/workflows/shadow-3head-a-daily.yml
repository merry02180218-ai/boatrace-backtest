name: shadow-3head-a-daily
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date YYYY-MM-DD; blank = today JST'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '5 21 * * *'
    - cron: '35 21 * * *'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn joblib
      - name: Download frozen A PRE feature manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10556868870/zip > /tmp/a_features.zip
          mkdir -p /tmp/a_features research
          unzip -oq /tmp/a_features.zip -d /tmp/a_features
          SRC=$(find /tmp/a_features -type f -name '3head_a_frozen_pre_features.json' | head -1)
          test -n "$SRC"
          cp "$SRC" research/3head_a_frozen_pre_features.json
          python - <<'PY'
          import json
          z=json.load(open('research/3head_a_frozen_pre_features.json',encoding='utf-8'))
          assert z['policy']=='3HEAD_A_PRECISION_V1'
          assert z['feature_count']==370 and len(z['features'])==370 and len(set(z['features']))==370
          print('FROZEN_A_PRE_FEATURES_READY',z['feature_count'])
          PY
      - name: Install frozen A PRE feature manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10556723042/zip > /tmp/a_features.zip
          rm -rf /tmp/a_features
          mkdir -p /tmp/a_features
          unzip -oq /tmp/a_features.zip -d /tmp/a_features
          SRC=$(find /tmp/a_features -type f -name '3head_a_frozen_pre_features.json' | head -1)
          test -n "$SRC"
          cp "$SRC" research/3head_a_frozen_pre_features.json
          python - <<'PY'
          import json
          z=json.load(open('research/3head_a_frozen_pre_features.json',encoding='utf-8'))
          assert z['policy']=='3HEAD_A_PRECISION_V1'
          assert z['feature_count']==370 and len(z['features'])==370 and len(set(z['features']))==370
          print('A_PRE_FEATURE_MANIFEST_OK',z['feature_count'])
          PY
      - name: Resolve target date
        id: date
        env:
          INPUT_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "${INPUT_DATE:-}" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            TARGET_DATE=$(TZ=Asia/Tokyo date +%F)
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
      - name: Build A pre-motor shadow cache
        run: python build_3head_a_daily_shadow.py --date "${{ steps.date.outputs.target_date }}"
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-3head-a-daily-${{ steps.date.outputs.target_date }}
          path: live_outputs/a_precision/
          if-no-files-found: error
