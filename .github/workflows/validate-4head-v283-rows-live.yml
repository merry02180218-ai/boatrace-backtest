name: validate-4head-v283-rows-live
on:
  push:
    paths:
      - 'build_4head_v283_rows_live.py'
      - 'verify_4head_v283_rows_live.py'
      - 'head4_v291_downstream_inference.py'
      - 'artifacts/head4_v291_downstream_20260630.json'
      - '.github/workflows/validate-4head-v283-rows-live.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy
      - name: Syntax check
        run: python -m py_compile build_4head_v283_rows_live.py verify_4head_v283_rows_live.py head4_v291_downstream_inference.py
      - name: Exact historical formula contract
        run: python verify_4head_v283_rows_live.py
      - name: Immutable result-blind guard
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('build_4head_v283_rows_live.py').read_text().lower()
          for x in ['data/results/','payout','winner','actual_result','valid_result','closing_odds']:
              assert x not in s, x
          assert 'jul_aug_labels_used":false' in s.replace(' ','')
          assert 'september_labels_used":false' in s.replace(' ','')
          assert 'v96_used":false' in s.replace(' ','')
          print('result-blind immutable guard PASS')
          PY
