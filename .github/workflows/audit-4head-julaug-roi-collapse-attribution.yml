name: audit-4head-julaug-roi-collapse-attribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy scikit-learn requests joblib beautifulsoup4
      - name: 7-8月ROI低下要因分解
        run: python audit_4head_julaug_roi_collapse_attribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: head4-julaug-roi-collapse-attribution
          path: /tmp/head4_julaug_roi_attribution/
          if-no-files-found: error
