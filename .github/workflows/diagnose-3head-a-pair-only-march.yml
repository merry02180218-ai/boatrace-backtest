name: diagnose-3head-a-pair-only-march
concurrency:
  group: diagnose-3head-a-pair-only-march
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-3head-a-pair-only-march.yml'
      - 'replay_v288_historical_day.py'
      - 'research/aggregate_3head_a_pair_only_march.py'
permissions:
  contents: read
  actions: read
jobs:
  prepare_odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas
      - name: Download frozen Wave21 source
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10317157868/zip > /tmp/wave21.zip
          unzip -oq /tmp/wave21.zip -d /tmp/wave21
          SRC=$(find /tmp/wave21 -type f -name 'analysis_v289_3head_wave21_allrace_feature_settled.csv' | head -1)
          test -n "$SRC"
          cp "$SRC" analysis_v289_3head_wave21_allrace_feature_settled.csv
      - run: python research/materialize_3head_a_march_closing_odds.py
      - uses: actions/upload-artifact@v4
        with:
          name: a-march-closing-odds-pair-only
          path: data/official_closing_odds3t/

  replay:
    needs: prepare_odds
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        date:
          - '2026-03-01'
          - '2026-03-02'
          - '2026-03-03'
          - '2026-03-05'
          - '2026-03-06'
          - '2026-03-07'
          - '2026-03-08'
          - '2026-03-09'
          - '2026-03-10'
          - '2026-03-11'
          - '2026-03-12'
          - '2026-03-13'
          - '2026-03-14'
          - '2026-03-15'
          - '2026-03-16'
          - '2026-03-18'
          - '2026-03-19'
          - '2026-03-20'
          - '2026-03-21'
          - '2026-03-22'
          - '2026-03-24'
          - '2026-03-27'
          - '2026-03-28'
          - '2026-03-29'
          - '2026-03-30'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scikit-learn catboost requests beautifulsoup4 joblib
      - name: Frozen canonical artifacts
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          gh run download 34383567078 --repo ${{ github.repository }} --name v243-3head-expand-feature-audit --dir golden_v243
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
          gh run download 34326743303 --repo ${{ github.repository }} --name v234-3head-waku10-restored-replay --dir golden_v234
          cp golden_v234/analysis_v234_waku10_reconstruction_coverage.csv .
          mkdir -p data/audit
          cp -r golden_v234/data/audit/v234_waku10 data/audit/
      - name: Frozen March odds
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          mkdir -p /tmp/odds
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name a-march-closing-odds-pair-only --dir /tmp/odds
          mkdir -p data/official_closing_odds3t
          cp -r /tmp/odds/* data/official_closing_odds3t/
      - run: python prepare_v288_historical_pre_input.py --date '${{ matrix.date }}'
      - name: Build February-28 frozen full downstream cache
        run: >-
          python build_3head_v288_operational_month_day.py
          --date '${{ matrix.date }}'
          --month-first 2026-03-01
          --month-next 2026-04-01
          --history-cutoff 2026-02-28
          --bias-start 2026-02-01
          --force-full-cache
      - name: Freeze candidate universe to adopted A
        run: |
          DAY8=$(echo '${{ matrix.date }}' | tr -d '-')
          python research/prepare_3head_a_v288_ticket_cache.py --date '${{ matrix.date }}' --cache "live_outputs/v288_operational/$DAY8/live_cache.joblib"
      - name: Pair-only diagnostic replay
        run: |
          DAY8=$(echo '${{ matrix.date }}' | tr -d '-')
          python replay_v288_historical_day.py             --date '${{ matrix.date }}'             --cache "live_outputs/v288_operational/$DAY8/live_cache.joblib"             --outdir "a_pair_only_march/$DAY8"             --expected-history-cutoff 2026-02-28             --downstream-mode pair_only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-pair-only-march-${{ matrix.date }}
          path: a_pair_only_march/
          if-no-files-found: ignore

  aggregate:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas
      - name: Download day artifacts
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          mkdir -p all_days
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --pattern 'a-pair-only-march-*' --dir all_days || true
      - run: python research/aggregate_3head_a_pair_only_march.py --root all_days
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-3head-a-pair-only-march
          path: research_3head_a_pair_only_march_summary.json
          if-no-files-found: ignore
