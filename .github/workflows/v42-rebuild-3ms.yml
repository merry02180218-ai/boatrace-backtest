name: v42-rebuild-3ms
on:
  push:
    paths:
      - 'analyze_v42_rebuild_3ms.py'
      - '.github/workflows/v42-rebuild-3ms.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python analyze_v42_rebuild_3ms.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v42_rebuild_3ms.md races_v42_rebuild_3ms.csv
          git diff --cached --quiet || git commit -m "Add v42 rebuilt 3MS results"
          git push
