name: v39-slow-dash-wind
on:
  push:
    paths:
      - 'analyze_v39_slow_dash_wind.py'
      - '.github/workflows/v39-slow-dash-wind.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python analyze_v39_slow_dash_wind.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v39_slow_dash_wind.md analysis_v39_slow_dash_wind.csv
          git diff --cached --quiet || git commit -m "Add v39 slow dash wind results"
          git push
