name: v312 outer second gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v312_1head_opponent_outer_gate.py'
      - 'cache_v313_1head_opponent_pre.csv.gz'
      - 'cache_v313_1head_opponent_p3.csv.gz'
      - 'cache_v313_1head_opponent_p4.csv.gz'
      - 'CACHE_V313_1HEAD_OPPONENT_CAUSAL.md'
      - '.github/workflows/research-20260912-v312-outer-gate.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Verify reusable causal cache exists
        run: |
          test -f cache_v313_1head_opponent_pre.csv.gz
          test -f cache_v313_1head_opponent_p3.csv.gz
          test -f cache_v313_1head_opponent_p4.csv.gz
          test -f CACHE_V313_1HEAD_OPPONENT_CAUSAL.md
      - name: Run v312 outer gate from cache
        run: python run_v312_1head_opponent_outer_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v312-outer-gate
          path: |
            analysis_v312_1head_opponent_outer_gate_*.csv
            summary_v312_1head_opponent_outer_gate.md
          if-no-files-found: ignore
      - name: Commit outputs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_v312_1head_opponent_outer_gate_*.csv summary_v312_1head_opponent_outer_gate.md
          git diff --cached --quiet || git commit -m 'Add v312 outer gate results'
          git pull --rebase origin main
          git push
