name: 1HEAD ENV expansion opponent scan 20260925

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_1head_env_expansion_opponent_20260925.py'
      - '.github/workflows/1head-env-expansion-opponent-1head-head-cutoff-volume.yml'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Prepare full Jul-Aug causal head universe
        run: python run_v321_1head_julaug_nonpristine_validation.py --stage prepare
      - uses: actions/upload-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-prepare
          path: |
            cache_v321_julaug_nonpristine_slim.csv.gz
            cache_v321_julaug_nonpristine_head.csv
            cache_v321_julaug_nonpristine_meta.csv

  second:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-prepare
          path: .
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage second
      - uses: actions/upload-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-second
          path: cache_v321_julaug_second.pkl

  base-third:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-prepare
          path: .
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage base-third
      - uses: actions/upload-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-base-third
          path: cache_v321_julaug_base_pc.pkl

  third:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-prepare
          path: .
      - run: python run_v321_1head_julaug_nonpristine_validation.py --stage third
      - uses: actions/upload-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-third
          path: cache_v321_julaug_third.pkl

  audit:
    needs: [prepare, second, base-third, third]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - uses: actions/download-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-prepare
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-second
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-base-third
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: 1head-env-expansion-opponent-julaug-third
          path: .
      - name: Run 1head-env-expansion-opponent head-cutoff-only audit
        run: python research_1head_env_expansion_opponent_20260925.py
      - name: Show summary
        if: always()
        run: cat /tmp/1head-env-expansion-opponent/summary_1head-env-expansion-opponent.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 1head-env-expansion-opponent-1head-head-cutoff-volume
          path: /tmp/1head-env-expansion-opponent/
