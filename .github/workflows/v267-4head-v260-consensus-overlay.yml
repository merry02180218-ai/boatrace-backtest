name: v267-4head-v260-consensus-overlay

on:
  push:
    paths:
      - 'analyze_v267_4head_v260_consensus_overlay.py'
      - 'analysis_v250_4head_rebuild_baseline.csv'
      - 'analysis_v264_4head_feature_exhaustive.csv'
      - '.github/workflows/v267-4head-v260-consensus-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - run: python analyze_v267_4head_v260_consensus_overlay.py
      - uses: actions/upload-artifact@v4
        with:
          name: v267-4head-v260-consensus-overlay
          path: |
            analysis_v267_4head_v260_consensus_overlay.csv
            summary_v267_4head_v260_consensus_overlay.md
      - name: Commit v267 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v267_4head_v260_consensus_overlay.csv summary_v267_4head_v260_consensus_overlay.md
          if git diff --cached --quiet; then
            echo "No v267 output changes to commit"
          else
            git commit -m "Add v267 4-head consensus overlay results"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
