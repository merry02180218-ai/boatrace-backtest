name: analyze-4head-v283-july-cond-third-misses
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn
      - name: Analyze July conditional THIRD misses
        run: python analyze_4head_v283_july_cond_third_misses.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-v283-july-cond-third-misses
          path: /tmp/head4_v283_july_third/
          if-no-files-found: warn
