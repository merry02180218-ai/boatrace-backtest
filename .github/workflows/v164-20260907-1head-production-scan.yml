name: v164-20260907-1head-production-scan
on:
  push:
    branches: [ main ]
    paths:
      - 'predict_v164_20260907_1head_production.py'
      - '.github/workflows/v164-20260907-1head-production-scan.yml'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn requests beautifulsoup4
      - name: Run Sep 7 production 1-head scan
        run: python predict_v164_20260907_1head_production.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add prediction_v164_20260907_1head_production.csv summary_v164_20260907_1head_production.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate Sep 7 production 1-head scan"
            git pull --rebase origin main
            git push
          fi
