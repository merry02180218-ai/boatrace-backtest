name: v207 enhanced 3-head PRE validation
on:
  push:
    paths:
      - 'analyze_v207_3head_enhanced_pre.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn requests beautifulsoup4
      - name: Run v207 enhanced PRE validation
        run: python analyze_v207_3head_enhanced_pre.py
      - name: Commit v207 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_v207_3head_enhanced_pre.csv analysis_v207_3head_enhanced_pre_roi.csv summary_v207_3head_enhanced_pre.md
          git diff --cached --quiet || git commit -m 'Add v207 enhanced PRE results'
          git push
