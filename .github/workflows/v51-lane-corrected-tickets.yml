name: v51-lane-corrected-tickets
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'backtest_v51_lane_corrected_tickets.py'
      - 'backtest_v51_lane_corrected_tickets_fix.py'
      - '.github/workflows/v51-lane-corrected-tickets.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v51 lane-corrected ticket backtest
        run: python backtest_v51_lane_corrected_tickets_fix.py
      - name: Commit v51 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v51_lane_corrected_tickets.md analysis_v51_lane_corrected_tickets.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add v51 lane-corrected ticket backtest results"
            git pull --rebase origin main
            git push
          fi
