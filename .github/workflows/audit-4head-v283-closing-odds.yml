name: audit-4head-v283-closing-odds
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy scikit-learn
      - name: Run retrospective closing odds diagnostic
        run: python audit_4head_86r_v283_closing_odds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-v283-closing-odds-diagnostic
          path: /tmp/head4_v283_closing/
          if-no-files-found: warn
