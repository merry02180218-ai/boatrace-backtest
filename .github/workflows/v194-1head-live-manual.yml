name: v194 1head live manual

on:
  push:
    paths:
      - 'predict_v194_1head_live_manual.py'
      - 'live_input_1head.json'
      - '.github/workflows/v194-1head-live-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy pandas scikit-learn requests beautifulsoup4
      - name: Run v109-v162 manual live
        run: python predict_v194_1head_live_manual.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prediction_v194_1head_live_manual.json summary_v194_1head_live_manual.md
          git diff --cached --quiet || git commit -m "Add v194 live 1-head result"
          git pull --rebase --autostash origin main
          git push
