name: 1HEAD broad five mechanism v22
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research_1head_broad_five_v22.py'
      - '.github/workflows/research-1head-broad-five-v22.yml'
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
      - name: Dependencies
        shell: bash
        run: python -m pip install -q --disable-pip-version-check numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Broad five v22
        shell: pwsh
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python research_1head_broad_five_v22.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onehead-broad-five-v22-${{ github.run_id }}
          path: ${{ runner.temp }}/1head-broad-five-v22
