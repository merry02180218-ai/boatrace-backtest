name: research-v288-waku10-restored-membership
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn requests
      - name: Preflight compile and safety audit
        run: |
          python -m py_compile research/audit_v288_waku10_restored_membership.py verify_v288_operational_pre_replay.py
          python - <<'PY'
          from pathlib import Path
          s=Path("research/audit_v288_waku10_restored_membership.py").read_text()
          code=" ".join(line for line in s.splitlines() if not line.lstrip().startswith("#"))
          assert "data/results/" not in code
          assert "data/payout" not in code
          assert "data/odds" not in code
          assert 'thresholds_changed":False' in s
          assert 'sep2026_read":False' in s
          assert 'f__c_b3_minus_b4_waku_st' in s and '_restored_waku34' in s
          assert 'clamp((.24-s3)/.14)-clamp((.24-s4)/.14)' in s
          print("STATIC_SAFETY_OK")
          PY
          python -c "import sys;sys.path.insert(0,'.');import verify_v288_operational_pre_replay;print('V288_IMPORT_OK')"
      - name: Download frozen canonical v243 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34383567078 --repo merry02180218-ai/boatrace-backtest --name v243-3head-expand-feature-audit --dir golden_v243
          test -s golden_v243/analysis_v243_3head_expand_feature_audit.csv
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
          python - <<'PY'
          import pandas as pd
          p='analysis_v243_3head_expand_feature_audit.csv'
          q=pd.read_csv(p,nrows=5)
          required={'race_code','date','f__c_b3_minus_b4_waku_st','f__c_b3_minus_b4_st','f__c_b3_meetst'}
          miss=required-set(q.columns)
          assert not miss, f'missing canonical columns: {sorted(miss)}'
          print('CANONICAL_SOURCE_CONTRACT_OK')
          PY
      - name: Run outcome-free restored Waku10 membership audit
        run: python research/audit_v288_waku10_restored_membership.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-v288-waku10-restored-membership
          path: research_v288_waku10_restored_membership.json
          if-no-files-found: warn
