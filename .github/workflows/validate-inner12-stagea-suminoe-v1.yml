name: validate-inner12-stagea-suminoe-v1

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight
        run: |
          python -m py_compile research/validate_inner12_stagea_suminoe_v1.py backtest.py
          python - <<'PY'
          from pathlib import Path
          p=Path('research/validate_inner12_stagea_suminoe_v1.py')
          s=p.read_text(encoding='utf-8')
          assert '\\n' not in s.replace('"\\n"','').replace("'\\n'",''), 'suspicious literal escaped newline'
          assert 'LATE18_CUT=0.435' in s
          assert 'VENUE_CODE=12' in s
          assert 'September outcome access blocked' in s
          print('PREFLIGHT_OK')
          PY

      - name: Run frozen Stage-A validation
        env:
          INNER12_STAGEA_OUTDIR: /tmp/inner12_stagea_suminoe_v1
          PYTHONPATH: .
        run: |
          mkdir -p /tmp/inner12_stagea_suminoe_v1
          python research/validate_inner12_stagea_suminoe_v1.py             | tee /tmp/inner12_stagea_suminoe_v1/run.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inner12-stagea-suminoe-v1
          path: /tmp/inner12_stagea_suminoe_v1/
