name: v219 3-head clean redesign baseline
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v219_3head_redesign_baseline.py'
      - '.github/workflows/v219-3head-redesign-baseline.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - name: Compile
        run: python -m py_compile analyze_v219_3head_redesign_baseline.py
      - name: Run clean pre-Jul audit
        run: python analyze_v219_3head_redesign_baseline.py
      - name: Verify contamination guard in outputs
        run: |
          python - <<'PY'
          import pandas as pd
          z=pd.read_csv('analysis_v219_3head_redesign_baseline.csv')
          assert len(z)>0
          assert (pd.to_datetime(z.date) < pd.Timestamp('2026-07-01')).all()
          assert set(z.month.unique()) <= {'2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'}
          print('PASS rows=',len(z),'races=',z.race_code.nunique(),'months=',sorted(z.month.unique()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v219-3head-redesign-baseline
          path: |
            analysis_v219_3head_redesign_baseline.csv
            analysis_v219_3head_calibration.csv
            summary_v219_3head_redesign_baseline.md
