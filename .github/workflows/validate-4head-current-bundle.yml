name: validate-4head-current-bundle
on:
  workflow_dispatch:
  push:
    paths:
      - 'build_4head_current_bundle.py'
      - 'verify_4head_current_bundle.py'
      - 'assemble_4head_v291_varn_live_input.py'
      - 'build_4head_a_live_live.py'
      - 'build_4head_v283_rows_live.py'
      - 'build_4head_env_entry_live.py'
      - 'head4_v273_a_live_inference.py'
      - 'head4_v291_downstream_inference.py'
      - 'artifacts/head4_v273_a_live_20260630.json'
      - 'artifacts/head4_v291_downstream_20260630.json'
      - '.github/workflows/validate-4head-current-bundle.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python verify_4head_current_bundle.py
