name: audit-4head-higher-volume-frontier

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/audit-4head-higher-volume-frontier.txt'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy scikit-learn requests joblib beautifulsoup4 lxml
      - run: mkdir -p /tmp/head4_higher_volume_frontier && python audit_4head_higher_volume_frontier.py | tee /tmp/head4_higher_volume_frontier/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: head4-higher-volume-frontier
          path: /tmp/head4_higher_volume_frontier/
