name: v372 1-head value-gated LOMO preclose
on:
  push:
    paths:
      - 'run_v372_1head_value_gated_lomo_preclose.py'
      - '.github/workflows/v372-1head-value-gated-lomo-preclose.yml'
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas requests
      - name: Download v370 frozen closing-odds features
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10560443188/zip" > /tmp/v370.zip
          mkdir -p /tmp/v370
          unzip -q /tmp/v370.zip -d /tmp/v370
          test -f /tmp/v370/formal_with_closing_odds.csv
      - name: Run v372 LOMO and pre-close replay
        run: python run_v372_1head_value_gated_lomo_preclose.py --features /tmp/v370/formal_with_closing_odds.csv
      - name: Show result
        if: always()
        run: |
          cat /tmp/v372-value-gated-lomo-preclose/result.json 2>/dev/null || true
          cat /tmp/v372-value-gated-lomo-preclose/closing_lomo.csv 2>/dev/null || true
          cat /tmp/v372-value-gated-lomo-preclose/preclose_coverage_by_month.csv 2>/dev/null || true
          cat /tmp/v372-value-gated-lomo-preclose/preclose_lomo.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v372-value-gated-lomo-preclose-${{ github.run_id }}
          path: /tmp/v372-value-gated-lomo-preclose/
          retention-days: 30

      - name: Publish compact audit record to main
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          if [ ! -f /tmp/v372-value-gated-lomo-preclose/result.json ]; then
            echo "no result.json to publish"
            exit 0
          fi
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['GITHUB_RUN_ID']
          def gh(path):
              p=subprocess.run(['gh','api',path],check=False,text=True,capture_output=True)
              if p.returncode: return None
              try:return json.loads(p.stdout)
              except:return None
          jobs=gh(f'/repos/{repo}/actions/runs/{run}/jobs') or {}
          arts=gh(f'/repos/{repo}/actions/runs/{run}/artifacts') or {}
          meta={
            'run_id':int(run),
            'run_url':f'https://github.com/{repo}/actions/runs/{run}',
            'head_sha':os.environ.get('GITHUB_SHA'),
            'jobs':[{'id':x.get('id'),'name':x.get('name'),'status':x.get('status'),'conclusion':x.get('conclusion')} for x in jobs.get('jobs',[])],
            'artifacts':[{'id':x.get('id'),'name':x.get('name'),'size_in_bytes':x.get('size_in_bytes')} for x in arts.get('artifacts',[])],
          }
          Path('/tmp/v372-value-gated-lomo-preclose/run_meta.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          PY
          git fetch origin main
          git reset --hard origin/main
          mkdir -p analysis/v372_value_gated_lomo_preclose
          cp /tmp/v372-value-gated-lomo-preclose/result.json analysis/v372_value_gated_lomo_preclose/result.json
          cp /tmp/v372-value-gated-lomo-preclose/run_meta.json analysis/v372_value_gated_lomo_preclose/run_meta.json
          cp /tmp/v372-value-gated-lomo-preclose/closing_lomo.csv analysis/v372_value_gated_lomo_preclose/closing_lomo.csv 2>/dev/null || true
          cp /tmp/v372-value-gated-lomo-preclose/preclose_coverage_by_month.csv analysis/v372_value_gated_lomo_preclose/preclose_coverage_by_month.csv 2>/dev/null || true
          cp /tmp/v372-value-gated-lomo-preclose/preclose_lomo.csv analysis/v372_value_gated_lomo_preclose/preclose_lomo.csv 2>/dev/null || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add analysis/v372_value_gated_lomo_preclose
          git commit -m "audit: publish v372 result run ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:main
