name: v162 1head direct pair model

on:
  push:
    paths:
      - 'analyze_v162_1head_pair_direct.py'
      - '.github/workflows/v162-1head-pair-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-v162:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy scikit-learn pandas requests beautifulsoup4
      - name: Run v162
        run: python analyze_v162_1head_pair_direct.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v162_1head_pair_direct.csv summary_v162_1head_pair_direct.md
          git diff --cached --quiet || git commit -m "Add v162 direct pair results"
          git push
