name: v242 3-head target comp3 min5 max10
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v242_3head_target_comp3_min5_max10.py'
      - '.github/workflows/v242-3head-target-comp3-min5-max10.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn requests
      - name: Run v242
        run: python analyze_v242_3head_target_comp3_min5_max10.py
      - uses: actions/upload-artifact@v4
        with:
          name: v242-3head-target-comp3-min5-max10
          path: |
            analysis_v242_3head_target_comp3_min5_max10.csv
            summary_v242_3head_target_comp3_min5_max10.md
