name: v74-ten-month-strict-flow
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_v74_ten_month_strict_flow.py'
      - 'historical_waku10_fetcher.py'
      - 'historical_data_loader.py'
      - '.github/workflows/v74-ten-month-strict-flow.yml'
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ten-month strict replay
        run: python -u backtest_v74_ten_month_strict_flow.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v74_ten_month_strict_flow.md analysis_v74_ten_month_strict_flow.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add v74 ten-month strict replay results"
            git pull --rebase origin main
            git push
          fi
