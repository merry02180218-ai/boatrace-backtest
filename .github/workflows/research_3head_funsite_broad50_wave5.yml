name: research-3head-funsite-broad50-wave5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/run_3head_funsite_broad50_wave5.py'
      - '.github/workflows/research_3head_funsite_broad50_wave5.yml'
permissions:
  contents: read
  actions: read
jobs:
  broad50-wave5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - name: Download frozen Wave21 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10317157868/zip > /tmp/wave21.zip
          unzip -oq /tmp/wave21.zip -d /tmp/wave21
          SRC=$(find /tmp/wave21 -type f -name 'analysis_v289_3head_wave21_allrace_feature_settled.csv' | head -1)
          test -n "$SRC"
          cp "$SRC" analysis_v289_3head_wave21_allrace_feature_settled.csv
      - name: Run Broad50 Wave5
        run: python research/run_3head_funsite_broad50_wave5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-funsite-broad50-wave5
          path: research_3head_funsite_broad50_wave5_result.json
          if-no-files-found: ignore
