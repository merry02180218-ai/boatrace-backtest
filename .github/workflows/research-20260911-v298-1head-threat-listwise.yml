name: v298 1head threat listwise trifecta5

on:
  push:
    paths:
      - 'analyze_v298_1head_threat_listwise_trifecta5.py'
      - '.github/workflows/research-20260911-v298-1head-threat-listwise.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - run: python analyze_v298_1head_threat_listwise_trifecta5.py
      - uses: actions/upload-artifact@v4
        with:
          name: v298-1head-threat-listwise
          path: |
            analysis_v298_1head_threat_listwise_trifecta5_*.csv
            summary_v298_1head_threat_listwise_trifecta5.md
      - name: Commit v298 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v298_1head_threat_listwise_trifecta5_*.csv summary_v298_1head_threat_listwise_trifecta5.md
          git diff --cached --quiet || git commit -m 'Add v298 1-head threat listwise results'
          git pull --rebase origin main
          git push origin HEAD:main
