name: audit-4head-base-ablation-v9

'on':
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scikit-learn
      - name: Preflight
        run: |
          python -m py_compile prepare_4head_6m_v93_neutral_waku.py audit_4head_base_ablation_v9.py
          grep -q 'CUT=.35' audit_4head_base_ablation_v9.py
          grep -q 'threshold_retuned.*False' audit_4head_base_ablation_v9.py
          grep -q 'SEPTEMBER_OUTCOMES_READ.*False' audit_4head_base_ablation_v9.py
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: boatracecsv
      - name: Build parent
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/boatracecsv
        run: python prepare_4head_6m_v93_neutral_waku.py
      - name: Feature family ablation
        run: python audit_4head_base_ablation_v9.py
      - uses: actions/upload-artifact@v4
        with:
          name: head4-base-ablation-v9
          path: /tmp/head4_base_ablation_v9
