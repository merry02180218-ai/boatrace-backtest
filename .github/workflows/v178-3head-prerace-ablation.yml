name: v178 3head prerace ablation
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v178_3head_prerace_ablation.py'
      - '.github/workflows/v178-3head-prerace-ablation.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn
      - name: Run v178
        run: python analyze_v178_3head_prerace_ablation.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v178_3head_prerace_ablation.csv summary_v178_3head_prerace_ablation.md
          git diff --cached --quiet || git commit -m "Add v178 prerace ablation results"
          git push
