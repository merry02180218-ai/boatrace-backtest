name: analyze-4head-exhibition-original-trainonly
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_4head_exhibition_original_trainonly.py'
      - '.github/workflows/analyze-4head-exhibition-original-trainonly.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scikit-learn requests beautifulsoup4
      - name: Guard September blind and production freeze
        run: |
          grep -q "END=date(2026,8,31)" analyze_4head_exhibition_original_trainonly.py
          grep -q "September outcome access blocked" analyze_4head_exhibition_original_trainonly.py
          grep -q "TRAIN=('2026-04','2026-05','2026-06')" analyze_4head_exhibition_original_trainonly.py
          grep -q "HOLD=('2026-07','2026-08')" analyze_4head_exhibition_original_trainonly.py
          echo 'guard PASS'
      - name: Analyze
        run: python analyze_4head_exhibition_original_trainonly.py | tee /tmp/head4_exhibition/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: head4-exhibition-original-trainonly
          retention-days: 14
          path: /tmp/head4_exhibition/*
