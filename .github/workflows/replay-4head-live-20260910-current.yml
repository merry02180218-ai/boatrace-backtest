name: replay-4head-live-20260910-current

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
          sparse-checkout: |
            data/programs/race_cards
            data/programs/waku10
            data/results/realtime
            data/previews/tkz
            data/previews/stt
            data/previews/original_exhibition
            data/previews/od3
      - run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml joblib
      - name: Preflight
        run: |
          python -m py_compile prepare_4head_120r_daily_state.py run_4head_120r_lastminute_fast.py audit_4head_live_replay_20260910_current.py prepare_4head_6m_v93_neutral_waku.py
          ! grep -n '\\\\n' prepare_4head_120r_daily_state.py run_4head_120r_lastminute_fast.py
      - name: Build causal state through 2026-09-09
        run: |
          python prepare_4head_120r_daily_state.py --target-date 2026-09-10 --out /tmp/state.json --data-root brcsv
          python - <<'PY'
          import json
          z=json.load(open('/tmp/state.json'))
          assert z['history_end']=='2026-09-09',z
          assert z['target_date_results_used'] is False,z
          print('CAUSAL_STATE_OK',z['history_end'],z['stats'])
          PY
      - name: Historical LIVE-input inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json
          day='2026/09/10'
          paths={
            'card':Path('brcsv/data/programs/race_cards')/day/'10.csv',
            'waku':Path('brcsv/data/programs/waku10')/day/'10.csv',
            'stt':Path('brcsv/data/previews/stt')/day/'10.csv',
            'orig':Path('brcsv/data/previews/original_exhibition')/day/'10.csv',
            'od3':Path('brcsv/data/previews/od3')/day/'10.csv',
          }
          # BoatraceCSV uses one daily CSV in YYYY/MM/DD.csv, so fall back to that.
          for k,p in list(paths.items()):
            q=p.parent.parent/f'{p.parent.name}.csv'
            if not p.exists() and q.exists(): paths[k]=q
          info={}
          for k,p in paths.items():
            info[k]={'path':str(p),'exists':p.exists(),'rows':(len(pd.read_csv(p,dtype=str)) if p.exists() else 0)}
          print('HISTORICAL_INPUTS',json.dumps(info,ensure_ascii=False))
          missing=[k for k,v in info.items() if not v['exists']]
          if missing: raise SystemExit('MISSING_HISTORICAL_LIVE_INPUTS '+','.join(missing))
          PY
      - name: Prepare audited historical primitives
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python prepare_4head_6m_v93_neutral_waku.py
      - name: Replay 2026-09-10 current LIVE
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
          STRICT_ROWS: /tmp/head4_clean_long_dataset/dataset.csv
          V93_ROWS: /tmp/head4_v93_all_parent/v93_all_parent.csv
        run: python audit_4head_live_replay_20260910_current.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-4head-live-20260910-current
          path: |
            /tmp/state.json
            /tmp/head4_ph5_live_walkforward/
          retention-days: 30
