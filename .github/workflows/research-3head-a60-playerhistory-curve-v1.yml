name: research-3head-a60-playerhistory-curve-v1
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn requests
      - name: Preflight compile and frozen-scope audit
        run: |
          python -m py_compile research/run_3head_a60_playerhistory_curve_v1.py verify_v288_operational_pre_replay.py research/run_3head_a_purchase_gate_dev.py research/run_3head_wave20_manual_gate.py
          grep -F '2026,2,28' research/run_3head_a60_playerhistory_curve_v1.py
          grep -F 'MONTHS=["feb"]' research/run_3head_a60_playerhistory_curve_v1.py
          grep -F 'between("20260201","20260228")' research/run_3head_a60_playerhistory_curve_v1.py
          grep -F '>=.60' research/run_3head_a60_playerhistory_curve_v1.py
          ! grep -E '2026[-/, ]*09|202609' research/run_3head_a60_playerhistory_curve_v1.py
      - name: Download frozen canonical v243 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34383567078 --repo merry02180218-ai/boatrace-backtest --name v243-3head-expand-feature-audit --dir golden_v243
          test -s golden_v243/analysis_v243_3head_expand_feature_audit.csv
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
      - name: Run overlap strength audit
        run: python research/run_3head_a60_playerhistory_curve_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-a60-playerhistory-curve-v1
          path: |
            research_3head_a60_playerhistory_curve_v1.json
            research_3head_a60_playerhistory_curve_v1.csv
