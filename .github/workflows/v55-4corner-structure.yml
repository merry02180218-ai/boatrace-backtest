name: v55-4corner-structure

on:
  push:
    paths:
      - 'backtest_v55_4corner_structure.py'
      - '.github/workflows/v55-4corner-structure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v55 structure model
        run: python backtest_v55_4corner_structure.py
      - name: Commit v55 results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add summary_v55_4corner_structure.md analysis_v55_4corner_structure.csv
          git diff --cached --quiet || git commit -m "Add v55 4-corner structure results"
          git push
