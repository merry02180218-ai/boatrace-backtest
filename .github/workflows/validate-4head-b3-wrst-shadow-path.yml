name: validate-4head-b3-wrst-shadow-path

on:
  push:
    paths:
      - 'head4_b3_wrst_shadow_inference.py'
      - 'scan_4head_b3_wrst_pre_shadow.py'
      - 'score_4head_b3_wrst_post_shadow.py'
      - 'assemble_4head_b3_wrst_shadow_input.py'
      - 'run_4head_b3_wrst_shadow.py'
      - 'artifacts/head4_b3_wrst_shadow_policy_v1.json'
      - '.github/workflows/validate-4head-b3-wrst-shadow-path.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Static policy and safety guards
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          policy=json.loads(Path('artifacts/head4_b3_wrst_shadow_policy_v1.json').read_text())
          assert policy['policy_id']=='HEAD4_B3_WR_ST_SHADOW_V1'
          assert policy['status']=='RESEARCH_SHADOW_ONLY'
          assert policy['production_policy_unchanged']=='HEAD4_V291_COMP7'
          assert policy['head_model']['training_label_cutoff']=='2026-06-30'
          assert policy['outcome_guards']['jul_aug_2026_outcomes_allowed'] is False
          assert policy['outcome_guards']['september_2026_outcomes_allowed'] is False
          files=['head4_b3_wrst_shadow_inference.py','scan_4head_b3_wrst_pre_shadow.py','score_4head_b3_wrst_post_shadow.py','assemble_4head_b3_wrst_shadow_input.py','run_4head_b3_wrst_shadow.py']
          for f in files:
              ast.parse(Path(f).read_text(), filename=f)
          runner=Path('run_4head_b3_wrst_shadow.py').read_text()
          assert 'production_action_taken' in runner and 'shadow_only' in runner
          assert 'result_or_payout_used' in runner
          assert 'market.persist_audit' in runner
          assert 'fetch_odds' in runner
          assert 'requests.post' not in runner and 'submit' not in runner.lower()
          post=Path('score_4head_b3_wrst_post_shadow.py').read_text()
          for k in ['orig_straight4','orig_lap4','orig_turn4']:
              assert k in post
          assert 'complete result-blind POST source provenance required' in post
          print('static shadow guards PASS')
          PY
      - name: Verify fail-closed source requirements
        run: |
          python - <<'PY'
          import json, tempfile, subprocess, sys
          from pathlib import Path
          # The POST scorer must reject incomplete source provenance before model scoring.
          with tempfile.TemporaryDirectory() as td:
              p=Path(td)
              pre=p/'pre.csv'; post=p/'post.json'; out=p/'out.json'
              pre.write_text('race_code,PRE,racer4,motor4_2ren,motor4_hist,turnfoot4_prior,b3_waku_wr,b3_waku_st\n202609140101,0.3,0.5,0.5,0.5,0.5,3.0,0.15\n')
              post.write_text(json.dumps({'race_code':'202609140101','source_provenance':{'result_blind':True,'complete':False},'features':{}}))
              cp=subprocess.run([sys.executable,'score_4head_b3_wrst_post_shadow.py','--pre-scan',str(pre),'--race-code','202609140101','--post-json',str(post),'--out',str(out)],capture_output=True,text=True)
              assert cp.returncode != 0
              assert 'complete result-blind POST source provenance required' in (cp.stderr+cp.stdout)
          print('fail-closed POST provenance PASS')
          PY
