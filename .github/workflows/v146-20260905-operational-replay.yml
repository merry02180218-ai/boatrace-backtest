name: v146 Sep5 operational replay
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v146_20260905_operational_replay.py'
      - '.github/workflows/v146-20260905-operational-replay.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn requests beautifulsoup4
      - run: python analyze_v146_20260905_operational_replay.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v146_20260905_operational_replay.csv summary_v146_20260905_operational_replay.md
          git diff --cached --quiet || git commit -m "Generate v146 Sep5 operational replay"
          git push
