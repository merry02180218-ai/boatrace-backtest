name: v298 1head audited settlement

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v298_1head_v288v283_audited.py'
      - 'run_v298_1head_v288v283_audited_v2.py'
      - 'analyze_v298_1head_threat_listwise_trifecta5.py'
      - '.github/workflows/research-20260911-v298-1head-audited.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Run audited v298 aligned with v288/v283
        run: python run_v298_1head_v288v283_audited_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: v298-1head-audited
          path: |
            analysis_v298_1head_threat_listwise_trifecta5_*.csv
            summary_v298_1head_threat_listwise_trifecta5.md
      - name: Commit v298 audited outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v298_1head_threat_listwise_trifecta5_*.csv summary_v298_1head_threat_listwise_trifecta5.md
          git diff --cached --quiet || git commit -m 'Add v298 audited research outputs'
          git push
