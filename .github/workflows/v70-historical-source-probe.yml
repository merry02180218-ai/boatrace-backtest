name: v70-historical-source-probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'probe_v70_historical_sources.py'
      - '.github/workflows/v70-historical-source-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python probe_v70_historical_sources.py
