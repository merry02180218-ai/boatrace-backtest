name: v181 3head style cut ROI OOS
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v181_3head_style_cut_roi_oos.py'
      - '.github/workflows/v181-3head-style-cut-roi-oos.yml'
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - name: Run v181
        run: python analyze_v181_3head_style_cut_roi_oos.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v181_3head_style_cut_roi_oos.csv summary_v181_3head_style_cut_roi_oos.md
          git diff --cached --quiet || git commit -m 'Add v181 frozen style cut ROI OOS results'
          git push
