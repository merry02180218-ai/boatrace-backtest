name: validate-4head-env-context-live

on:
  push:
    paths:
      - 'build_4head_env_context_live.py'
      - 'verify_4head_env_context_live.py'
      - '.github/workflows/validate-4head-env-context-live.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 numpy
      - name: Syntax check
        run: python -m py_compile build_4head_env_context_live.py verify_4head_env_context_live.py
      - name: Verify result-blind ENV context contract
        run: python verify_4head_env_context_live.py
