name: v53-pair-0902-flow

on:
  push:
    branches: [ main ]
    paths:
      - 'backtest_v53_pair_and_0902_flow.py'
      - '.github/workflows/v53-pair-0902-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v53 pair model and Sep 2 no-leak flow
        run: python backtest_v53_pair_and_0902_flow.py
      - name: Commit v53 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v53_pair_tickets.csv summary_v53_pair_tickets.md v53_20260902_pre.csv v53_20260902_direct.csv v53_20260902_settled.csv summary_v53_20260902_flow.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add v53 pair and Sep 2 flow results"
            git push
          fi
