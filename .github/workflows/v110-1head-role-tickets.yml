name: v110-1head-role-tickets
on:
  push:
    branches: [ main ]
    paths:
      - 'analyze_v110_1head_role_tickets.py'
      - 'analyze_v110b_1head_role_tickets.py'
      - '.github/workflows/v110-1head-role-tickets.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy scikit-learn
      - name: Run v110 analysis
        run: python analyze_v110b_1head_role_tickets.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add analysis_v110_1head_role_tickets.csv summary_v110_1head_role_tickets.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate v110 1-head role ticket results"
            git pull --rebase origin main
            git push
          fi
