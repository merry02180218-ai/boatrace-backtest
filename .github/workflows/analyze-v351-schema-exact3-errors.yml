name: analyze-v351-schema-exact3-errors
# NOTE: quote 'on' so YAML 1.1 parsers do not coerce it to boolean.
'on':
  workflow_dispatch: {}
  push:
    paths:
      - 'analyze_v351_schema_exact3_errors.py'
      - '.github/workflows/analyze-v351-schema-exact3-errors.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4
      - name: Rebuild schema audit source
        shell: bash
        run: |
          set -o pipefail
          python audit_v351_schema_correct_rebuild.py | tee schema_rebuild.txt
      - name: Decompose exact3 errors
        shell: bash
        run: |
          set -o pipefail
          python analyze_v351_schema_exact3_errors.py | tee schema_exact3_errors.txt
      - uses: actions/upload-artifact@v4
        with:
          name: analyze-v351-schema-exact3-errors
          path: |
            analysis_v351_schema_exact3_errors.csv
            analysis_v351_schema_exact3_error_summary.csv
            schema_rebuild.txt
            schema_exact3_errors.txt
