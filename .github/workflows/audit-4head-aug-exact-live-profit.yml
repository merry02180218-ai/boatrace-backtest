name: audit-4head-aug-exact-live-profit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pandas numpy scikit-learn requests
      - name: Download strict August universe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p strict
          gh run download 35487460383 -n head4-live-profitability-coverage -D strict
          echo "STRICT_ROWS=$(find strict -name strict_executable_rows.csv | head -1)" >> "$GITHUB_ENV"
      - name: Download all-parent V93 rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v93
          gh run download 35487172647 -n head4-v93-all-parent -D v93
          echo "V93_ROWS=$(find v93 -name v93_all_parent.csv | head -1)" >> "$GITHUB_ENV"
      - name: Run exact August current-LIVE profit replay
        run: python audit_4head_aug_exact_live_profit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-aug-exact-live-profit
          path: /tmp/head4_aug_exact_live_profit/
