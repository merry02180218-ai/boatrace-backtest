name: v145 one-gate specialized non1

on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v145_one_gate_specialized_non1.py'
      - '.github/workflows/v145-one-gate-specialized-non1.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn requests beautifulsoup4
      - run: python analyze_v145_one_gate_specialized_non1.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v145_one_gate_specialized_non1.csv summary_v145_one_gate_specialized_non1.md
          git diff --cached --quiet || git commit -m "Generate v145 one-gate specialized non1 results"
          git push
