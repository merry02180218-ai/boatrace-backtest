name: v302 1head transferred-feature ablation

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v302_1head_trifecta3_feature_ablation.py'
      - '.github/workflows/research-20260912-v302-feature-ablation.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Run v302 ablation research
        run: python run_v302_1head_trifecta3_feature_ablation.py
      - uses: actions/upload-artifact@v4
        with:
          name: v302-1head-feature-ablation
          path: |
            analysis_v302_1head_trifecta3_feature_ablation_*.csv
            summary_v302_1head_trifecta3_feature_ablation.md
      - name: Commit v302 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v302_1head_trifecta3_feature_ablation_*.csv summary_v302_1head_trifecta3_feature_ablation.md
          git diff --cached --quiet || git commit -m 'Add v302 feature ablation outputs'
          git pull --rebase origin main
          git push
