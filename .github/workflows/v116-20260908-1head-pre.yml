name: v116 2026-09-08 1-head pre scan

on:
  push:
    paths:
      - 'predict_v116_20260908_1head_pre.py'
      - '.github/workflows/v116-20260908-1head-pre.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn requests beautifulsoup4
      - name: Run PRE scan
        run: python predict_v116_20260908_1head_pre.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prediction_v116_20260908_1head_pre.csv summary_v116_20260908_1head_pre.md
          git diff --cached --quiet && exit 0
          git commit -m "Run 2026-09-08 v116 1-head pre scan"
          git pull --rebase --autostash origin main
          git push
