name: audit-4head-v283-fixed-gap005-006-monthly
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn lightgbm joblib
      - run: python audit_4head_v283_fixed_gap005_006_monthly.py
      - uses: actions/upload-artifact@v4
        with:
          name: head4-v283-fixed-gap005-006-monthly
          path: /tmp/head4_v283_fixed_gap005_006_monthly/
