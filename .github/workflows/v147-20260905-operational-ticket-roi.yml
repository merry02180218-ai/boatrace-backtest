name: v147 Sep5 operational ticket ROI
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v147_20260905_operational_ticket_roi.py'
      - '.github/workflows/v147-20260905-operational-ticket-roi.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn requests beautifulsoup4
      - run: python analyze_v147_20260905_operational_ticket_roi.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v147_20260905_operational_ticket_roi.csv summary_v147_20260905_operational_ticket_roi.md
          git diff --cached --quiet || git commit -m 'Generate v147 Sep5 operational ticket ROI'
          git pull --rebase origin main
          git push
