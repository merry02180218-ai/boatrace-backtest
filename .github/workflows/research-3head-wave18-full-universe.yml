name: research-3head-wave18-full-universe
on:
  push:
    branches: ['research/3head-v289-addon-expansion']
    paths:
      - 'research_v289_3head_wave18b_settlement_recovery.py'
      - '.github/workflows/research-3head-wave18-full-universe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wave18b-settlement-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas numpy
      - name: Download frozen canonical v243 audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34383567078 --repo merry02180218-ai/boatrace-backtest --name v243-3head-expand-feature-audit --dir golden_v243
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
      - name: Recover full-universe settlement
        run: python research_v289_3head_wave18b_settlement_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3head-wave18b-settlement-recovery
          path: |
            analysis_v289_3head_wave18b_full_universe_settled.csv
            research_v289_3head_wave18b_settlement_recovery.json
            research_v289_3head_wave18b_settlement_recovery.md
          if-no-files-found: ignore
