name: research-3head-wave20-allrace-universe
on:
  push:
    branches: ['research/3head-v289-addon-expansion']
    paths:
      - 'research_v289_3head_wave20_allrace_universe.py'
      - '.github/workflows/research-3head-wave18-full-universe.yml'
  workflow_dispatch:
jobs:
  wave20:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research_v289_3head_wave20_allrace_universe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3head-wave20-allrace-universe
          path: |
            analysis_v289_3head_wave20_allrace_universe.csv
            research_v289_3head_wave20_allrace_universe.json
            research_v289_3head_wave20_allrace_universe.md
