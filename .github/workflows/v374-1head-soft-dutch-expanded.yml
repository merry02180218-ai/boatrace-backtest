name: v374 1-head soft Dutch expanded
on:
  push:
    paths:
      - 'run_v374_1head_soft_dutch_expanded.py'
      - '.github/workflows/v374-1head-soft-dutch-expanded.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Download v360 prepared artifact
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" > /tmp/v360.zip
          mkdir -p /tmp/v360
          unzip -q /tmp/v360.zip -d /tmp/v360
          test -f /tmp/v360/prepared_rows.pkl
      - name: Run expanded soft-Dutch audit
        run: python run_v374_1head_soft_dutch_expanded.py --prepared /tmp/v360/prepared_rows.pkl
      - name: Show result
        if: always()
        run: |
          cat /tmp/v374-soft-dutch-expanded/result.json 2>/dev/null || true
          cat /tmp/v374-soft-dutch-expanded/bands.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v374-soft-dutch-expanded-${{ github.run_id }}
          path: /tmp/v374-soft-dutch-expanded/
          retention-days: 30
