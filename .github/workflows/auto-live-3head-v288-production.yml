name: auto-live-3head-v288-production
on:
  # Automatic 5-minute production watcher intentionally stopped 2026-09-16.
  # Keep workflow_dispatch so it can still be run manually when explicitly requested.
  workflow_dispatch:
    inputs:
      date:
        description: Optional target date YYYY-MM-DD; blank = today in Asia/Tokyo
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.prep.outputs.ready }}
      target_date: ${{ steps.prep.outputs.target_date }}
      target8: ${{ steps.prep.outputs.target8 }}
      daily_run: ${{ steps.prep.outputs.daily_run }}
      matrix: ${{ steps.prep.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Find today's frozen daily bundle and PRE candidates
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            TARGET_DATE=$(TZ=Asia/Tokyo date +%F)
          fi
          TARGET8=$(date -d "$TARGET_DATE" +%Y%m%d)
          export TARGET8
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "target8=$TARGET8" >> "$GITHUB_OUTPUT"
          if [[ ! "$TARGET8" =~ ^202609[0-9]{2}$ ]]; then
            echo 'ready=0' >> "$GITHUB_OUTPUT"
            echo 'daily_run=' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAILY_RUN=''
          rm -rf daily_artifact
          for RUN in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-3head-v288-production.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            rm -rf daily_artifact
            if gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name daily-3head-v288-production --dir daily_artifact >/dev/null 2>&1; then
              if [ -f "daily_artifact/live_outputs/v288/$TARGET8/daily_manifest.json" ] && [ -f "daily_artifact/live_outputs/v288/$TARGET8/live_cache.joblib" ]; then DAILY_RUN="$RUN"; break; fi
            fi
          done
          if [ -z "$DAILY_RUN" ]; then
            echo 'ready=0' >> "$GITHUB_OUTPUT"; echo 'daily_run=' >> "$GITHUB_OUTPUT"; echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; exit 0
          fi
          MATRIX=$(python - <<'PY'
          import json, os
          from pathlib import Path
          day8=os.environ['TARGET8']; m=json.loads((Path('daily_artifact/live_outputs/v288')/day8/'daily_manifest.json').read_text())
          if m.get('target_date_yyyymmdd') != day8 or not m.get('result_blind_target_day') or m.get('result_or_payout_used'): raise SystemExit('manifest guard failed')
          inc=[]
          for raw in m.get('pre_candidate_race_codes',[]):
              code=str(raw).zfill(12); inc.append({'code':code,'jcd':int(code[8:10]),'race':int(code[10:12])})
          print(json.dumps({'include':inc},separators=(',',':')))
          PY
          )
          echo "daily_run=$DAILY_RUN" >> "$GITHUB_OUTPUT"; echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          [ "$MATRIX" = '{"include":[]}' ] && echo 'ready=0' >> "$GITHUB_OUTPUT" || echo 'ready=1' >> "$GITHUB_OUTPUT"

  live:
    needs: prepare
    if: needs.prepare.outputs.ready == '1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests beautifulsoup4 numpy pandas scikit-learn catboost joblib
      - name: Manual LIVE decision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET8: ${{ needs.prepare.outputs.target8 }}
          DAILY_RUN: ${{ needs.prepare.outputs.daily_run }}
          JCD_IN: ${{ matrix.jcd }}
          RACE_IN: ${{ matrix.race }}
          CODE: ${{ matrix.code }}
        run: |
          gh run download "$DAILY_RUN" --repo "$GITHUB_REPOSITORY" --name daily-3head-v288-production --dir daily_artifact
          DEADLINE=$(python fetch_boatrace_deadline.py --date "$TARGET8" --jcd "$JCD_IN" --race "$RACE_IN" --meta "deadline_$CODE.json")
          python run_3head_v288_production_live.py --date "$TARGET8" --jcd "$JCD_IN" --race "$RACE_IN" --cache "daily_artifact/live_outputs/v288/$TARGET8/live_cache.joblib" --deadline-jst "$DEADLINE" > live_v288_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-v288-manual-${{ matrix.code }}-${{ github.run_id }}
          retention-days: 14
          path: |
            live_v288_result.json
            deadline_${{ matrix.code }}.json
