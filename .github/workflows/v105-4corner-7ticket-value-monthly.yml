name: v105-4corner-7ticket-value-monthly
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v105_4corner_7ticket_value_monthly.py'
      - '.github/workflows/v105-4corner-7ticket-value-monthly.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v105 analysis
        run: python analyze_v105_4corner_7ticket_value_monthly.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v105_4corner_7ticket_value_monthly.csv summary_v105_4corner_7ticket_value_monthly.md
          git diff --cached --quiet || git commit -m "Add v105 4corner 7-ticket monthly results"
          git pull --rebase origin main
          git push
