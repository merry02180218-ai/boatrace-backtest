name: v266-4head-v265-newroi-bridge

on:
  push:
    paths:
      - 'analyze_v266_4head_v265_newroi_bridge.py'
      - 'analysis_v264_4head_feature_exhaustive.csv'
      - '.github/workflows/v266-4head-v265-newroi-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - run: python analyze_v266_4head_v265_newroi_bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: v266-4head-v265-newroi-bridge
          path: |
            analysis_v266_4head_v265_newroi_bridge.csv
            analysis_v266_4head_v265_newroi_detail.csv
            summary_v266_4head_v265_newroi_bridge.md
      - name: Commit v266 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v266_4head_v265_newroi_bridge.csv analysis_v266_4head_v265_newroi_detail.csv summary_v266_4head_v265_newroi_bridge.md
          if git diff --cached --quiet; then
            echo "No v266 output changes to commit"
          else
            git commit -m "Add v266 4-head new-ROI bridge results"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
