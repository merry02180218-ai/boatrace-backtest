name: test-1head-current-day-live-contract

on:
  push:
    paths:
      - 'run_1head_current_day_live_decision.py'
      - 'notify_head1_bet_github_issue.py'
      - '.github/workflows/live-1head-current-day-monitor.yml'
      - '.github/workflows/live-1head-current-day-audit.yml'
      - '.github/workflows/test-1head-current-day-live-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests beautifulsoup4 lxml numpy pandas scipy 'scikit-learn==1.6.1' pyyaml
      - name: Syntax and workflow YAML
        run: |
          python -m py_compile run_1head_current_day_live_decision.py notify_head1_bet_github_issue.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          for p in [
              Path('.github/workflows/live-1head-current-day-monitor.yml'),
              Path('.github/workflows/live-1head-current-day-audit.yml'),
          ]:
              y=yaml.safe_load(p.read_text())
              assert isinstance(y,dict) and 'jobs' in y, p
              print('YAML_OK',p)
          PY
      - name: Promoted lane contract
        run: |
          python - <<'PY'
          import run_1head_current_day_live_decision as m

          ex_standard={'standard_pass':True,'relaxed_pass':False,'feat':{'env_pair':0.0}}
          ex_relaxed={'standard_pass':False,'relaxed_pass':True,'feat':{'env_pair':-0.40}}

          lane,ok,_=m._select_lane({'final_head_p':.80,'opp_mass':.40},ex_standard,.20)
          assert ok and lane=='FORMAL_LIVE',(lane,ok)
          lane,ok,_=m._select_lane({'final_head_p':.785,'opp_mass':.40},ex_standard,.60)
          assert ok and lane=='PLAYER_HISTORY_EXPANSION',(lane,ok)
          lane,ok,_=m._select_lane({'final_head_p':.76,'opp_mass':.40},ex_relaxed,.20)
          assert ok and lane=='HEAD_VOLUME_EXPANSION',(lane,ok)
          bad={'standard_pass':False,'relaxed_pass':True,'feat':{'env_pair':-0.30}}
          lane,ok,_=m._select_lane({'final_head_p':.76,'opp_mass':.40},bad,.20)
          assert not ok and lane=='DROP',(lane,ok)

          tickets=['1-2-3','1-2-4','1-3-2']
          odds={tickets[0]:5.0,tickets[1]:10.0,tickets[2]:20.0}
          stakes=m._dutch(tickets,odds)
          assert sum(stakes)==5000 and all(x>=100 and x%100==0 for x in stakes),stakes
          print('PROMOTED_LANES_AND_DUTCH_OK',stakes)

          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          J=ZoneInfo('Asia/Tokyo')
          now=datetime(2026,9,25,20,0,0,tzinfo=J)
          future=(now+timedelta(seconds=30)).isoformat()
          assert m._require_predeadline(future,now)>29
          try:
              m._require_predeadline((now-timedelta(seconds=1)).isoformat(),now)
              raise AssertionError('expired deadline accepted')
          except RuntimeError:
              pass
          m._require_odds_timestamp_predeadline((now+timedelta(seconds=10)).isoformat(),future)
          try:
              m._require_odds_timestamp_predeadline(future,future)
              raise AssertionError('post-deadline odds accepted')
          except RuntimeError:
              pass
          print('PREDEADLINE_ODDS_GUARD_OK')
          PY
      - name: Existing v351 finalizer bridge contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import run_1head_current_day_live_decision as m
          base={
            'race_code':'202609259912','pre_class':'S','operating_pre_class':'NON_CANDIDATE',
            'legacy_pre_p':.785,'final_head_p':.785,'opp_mass':.50,
            'p2':{str(b):.2 for b in range(2,7)},
            'pc':{f'{s}-{t}':.25 for s in range(2,7) for t in range(2,7) if s!=t},
            'base_tickets':'1-2-3;1-2-4;1-3-2',
            'local_winrate_4':4.0,'local_winrate_5':4.0,'local_edge_5_minus_4':0.0,
            'five_second_topup_cache_ready':True,
            'production_profile':m.prod.PROFILE_NAME,'live_operation_profile':m.prod.LIVE_OPERATION_PROFILE_NAME,
            'training_cutoff':'2026-09-24','result_or_payout_used':False,'chronology_guard':True,
          }
          ex={
            'corrected_ex':{str(b):.5 for b in range(2,7)},
            'corrected_st':{str(b):.5 for b in range(2,7)},
            'corrected_straight':{str(b):.5 for b in range(2,7)},
            'corrected_orig_avg':{str(b):.5 for b in range(2,7)},
            'exhibition_hashes':{},
          }
          z=m._call_existing_finalizer(base,ex,True,'PLAYER_HISTORY_EXPANSION','20:30',Path('/tmp/head1_bridge.json'))
          assert z['status']=='PASS',z
          assert abs(z['final_head_p']-.785)<1e-12,z['final_head_p']
          assert abs(z['head_scoring_bridge_p']-.790)<1e-12,z['head_scoring_bridge_p']
          assert len(z['tickets'])>=3,z['tickets']
          print('EXISTING_V351_FINALIZER_BRIDGE_OK',z['tickets'])
          PY

      - name: BET notification dry-run contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/head1_notify.json <<'JSON'
          {
            "race_code":"202609251911","decision":"BET","deadline_jst":"20:00",
            "head_selection_lane":"FORMAL_LIVE","head_prob":0.80,"opponent_mass":0.40,
            "b1_pl_recent_p2":0.60,"env_pair":-0.40,
            "head_volume_pickup":false,"head_volume_opponent_pickup":false,
            "tickets":["1-2-3","1-2-4","1-3-2"],
            "ticket_odds":{"1-2-3":5.0,"1-2-4":10.0,"1-3-2":20.0},
            "live_stakes_yen":[2900,1400,700],"composite_odds":2.857142857,
            "decision_time_jst":"2026-09-25T19:00:00+09:00","odds_source":"test",
            "target_race_result_used":false,"payout_used":false
          }
          JSON
          python notify_head1_bet_github_issue.py --decision-json /tmp/head1_notify.json --dry-run

      - name: Result/payout source guard
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [
              Path('run_1head_current_day_live_decision.py'),
              Path('notify_head1_bet_github_issue.py'),
              Path('.github/workflows/live-1head-current-day-monitor.yml'),
          ]:
              s=p.read_text()
              for bad in ('data/results/'+'realtime','data/results/'+'payouts'):
                  assert bad not in s,(p,bad)
          print('RESULT_PAYOUT_SOURCE_GUARD_OK')
          PY
