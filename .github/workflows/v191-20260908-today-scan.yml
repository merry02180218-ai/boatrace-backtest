name: v191 Sep8 today PRE scan

on:
  push:
    paths:
      - 'analyze_v191_20260908_today_scan.py'
      - '.github/workflows/v191-20260908-today-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn requests beautifulsoup4
      - name: Run v191 Sep8 scan
        run: python analyze_v191_20260908_today_scan.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prediction_v191_20260908_3head_pre_monitor.csv summary_v191_20260908_today_scan.md
          git diff --cached --quiet || git commit -m "Add v191 Sep8 PRE scan"
          git pull --rebase --autostash origin main
          git push
