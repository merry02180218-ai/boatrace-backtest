name: v244 3-head preselection audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'analyze_v244_3head_preselection_audit.py'
      - '.github/workflows/v244-3head-preselection-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn requests
      - name: Restore cached v243 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10118044294/zip > /tmp/v243.zip
          unzip -o /tmp/v243.zip -d .
          test -s analysis_v243_3head_expand_feature_audit.csv
          test -s analysis_v243_3head_expand_rule_search.csv
      - name: Run v244 PRE-selection audit
        run: python analyze_v244_3head_preselection_audit.py
      - name: Upload v244 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v244-3head-preselection-audit
          path: |
            summary_v244_3head_preselection_audit.md
            analysis_v244_3head_preselection_audit.csv
