name: v244 3-head preselection audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild v243 settlement/feature cache
        run: python analyze_v243_3head_expand_feature_audit.py
      - name: Run v244 PRE-selection audit
        run: python analyze_v244_3head_preselection_audit.py
      - name: Upload v244 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v244-3head-preselection-audit
          path: |
            summary_v244_3head_preselection_audit.md
            analysis_v244_3head_preselection_audit.csv
