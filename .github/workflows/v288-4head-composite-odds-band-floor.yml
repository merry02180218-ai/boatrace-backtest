name: v288 4head composite-odds band floor

on:
  push:
    paths:
      - 'analyze_v288_4head_composite_odds_band_floor.py'
      - '.github/workflows/v288-4head-composite-odds-band-floor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn
      - run: python analyze_v288_4head_composite_odds_band_floor.py
      - uses: actions/upload-artifact@v4
        with:
          name: v288-4head-composite-odds-band-floor
          path: |
            analysis_v288_4head_composite_odds_alln_detail.csv
            analysis_v288_4head_composite_odds_band_cells.csv
            analysis_v288_4head_composite_odds_band_monthly.csv
            analysis_v288_4head_composite_floor_policies.csv
            analysis_v288_4head_composite_floor_monthly.csv
            analysis_v288_4head_composite_floor_detail.csv
            analysis_v288_4head_fixed4_verify.csv
            summary_v288_4head_composite_odds_band_floor.md
      - name: Commit v288 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v288_4head_composite_odds_alln_detail.csv analysis_v288_4head_composite_odds_band_cells.csv analysis_v288_4head_composite_odds_band_monthly.csv analysis_v288_4head_composite_floor_policies.csv analysis_v288_4head_composite_floor_monthly.csv analysis_v288_4head_composite_floor_detail.csv analysis_v288_4head_fixed4_verify.csv summary_v288_4head_composite_odds_band_floor.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add v288 composite-odds band and floor results'
          git pull --rebase origin main
          git push origin HEAD:main
