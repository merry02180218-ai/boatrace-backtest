name: verify-v288-3head-100r-replay-v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'verify_v288_3head_100r_replay_v2.py'
      - '.github/workflows/verify-v288-3head-100r-replay-v2.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas
      - name: Download frozen canonical v243 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34383567078 --repo merry02180218-ai/boatrace-backtest --name v243-3head-expand-feature-audit --dir golden_v243
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
      - name: Replay corrected official v288 semantics
        run: python verify_v288_3head_100r_replay_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: verify-v288-3head-100r-replay-v2
          path: verify_v288_3head_100r_replay_v2.json
