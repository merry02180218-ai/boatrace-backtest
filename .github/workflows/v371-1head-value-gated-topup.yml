name: v371 1-head value-gated topup
on:
  push:
    paths:
      - 'run_v371_1head_value_gated_topup.py'
      - '.github/workflows/v371-1head-value-gated-topup.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas
      - name: Download v370 artifact
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10560443188/zip" > /tmp/v370.zip
          mkdir -p /tmp/v370
          unzip -q /tmp/v370.zip -d /tmp/v370
          test -f /tmp/v370/formal_with_closing_odds.csv
      - name: Run value-gated top-up audit
        run: python run_v371_1head_value_gated_topup.py --features /tmp/v370/formal_with_closing_odds.csv
      - name: Show result
        if: always()
        run: |
          cat /tmp/v371-value-gated-topup/result.json 2>/dev/null || true
          cat /tmp/v371-value-gated-topup/monthly.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v371-value-gated-topup-${{ github.run_id }}
          path: /tmp/v371-value-gated-topup/
          retention-days: 30
