name: v102-allmodels-final-composite-odds
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v102_allmodels_final_composite_odds.py'
      - '.github/workflows/v102-allmodels-final-composite-odds.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v102 final-odds analysis
        run: python analyze_v102_allmodels_final_composite_odds.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v102_allmodels_final_composite_odds.csv summary_v102_allmodels_final_composite_odds.md coverage_v102_final_odds.csv
          git diff --cached --quiet || git commit -m "Add v102 all-model final composite odds results"
          git pull --rebase origin main
          git push
