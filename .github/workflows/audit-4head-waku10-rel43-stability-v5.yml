name: audit-4head-waku10-rel43-stability-v5

'on':
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scikit-learn
      - name: Preflight
        run: |
          python -m py_compile prepare_4head_6m_v93_neutral_waku.py audit_4head_waku10_rel43_stability_v5.py
          ! grep -q 'data/results' audit_4head_waku10_rel43_stability_v5.py
          grep -q '"REL43_WR_ST":.36' audit_4head_waku10_rel43_stability_v5.py
          grep -q '"OWN4_WR_SR_PLUS_REL43_WR_SR":.37' audit_4head_waku10_rel43_stability_v5.py
          grep -q 'SEPTEMBER_OUTCOMES_READ.*False' audit_4head_waku10_rel43_stability_v5.py
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: boatracecsv
      - name: Build complete Waku10 parent
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/boatracecsv
        run: python prepare_4head_6m_v93_neutral_waku.py
      - name: Audit frozen candidates
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/boatracecsv
        run: python audit_4head_waku10_rel43_stability_v5.py
      - uses: actions/upload-artifact@v4
        with:
          name: head4-waku10-rel43-stability-v5
          path: /tmp/head4_waku10_rel43_stability_v5
