name: v125-1head-v110-pair-miss
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v125_1head_v110_pair_miss.py'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v125
        run: python analyze_v125_1head_v110_pair_miss.py
      - name: Commit v125 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v125_1head_v110_pair_miss.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate v125 v110 pair miss diagnostics"
            git pull --rebase origin main
            git push
          fi
