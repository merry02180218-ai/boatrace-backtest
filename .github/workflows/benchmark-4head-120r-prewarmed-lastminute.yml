name: benchmark-4head-120r-prewarmed-lastminute

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/benchmark-4head-120r-prewarmed-lastminute.txt'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy requests beautifulsoup4 lxml
      - name: Download PRE artifact
        uses: actions/download-artifact@v4
        with:
          name: head4-120r-pre-live-trial-20260918
          path: preseed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35317588703
      - name: Download daily-state artifact
        uses: actions/download-artifact@v4
        with:
          name: head4-120r-live-deadline-benchmark
          path: stateseed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35326011735
      - name: Locate inputs
        run: |
          CARD="$(find preseed -type f -path '*/current_input/v291/20260918/race_cards.csv' | head -1)"
          WAKU="$(find preseed -type f -path '*/current_input/v291/20260918/waku10.csv' | head -1)"
          PRE="$(find preseed -type f -path '*/live_outputs/head4_120r_pre/20260918/pre_all.csv' | head -1)"
          STATE="$(find stateseed -type f -name 'head4_daily_state.json' | head -1)"
          test -n "$CARD" && test -n "$WAKU" && test -n "$PRE" && test -n "$STATE"
          echo "CARD=$CARD" >> "$GITHUB_ENV"
          echo "WAKU=$WAKU" >> "$GITHUB_ENV"
          echo "PRE=$PRE" >> "$GITHUB_ENV"
          echo "STATE=$STATE" >> "$GITHUB_ENV"
      - name: Actual predeadline fast path Marugame 7R
        run: |
          /usr/bin/time -f 'FAST120_WALL_SECONDS=%e' python run_4head_120r_lastminute_fast.py             --date 20260918 --jcd 15 --race 7 --deadline-jst 18:02             --race-cards "$CARD" --waku10 "$WAKU" --pre-all "$PRE"             --daily-state "$STATE"             --allow-unmonitored-benchmark --out /tmp/fast120_marugame7.json 2>&1 | tee /tmp/fast120.log
          grep -Eq 'HEAD4_120R_FAST_LASTMINUTE_OK|HEAD4_120R_FAST_NO_BET_DATA_NOT_READY' /tmp/fast120.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-120r-prewarmed-lastminute-benchmark
          path: |
            /tmp/fast120_marugame7.json
            /tmp/fast120.log
