name: v117 2026-09-08 1-head official pre scan

on:
  push:
    paths:
      - 'predict_v117_20260908_1head_official_pre.py'
      - '.github/workflows/v117-20260908-1head-official-pre.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn requests beautifulsoup4
      - name: Run official PRE scan
        run: python predict_v117_20260908_1head_official_pre.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prediction_v117_20260908_1head_official_pre.csv summary_v117_20260908_1head_official_pre.md
          git diff --cached --quiet && exit 0
          git commit -m "Run 2026-09-08 official 1-head pre scan"
          git pull --rebase --autostash origin main
          git push
