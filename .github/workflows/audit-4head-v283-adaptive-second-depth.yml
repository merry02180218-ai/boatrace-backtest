name: Audit 4head v283 adaptive SECOND depth

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy scikit-learn lightgbm joblib
      - name: Run adaptive SECOND-depth audit
        run: python audit_4head_v283_adaptive_second_depth.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head4-v283-adaptive-second-depth
          path: /tmp/head4_v283_adaptive_second_depth/
