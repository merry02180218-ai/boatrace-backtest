name: v213 3head Top6 variable longhistory newROI
on:
  push:
    paths:
      - 'analyze_v213_3head_top6_variable_longhistory_newroi.py'
      - '.github/workflows/v213-3head-top6-variable-longhistory-newroi.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - run: python analyze_v213_3head_top6_variable_longhistory_newroi.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v213_3head_top6_variable_longhistory_newroi.csv summary_v213_3head_top6_variable_longhistory_newroi.md
          git diff --cached --quiet || git commit -m 'Add v213 long-history new-ROI results'
          git push
