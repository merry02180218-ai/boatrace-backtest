name: audit-4head-newfeature-volume-extension

on:
  workflow_dispatch:
  push:
    paths:
      - 'audit_4head_newfeature_volume_extension.py'
      - '.github/workflows/audit-4head-newfeature-volume-extension.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas
      - name: Download expanded feature table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p seed
          gh run download 35361685459 -n head4-208-expanded-features -D seed
          F="$(find seed -type f -name 'expanded_features_208.csv' | head -1)"
          test -n "$F"
          echo "EXPANDED_FEATURES_208=$F" >> "$GITHUB_ENV"
      - run: python audit_4head_newfeature_volume_extension.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head4-newfeature-volume-extension
          path: /tmp/head4_newfeature_volume_extension/
          retention-days: 30
