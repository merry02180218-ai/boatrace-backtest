name: v151 fix strict agreement settlement

on:
  push:
    paths:
      - 'analyze_v151_fix_strict_agreement_settlement.py'
      - '.github/workflows/v151-fix-strict-agreement-settlement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v151 settlement fix
        run: python analyze_v151_fix_strict_agreement_settlement.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v151_fix_strict_agreement_settlement.csv summary_v151_fix_strict_agreement_settlement.md
          git diff --cached --quiet || git commit -m 'Add v151 settlement fix results'
          git push
