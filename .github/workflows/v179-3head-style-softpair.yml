name: v179 3head style softpair

on:
  push:
    paths:
      - 'analyze_v179_3head_style_softpair.py'
      - '.github/workflows/v179-3head-style-softpair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn
      - name: Run v179
        run: python analyze_v179_3head_style_softpair.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v179_3head_style_softpair.csv summary_v179_3head_style_softpair.md
          git diff --cached --quiet || git commit -m "Add v179 style soft-pair OOS results"
          git push
