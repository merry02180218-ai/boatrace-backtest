name: v38-relative-wind
on:
  push:
    paths:
      - 'analyze_v38_relative_wind.py'
      - '.github/workflows/v38-relative-wind.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python analyze_v38_relative_wind.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v38_relative_wind.md analysis_v38_relative_wind.csv
          git diff --cached --quiet || git commit -m "Add v38 relative wind results"
          git push
