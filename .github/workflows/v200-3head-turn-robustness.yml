name: v200 3head turn robustness
on:
  push:
    paths:
      - 'analyze_v200_3head_turn_robustness.py'
      - '.github/workflows/v200-3head-turn-robustness.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas
      - run: python analyze_v200_3head_turn_robustness.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add summary_v200_3head_turn_robustness.md
          git diff --cached --quiet || git commit -m 'Add v200 3-head turn robustness results'
          git pull --rebase
          git push
