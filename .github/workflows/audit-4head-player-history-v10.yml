name: audit-4head-player-history-v10

'on':
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scikit-learn
      - name: Preflight
        run: |
          python -m py_compile prepare_4head_6m_v93_neutral_waku.py audit_4head_player_history_v10.py
          grep -q 'Compare BEFORE reading this date' audit_4head_player_history_v10.py
          grep -q 'SEPTEMBER_OUTCOMES_READ.*False' audit_4head_player_history_v10.py
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: boatracecsv
      - name: Build parent
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/boatracecsv
        run: python prepare_4head_6m_v93_neutral_waku.py
      - name: Independent player-history audit
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/boatracecsv
        run: python audit_4head_player_history_v10.py
      - uses: actions/upload-artifact@v4
        with:
          name: head4-player-history-v10
          path: /tmp/head4_player_history_audit_v10
