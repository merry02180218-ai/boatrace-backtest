name: v71-boatrace-ai-fetch
on:
  workflow_dispatch:
  push:
    paths:
      - 'probe_v71_boatrace_ai_fetch.py'
      - '.github/workflows/v71-boatrace-ai-fetch.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python probe_v71_boatrace_ai_fetch.py
