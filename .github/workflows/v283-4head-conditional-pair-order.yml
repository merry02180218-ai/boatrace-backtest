name: v283 4head conditional pair order

on:
  push:
    paths:
      - 'analyze_v283_4head_conditional_pair_order.py'
      - '.github/workflows/v283-4head-conditional-pair-order.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn
      - run: python analyze_v283_4head_conditional_pair_order.py
      - uses: actions/upload-artifact@v4
        with:
          name: v283-pair-order
          path: |
            analysis_v283_4head_conditional_pair_order.csv
            analysis_v283_4head_conditional_pair_order_grid.csv
            analysis_v283_4head_conditional_pair_order_monthly.csv
            summary_v283_4head_conditional_pair_order.md
      - name: Commit v283 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v283_4head_conditional_pair_order.csv analysis_v283_4head_conditional_pair_order_grid.csv analysis_v283_4head_conditional_pair_order_monthly.csv summary_v283_4head_conditional_pair_order.md
          git diff --cached --quiet || git commit -m 'Add v283 conditional pair-order results'
          git pull --rebase origin main
          git push origin HEAD:main
