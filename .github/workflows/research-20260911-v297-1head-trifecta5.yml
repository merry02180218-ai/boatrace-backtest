name: research v297 1head guard trifecta5
on:
  workflow_dispatch:
  push:
    paths:
      - analyze_v297_1head_guard_trifecta5_research.py
      - .github/workflows/research-20260911-v297-1head-trifecta5.yml
permissions:
  contents: write
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn
      - name: Run v297 clean head guard and trifecta5 research
        run: python analyze_v297_1head_guard_trifecta5_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v297-1head-guard-trifecta5
          path: |
            analysis_v297_1head_guard_trifecta5_folds.csv
            analysis_v297_1head_guard_trifecta5_monthly.csv
            analysis_v297_1head_guard_trifecta5_pooled.csv
            analysis_v297_1head_guard_trifecta5_kpoints.csv
            analysis_v297_1head_guard_trifecta5_predictions.csv
            summary_v297_1head_guard_trifecta5.md
          if-no-files-found: ignore
      - name: Commit compact outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add analysis_v297_1head_guard_trifecta5_folds.csv \
                  analysis_v297_1head_guard_trifecta5_monthly.csv \
                  analysis_v297_1head_guard_trifecta5_pooled.csv \
                  analysis_v297_1head_guard_trifecta5_kpoints.csv \
                  summary_v297_1head_guard_trifecta5.md
          if ! git diff --cached --quiet; then
            git commit -m "results: v297 clean 1-head guard + trifecta5"
            git pull --rebase origin main
            git push
          fi
