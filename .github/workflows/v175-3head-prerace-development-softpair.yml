name: v175 3head prerace development softpair
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v175_3head_prerace_development_softpair.py'
      - '.github/workflows/v175-3head-prerace-development-softpair.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn
      - name: Run v175
        run: python analyze_v175_3head_prerace_development_softpair.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v175_3head_prerace_development_softpair.csv summary_v175_3head_prerace_development_softpair.md
          git diff --cached --quiet || git commit -m "Add v175 prerace-development softpair results"
          git push
