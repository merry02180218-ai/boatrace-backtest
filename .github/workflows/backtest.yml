name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install v351 audit dependencies
        run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4
      - name: Rebuild v351 schema dataset
        run: python audit_v351_schema_correct_rebuild.py | tee schema_rebuild.txt
      - name: Run v351 dedicated schema HEAD OOF
        run: python audit_v351_dedicated_schema_head.py | tee dedicated_schema_head.txt
      - name: Decompose v351 exact3 errors
        run: python analyze_v351_schema_exact3_errors.py | tee schema_exact3_errors.txt
      - name: Research v351 opponent pair temporal OOF
        run: python research_v351_opponent_pair_oof.py | tee opponent_pair_oof.txt
      - name: Decompose current G2 G3 pair corrections
        run: python analyze_v351_g2g3_pair_correction_wave3.py | tee g2g3_pair_wave3.txt
      - name: Research v351 one-replacement Wave4 frozen June
        run: python research_v351_one_replace_wave4.py | tee one_replace_wave4.txt
      - name: Analyze Wave5 rescue vs damage
        run: python analyze_v351_one_replace_wave5.py | tee one_replace_wave5.txt
      - name: Analyze Wave6 venue effect
        run: python analyze_v351_one_replace_wave6_venue.py | tee one_replace_wave6.txt
      - name: Analyze Wave7 Kiryu boat2 effect
        run: python analyze_v351_kiryu_boat2_wave7.py | tee kiryu_boat2_wave7.txt
      - name: Analyze Wave8 Kiryu boat2 keep drop features
        run: python analyze_v351_kiryu_boat2_wave8.py | tee kiryu_boat2_wave8.txt
      - name: Analyze Wave9 Kiryu boat2 LOO guard
        run: python analyze_v351_kiryu_boat2_wave9_loo.py | tee kiryu_boat2_wave9.txt
      - name: Rebuild v321 historical cache for opponent mass audit
        run: python run_v321_1head_julaug_nonpristine_validation.py --stage prepare | tee opponent_mass_v321_prepare.txt
      - name: Audit opponent mass threshold
        run: python audit_v351_opponent_mass_threshold.py | tee opponent_mass_threshold.txt
      - name: Analyze Wave10 low-mass rescue band
        run: python analyze_v351_mass_rescue_wave10.py | tee mass_rescue_wave10.txt
      - name: Analyze Wave11 one-opponent rescue oracle
        run: python analyze_v351_mass_rescue_wave11_one_replace.py | tee mass_rescue_wave11.txt
      - name: Research Wave12 frozen low-mass one-replace guard
        run: python research_v351_mass_rescue_wave12_frozen_guard.py | tee mass_rescue_wave12.txt
      - name: Analyze Wave13 keep versus drop decomposition
        run: python analyze_v351_mass_rescue_wave13_keepdrop.py | tee mass_rescue_wave13.txt
      - uses: actions/upload-artifact@v4
        with:
          name: audit-v351-exact3-via-monthly
          path: |
            analysis_v351_schema_correct_rebuild.csv
            analysis_v351_schema_map.csv
            analysis_v351_dedicated_*.csv
            analysis_v351_schema_exact3_errors.csv
            analysis_v351_schema_exact3_error_summary.csv
            analysis_v351_opponent_boat_oof.csv
            analysis_v351_opponent_pair_oof.csv
            analysis_v351_opponent_pair_summary.csv
            analysis_v351_g2g3_pair_correction_wave3.csv
            analysis_v351_g2g3_pair_correction_wave3_summary.csv
            analysis_v351_one_replace_wave4_june.csv
            analysis_v351_one_replace_wave4_summary.csv
            analysis_v351_one_replace_wave5_cases.csv
            analysis_v351_one_replace_wave5_guard_summary.csv
            analysis_v351_one_replace_wave6_venue_summary.csv
            analysis_v351_one_replace_wave6_lts_venue_summary.csv
            analysis_v351_one_replace_wave6_focus.csv
            analysis_v351_kiryu_boat2_wave7.csv
            analysis_v351_kiryu_boat2_wave8.csv
            analysis_v351_kiryu_boat2_wave8_summary.csv
            analysis_v351_kiryu_boat2_wave9_loo.csv
            analysis_v351_kiryu_boat2_wave9_loo_summary.csv
            analysis_v351_opponent_mass_threshold_rows.csv
            analysis_v351_opponent_mass_threshold_summary.csv
            analysis_v351_opponent_mass_bands.csv
            analysis_v351_mass_rescue_wave10_rows.csv
            analysis_v351_mass_rescue_wave10_summary.csv
            analysis_v351_mass_rescue_wave10_bins.csv
            analysis_v351_mass_rescue_wave11_one_replace_rows.csv
            analysis_v351_mass_rescue_wave11_one_replace_summary.csv
            analysis_v351_mass_rescue_wave11_keepability.csv
            analysis_v351_mass_rescue_wave12_june.csv
            analysis_v351_mass_rescue_wave12_may_thresholds.csv
            analysis_v351_mass_rescue_wave12_summary.csv
            analysis_v351_mass_rescue_wave13_keepdrop_rows.csv
            analysis_v351_mass_rescue_wave13_feature_summary.csv
            analysis_v351_mass_rescue_wave13_position_summary.csv
            analysis_v351_mass_rescue_wave13_boat_summary.csv
            analysis_v351_mass_rescue_wave13_schema_position.csv
            schema_rebuild.txt
            dedicated_schema_head.txt
            schema_exact3_errors.txt
            opponent_pair_oof.txt
            g2g3_pair_wave3.txt
            one_replace_wave4.txt
            one_replace_wave5.txt
            one_replace_wave6.txt
            kiryu_boat2_wave7.txt
            kiryu_boat2_wave8.txt
            kiryu_boat2_wave9.txt
            opponent_mass_v321_prepare.txt
            opponent_mass_threshold.txt
            mass_rescue_wave10.txt
            mass_rescue_wave11.txt
            mass_rescue_wave12.txt
            mass_rescue_wave13.txt
