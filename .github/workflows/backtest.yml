name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v5 one-month EV backtest
        run: python backtest_v5_ev.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v5.md bets_v5.csv races_v5.csv
          if ! git diff --cached --quiet; then
            git commit -m "Run v5 one-month trifecta EV backtest"
            git push
          fi
