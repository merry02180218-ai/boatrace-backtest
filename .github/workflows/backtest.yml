name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v11 3-boat pair model
        run: python backtest_v11_3pair.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v11_3pair.md bets_v11_3pair.csv races_v11_3pair.csv
          if ! git diff --cached --quiet; then
            git commit -m "Run v11 3-boat pair model backtest"
            git push
          fi
