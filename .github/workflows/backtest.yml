name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v6 composite odds backtest
        run: python backtest_v6_composite.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v6.md bets_v6.csv races_v6.csv
          if ! git diff --cached --quiet; then
            git commit -m "Run v6 composite odds 5x backtest"
            git push
          fi
