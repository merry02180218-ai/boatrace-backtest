name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v13 selective 3-boat model
        run: python backtest_v13_selective3.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v13.md
          [ -f bets_v13.csv ] && git add bets_v13.csv || true
          [ -f races_v13.csv ] && git add races_v13.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Run v13 selective 3-boat backtest"
            git push
          fi
