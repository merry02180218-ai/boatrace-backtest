name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v14b fixed two-stage opponent model
        run: python backtest_v14b_3opponent_fixed.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v14b.md
          [ -f bets_v14b.csv ] && git add bets_v14b.csv || true
          [ -f races_v14b.csv ] && git add races_v14b.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Run v14b fixed opponent backtest"
            git push
          fi
