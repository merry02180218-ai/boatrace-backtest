name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v15 ROI strategy comparison
        run: python backtest_v15_roi_strategies.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v15_strategies.md
          [ -f races_v15_strategies.csv ] && git add races_v15_strategies.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Run v15 ROI strategy comparison"
            git push
          fi
