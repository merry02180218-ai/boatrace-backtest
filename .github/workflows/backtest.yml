name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze 3-boat attack model
        run: python analyze_score3_thresholds.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_score3.md
          if ! git diff --cached --quiet; then
            git commit -m "Analyze 3-boat makuri model thresholds"
            git push
          fi
