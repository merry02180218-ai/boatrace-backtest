name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v9 hit-rate calibrated backtest
        run: python backtest_v9_hit20.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v9.md bets_v9.csv races_v9.csv
          if ! git diff --cached --quiet; then
            git commit -m "Run v9 20 percent hit-rate calibrated backtest"
            git push
          fi
