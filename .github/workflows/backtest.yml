name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze 3-boat attack correlations
        run: python analyze_3attack_feature_correlations.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_3attack_correlations.md
          [ -f analysis_3attack_rows.csv ] && git add analysis_3attack_rows.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Analyze 3-boat attack feature correlations"
            git push
          fi
