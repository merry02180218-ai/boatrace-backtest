name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact 9/2 odds
        run: python extract_odds_0902.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds_0902.md
          if ! git diff --cached --quiet; then
            git commit -m "Extract exact 9/2 odds"
            git push
          fi
