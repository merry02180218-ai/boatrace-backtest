name: monthly-backtest
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v10 integrated 3/4/5 backtest
        run: python backtest_v10_345_hit20.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v10.md
          [ -f bets_v10.csv ] && git add bets_v10.csv || true
          [ -f races_v10.csv ] && git add races_v10.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Run v10 integrated 3 4 5 hit-rate backtest"
            git push
          fi
