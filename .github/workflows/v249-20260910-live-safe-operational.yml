name: v249 2026-09-10 live-safe operational

on:
  push:
    paths:
      - 'predict_v249_20260910_live_safe_operational.py'
      - '.github/workflows/v249-20260910-live-safe-operational.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas numpy
      - name: Run classifier
        run: python predict_v249_20260910_live_safe_operational.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pred_v249_20260910_live_safe_operational.csv prediction_v249_20260910_live_safe_operational.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add 2026-09-10 v249 live-safe operational results'
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
