name: replay-sep1-11-3head-v288-production
on:
  push:
    paths:
      - '.github/workflows/replay-sep1-11-3head-v288-production.yml'
      - 'prepare_v288_historical_pre_input.py'
      - 'replay_v288_historical_day.py'

jobs:
  replay-day:
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        include:
          - {date: '2026-09-01', day8: '20260901'}
          - {date: '2026-09-02', day8: '20260902'}
          - {date: '2026-09-03', day8: '20260903'}
          - {date: '2026-09-04', day8: '20260904'}
          - {date: '2026-09-05', day8: '20260905'}
          - {date: '2026-09-06', day8: '20260906'}
          - {date: '2026-09-07', day8: '20260907'}
          - {date: '2026-09-08', day8: '20260908'}
          - {date: '2026-09-09', day8: '20260909'}
          - {date: '2026-09-10', day8: '20260910'}
          - {date: '2026-09-11', day8: '20260911'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scikit-learn catboost requests beautifulsoup4 joblib
      - name: Download frozen canonical September artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34383567078 --repo merry02180218-ai/boatrace-backtest --name v243-3head-expand-feature-audit --dir golden_v243
          cp golden_v243/analysis_v243_3head_expand_feature_audit.csv .
          gh run download 34326743303 --repo merry02180218-ai/boatrace-backtest --name v234-3head-waku10-restored-replay --dir golden_v234
          cp golden_v234/analysis_v234_waku10_reconstruction_coverage.csv .
          mkdir -p data/audit
          cp -r golden_v234/data/audit/v234_waku10 data/audit/
      - name: Build archived PRE input without outcomes
        run: python prepare_v288_historical_pre_input.py --date '${{ matrix.date }}'
      - name: Build exact frozen production PRE/cache
        run: python build_3head_v288_daily_live.py --date '${{ matrix.date }}'
      - name: Replay archived LIVE then settle after decision freeze
        run: python replay_v288_historical_day.py --date '${{ matrix.date }}' --cache 'live_outputs/v288/${{ matrix.day8 }}/live_cache.joblib' --outdir 'replay_outputs/${{ matrix.day8 }}'
      - name: Copy audit manifests
        run: |
          cp 'current_input/v288/${{ matrix.day8 }}/historical_input_manifest.json' 'replay_outputs/${{ matrix.day8 }}/input_manifest.json'
          cp 'live_outputs/v288/${{ matrix.day8 }}/daily_manifest.json' 'replay_outputs/${{ matrix.day8 }}/production_manifest.json'
          cp 'live_outputs/v288/${{ matrix.day8 }}/pre_scan.csv' 'replay_outputs/${{ matrix.day8 }}/pre_scan.csv'
      - uses: actions/upload-artifact@v4
        with:
          name: v288-sep-replay-${{ matrix.day8 }}
          retention-days: 14
          path: replay_outputs/

  aggregate:
    needs: replay-day
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: v288-sep-replay-*
          path: replay_all
          merge-multiple: true
      - name: Aggregate frozen decisions and settlement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('replay_all'); frames=[]; sums=[]; manifests=[]
          for p in sorted(root.rglob('day_summary.json')):
              sums.append(json.loads(p.read_text(encoding='utf-8')))
          for p in sorted(root.rglob('input_manifest.json')):
              manifests.append(json.loads(p.read_text(encoding='utf-8')))
          for p in sorted(root.rglob('day_replay.csv')):
              try:
                  q=pd.read_csv(p,dtype={'race_code':str})
                  if len(q):frames.append(q)
              except pd.errors.EmptyDataError:pass
          q=pd.concat(frames,ignore_index=True,sort=False) if frames else pd.DataFrame()
          if len(q):q.to_csv('analysis_v288_sep1_11_production_replay.csv',index=False)
          else:Path('analysis_v288_sep1_11_production_replay.csv').write_text('',encoding='utf-8')
          bets=q[q.decision.eq('BET')].copy() if len(q) else pd.DataFrame()
          B=len(bets);H=int(bets.hit.sum()) if B else 0;stake=float(bets.total_stake.sum()) if B else 0.;ret=float(bets.return_yen.sum()) if B else 0.
          candidates=sum(int(x.get('pre_candidates',0)) for x in sums)
          coverage={x['target_date']:{'cards':x['race_cards_seen'],'complete':x['complete_rows'],'fallback':len(x['boatcast_fallback_recovered']),'excluded':len(x['excluded_missing_waku'])} for x in manifests}
          summary={'period':'2026-09-01..2026-09-11','policy':'3HEAD_V288_PRODUCTION_RETROSPECTIVE_REPLAY','history_cutoff':'2026-08-31',
             'pre_candidates':candidates,'bets':B,'hits':H,'hit_rate_pct':100*H/B if B else None,'stake':stake,'payout':ret,'profit':ret-stake,'roi_pct':100*ret/stake if stake else None,
             'result_or_payout_used_for_decision':False,'results_joined_only_after_freeze':True,'coverage':coverage}
          Path('summary_v288_sep1_11_production_replay.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          L=['# v288 retrospective production-rule replay: 2026-09-01..2026-09-11','',
             '- Model/history/operational PRE thresholds frozen through 2026-08-31.',
             '- Each day uses production daily PRE/cache semantics.',
             '- Archived exhibition + archived od3 odds are read for the LIVE decision; all decisions/tickets are frozen before result/payout files are read.',
             '- This is retrospective policy replay, not a claim that every race was actually executed live.',
             f'- PRE candidates: {candidates}',f'- BET: {B}',f'- Hits: {H}',f'- Hit rate: {100*H/B:.2f}%' if B else '- Hit rate: -',
             f'- Stake: {stake:.0f}',f'- Payout: {ret:.0f}',f'- Profit: {ret-stake:+.0f}',f'- ROI: {100*ret/stake:.2f}%' if stake else '- ROI: -','',
             '## Route breakdown','|route|bets|hits|hit rate|stake|payout|profit|ROI|','|---|---:|---:|---:|---:|---:|---:|---:|']
          if B:
              for route,g in bets.groupby('route',sort=True):
                  n=len(g);h=int(g.hit.sum());s=float(g.total_stake.sum());r=float(g.return_yen.sum())
                  L.append(f'|{route}|{n}|{h}|{100*h/n:.2f}%|{s:.0f}|{r:.0f}|{r-s:+.0f}|{100*r/s:.2f}%|')
          L += ['','## Daily','|date|PRE candidates|bets|hits|hit rate|stake|payout|profit|ROI|','|---|---:|---:|---:|---:|---:|---:|---:|---:|']
          bysum={x['date']:x for x in sums}
          for day in sorted(bysum):
              x=bysum[day];b=int(x['bets']);h=int(x['hits']);s=float(x['stake']);r=float(x['payout'])
              L.append(f"|{day}|{int(x['pre_candidates'])}|{b}|{h}|{100*h/b:.2f}%"+(f'|{s:.0f}|{r:.0f}|{r-s:+.0f}|{100*r/s:.2f}%|' if s else '|0|0|0|-|'))
          L += ['','## Input coverage','|date|race cards|complete PRE inputs|BOATCAST fallback|excluded|','|---|---:|---:|---:|---:|']
          for day,x in sorted(coverage.items()):L.append(f"|{day}|{x['cards']}|{x['complete']}|{x['fallback']}|{x['excluded']}|")
          Path('summary_v288_sep1_11_production_replay.md').write_text('\n'.join(L)+'\n',encoding='utf-8')
          print('\n'.join(L));print('V288_SEP1_11_REPLAY_OK',json.dumps(summary,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v288-sep1-11-production-replay
          retention-days: 30
          path: |
            analysis_v288_sep1_11_production_replay.csv
            summary_v288_sep1_11_production_replay.json
            summary_v288_sep1_11_production_replay.md
