name: verify-3head-a-march-parity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'verify_3head_a_march_parity.py'
      - 'threehead_head_gate_a_adopted.py'
      - '.github/workflows/verify-3head-a-march-parity.yml'
permissions:
  contents: read
  actions: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - name: Download frozen Wave21 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10317157868/zip > /tmp/wave21.zip
          unzip -oq /tmp/wave21.zip -d /tmp/wave21
          SRC=$(find /tmp/wave21 -type f -name 'analysis_v289_3head_wave21_allrace_feature_settled.csv' | head -1)
          test -n "$SRC"
          cp "$SRC" analysis_v289_3head_wave21_allrace_feature_settled.csv
          test -s analysis_v289_3head_wave21_allrace_feature_settled.csv
      - name: Verify March parity
        run: python verify_3head_a_march_parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-3head-a-march-parity
          path: verify_3head_a_march_parity_result.json
          if-no-files-found: ignore
