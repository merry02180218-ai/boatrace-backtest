name: v329 1-head multistage exhibition

# retrigger 2026-09-14 after workflow existed without a confirmed Actions run
on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v329_1head_multistage_exhibition.py'
      - '.github/workflows/v329-1head-multistage-exhibition.yml'

jobs:
  v329:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy scikit-learn
      - name: Run v329 multistage exhibition judgement
        run: python run_v329_1head_multistage_exhibition.py
      - name: Show summary
        if: always()
        run: cat /tmp/v329/summary_v329.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v329-1head-multistage-exhibition
          path: /tmp/v329/
          if-no-files-found: warn
