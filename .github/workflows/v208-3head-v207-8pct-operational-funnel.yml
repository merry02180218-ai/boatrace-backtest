name: v208 v207 8pct operational funnel
on:
  push:
    paths:
      - 'analyze_v208_3head_v207_8pct_operational_funnel.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn requests beautifulsoup4
      - run: python analyze_v208_3head_v207_8pct_operational_funnel.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_v208_3head_v207_8pct_operational_funnel.csv summary_v208_3head_v207_8pct_operational_funnel.md
          git diff --cached --quiet || git commit -m 'Add v208 operational funnel results'
          git push
