name: validate-4head-v291-varn-live
on:
  push:
    paths:
      - 'run_4head_v291_varn_live.py'
      - 'verify_4head_v291_varn_live.py'
      - 'head4_v273_a_live_inference.py'
      - 'run_20260911_4head_v291_live.py'
      - '.github/workflows/validate-4head-v291-varn-live.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Syntax check
        run: python -m py_compile run_4head_v291_varn_live.py verify_4head_v291_varn_live.py
      - name: Verify frozen S/A + v291 entry + variable-N economics
        run: python verify_4head_v291_varn_live.py
      - name: Guard result-blind LIVE code
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('run_4head_v291_varn_live.py')
          src=p.read_text(encoding='utf-8')
          tree=ast.parse(src)
          bad=[]
          for n in ast.walk(tree):
              if isinstance(n, ast.Constant) and isinstance(n.value,str):
                  s=n.value.lower()
                  if any(x in s for x in ('/result','/pay','result?','pay?')):
                      # Allow documentation/audit strings, but reject URL-like runtime strings.
                      if s.startswith('http://') or s.startswith('https://') or 'boatrace.jp/' in s:
                          bad.append((getattr(n,'lineno',None),n.value))
          if bad:
              raise SystemExit(f'forbidden result/payout runtime endpoint strings: {bad}')
          print('RESULT_BLIND_ENDPOINT_GUARD_OK')
          PY
          if grep -nE '\.fit\(' run_4head_v291_varn_live.py; then exit 1; fi
