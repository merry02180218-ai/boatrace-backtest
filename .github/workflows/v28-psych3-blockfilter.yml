name: v28-psych3-blockfilter
on:
  push:
    paths:
      - 'backtest_v28_psych3_blockfilter_month.py'
      - '.github/workflows/v28-psych3-blockfilter.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python backtest_v28_psych3_blockfilter_month.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v28_psych3_month.md races_v28_psych3_month.csv bets_v28_psych3_month.csv
          git commit -m "Run v28 psychology block-filter backtest" || exit 0
          git push
