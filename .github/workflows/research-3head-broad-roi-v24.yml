name: research-3head-broad-roi-v24
on:
  push:
    paths: [research/run_3head_broad_roi_v24.fire]
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy pandas scikit-learn requests
      - name: Download CORE107
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p core107 union53
          gh run download 35892602362 --repo ${{ github.repository }} --name research-3head-newcore-fast-v20 --dir core107
          gh run download 35960039375 --repo ${{ github.repository }} --name audit-3head-union-head53-opponent-v15 --dir union53
      - run: python -m py_compile research/research_3head_broad_roi_v24.py
      - name: Run BROAD closing-odds ROI
        shell: bash
        run: |
          set -o pipefail
          python research/research_3head_broad_roi_v24.py | tee broad_roi_v24.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-broad-roi-v24
          path: |
            broad_roi_v24.log
            integrated_broad_roi_v24.csv
            v24_union_identity.csv
