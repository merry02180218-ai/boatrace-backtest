on:
  push:
    paths:
      - 'run_v343_1head_volume_first_audit.py'
      - '.github/workflows/v343-1head-volume-first-audit.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with:
          name: v340-1head-adaptive-odds-dutch-sharded
          path: /tmp/v343/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34796402852
      - run: python run_v343_1head_volume_first_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v343-1head-volume-first-audit
          path: /tmp/v343out/
