name: prepare-1head-v351-daily-0300-jst

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'fetch_1head_v351_biyori_cards.py'
      - 'run_1head_v351_live_expansion_shadow.py'
      - '.github/workflows/prepare-1head-v351-daily-0300-jst.yml'

permissions:
  contents: read
  actions: read

jobs:
  prepare-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests beautifulsoup4 lxml numpy pandas scipy 'scikit-learn==1.6.1'
      - name: Resolve JST date and race cards from BoatRace Biyori
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Tokyo date +%Y%m%d); ISO_DATE=$(TZ=Asia/Tokyo date +%F)
          echo "DATE=$DATE" >> "$GITHUB_ENV"; echo "ISO_DATE=$ISO_DATE" >> "$GITHUB_ENV"
          mkdir -p /tmp/pre /tmp/daily
          echo "CARD_SOURCE=BOATRACE_BIYORI_RETRY"
          python fetch_1head_v351_biyori_cards.py --date "$DATE" --out /tmp/pre/race_cards.csv
          echo "CARDS=/tmp/pre/race_cards.csv" >> "$GITHUB_ENV"
          echo "PRE=" >> "$GITHUB_ENV"
      - name: Build causal preparation once
        run: python run_v321_1head_julaug_nonpristine_validation.py --stage prepare
      - name: Build all-race v351 cache
        run: python prepare_1head_v351_live_cache.py --date "$ISO_DATE" --cards "$CARDS" --out /tmp/daily
      - name: Build expansion PRE Shadow candidates
        run: |
          python run_1head_v351_live_expansion_shadow.py scan \
            --cache-dir /tmp/daily \
            --csv-out /tmp/daily/expansion_pre_shadow.csv \
            --json-out /tmp/daily/expansion_pre_shadow_meta.json

      - name: Build PRE candidate summary
        run: |
          python - <<'PY'
          import csv,json,glob,os
          rows=[]
          for p in glob.glob('/tmp/daily/20*.json'):
              x=json.load(open(p)); code=str(x['race_code']).zfill(12)
              rows.append({'race_code':code,'jcd':int(code[8:10]),'race':int(code[10:12]),'pre_class':x.get('pre_class',''),'head_p':x.get('final_head_p'),'base_tickets':x.get('base_tickets',''),'result_or_payout_used':False,'chronology_guard':True})
          rows.sort(key=lambda r:(r['jcd'],r['race']))
          with open('/tmp/daily/pre_candidates.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]) if rows else ['race_code','jcd','race','pre_class','head_p','base_tickets','result_or_payout_used','chronology_guard']);w.writeheader();w.writerows(rows)
          json.dump({'date':os.environ['ISO_DATE'],'candidate_R':len(rows),'card_source':'BOATRACE_BIYORI_RETRY','result_or_payout_used':False,'chronology_guard':True},open('/tmp/daily/pre_candidates_meta.json','w'),indent=2)
          print(f"PRE_SUMMARY_R={len(rows)}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v351-1head-live-cache-${{ env.DATE }}
          retention-days: 3
          if-no-files-found: error
          path: /tmp/daily/
