name: audit-v351-venue-completeness
on:
  push:
    paths:
      - 'audit_triggers/v351_venue_completeness.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4
      - run: python audit_v351_venue_completeness.py | tee venue_audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: audit-v351-venue-completeness
          path: |
            analysis_v351_venue_completeness.csv
            venue_audit.txt
            /tmp/v326/v326_ticketaware_dataset.csv
