name: 1HEAD mechanism discovery v2
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research_1head_mechanism_discovery_v2.py'
      - '.github/workflows/research-1head-mechanism-v2.yml'
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        shell: powershell
        run: |
          python -c "import numpy,pandas,scipy,sklearn,requests,bs4,lxml" 2>$null
          if ($LASTEXITCODE -ne 0) { python -m pip install -q --disable-pip-version-check numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml }
      - name: Download frozen v360 prepared
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'v360'
          $zip = Join-Path $env:RUNNER_TEMP 'v360.zip'
          if (Test-Path (Join-Path $root 'prepared_rows.pkl')) {
            "PREP=$(Join-Path $root 'prepared_rows.pkl')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" -Headers $headers -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $prep = Get-ChildItem -Path $root -Recurse -File | Where-Object { $_.Extension -in '.pkl','.pickle' } | Select-Object -First 1
          if (-not $prep) { throw 'No prepared pickle' }
          $cachedPrep = Join-Path $root 'prepared_rows.pkl'
          if ([System.IO.Path]::GetFullPath($prep.FullName) -ne [System.IO.Path]::GetFullPath($cachedPrep)) { Copy-Item $prep.FullName $cachedPrep -Force }
          "PREP=$cachedPrep" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
      - name: Mechanism discovery v2
        shell: powershell
        env:
          BOATRACECSV_LOCAL_ROOT: ${{ github.workspace }}/brcsv
        run: python research_1head_mechanism_discovery_v2.py --prepared "$env:PREP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onehead-mechanism-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/1head-mechanism-discovery-v2
