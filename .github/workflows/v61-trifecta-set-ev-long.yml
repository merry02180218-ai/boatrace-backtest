name: v61-trifecta-set-ev-long
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'backtest_v61_trifecta_set_ev_long.py'
      - '.github/workflows/v61-trifecta-set-ev-long.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v61 trifecta set EV
        run: python backtest_v61_trifecta_set_ev_long.py
      - name: Commit v61 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v61_trifecta_set_ev_long.md analysis_v61_trifecta_set_ev.csv analysis_v61_sensitivity.csv
          if ! git diff --cached --quiet; then
            git commit -m "Run v61 trifecta set EV long backtest"
            git pull --rebase origin main
            git push
          fi
