name: validate-4head-v291-varn-live-input
on:
  push:
    paths:
      - 'assemble_4head_v291_varn_live_input.py'
      - 'verify_4head_v291_varn_live_input.py'
      - 'build_4head_env_entry_live.py'
      - 'build_4head_a_live_live.py'
      - 'build_4head_v283_rows_live.py'
      - 'run_4head_v291_varn_live.py'
      - '.github/workflows/validate-4head-v291-varn-live-input.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy
      - name: Syntax check
        run: python -m py_compile assemble_4head_v291_varn_live_input.py verify_4head_v291_varn_live_input.py
      - name: End-to-end frozen input contract
        run: python verify_4head_v291_varn_live_input.py
      - name: Result-blind guard
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assemble_4head_v291_varn_live_input.py').read_text().lower()
          for x in ['data/results/','payout','winner','actual_result','valid_result','closing_odds']:
              assert x not in s, x
          print('result-blind guard PASS')
          PY
