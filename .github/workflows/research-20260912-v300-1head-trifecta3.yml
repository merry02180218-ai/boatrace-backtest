name: v300 1head trifecta3 feature upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - 'run_v300_1head_trifecta3_feature_upgrade.py'
      - '.github/workflows/research-20260912-v300-1head-trifecta3.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Run v300 fixed-denominator feature upgrade
        run: python run_v300_1head_trifecta3_feature_upgrade.py
      - uses: actions/upload-artifact@v4
        with:
          name: v300-1head-trifecta3
          path: |
            analysis_v300_1head_trifecta3_feature_upgrade_*.csv
            summary_v300_1head_trifecta3_feature_upgrade.md
      - name: Commit v300 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v300_1head_trifecta3_feature_upgrade_*.csv summary_v300_1head_trifecta3_feature_upgrade.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add v300 opponent feature upgrade outputs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
