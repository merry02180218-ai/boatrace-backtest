name: v126-1head-pair-score
on:
  push:
    paths:
      - 'analyze_v126_1head_pair_score.py'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v126
        run: python analyze_v126_1head_pair_score.py
      - name: Commit summary
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add summary_v126_1head_pair_score.md
          git diff --cached --quiet || git commit -m 'Add v126 pair score result'
          git push
