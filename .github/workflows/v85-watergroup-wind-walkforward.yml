name: v85-watergroup-wind-walkforward
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_v85_watergroup_wind_walkforward.py'
      - '.github/workflows/v85-watergroup-wind-walkforward.yml'
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run water-group wind walk-forward
        run: python -u backtest_v85_watergroup_wind_walkforward.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v85_watergroup_wind_walkforward.md analysis_v85_watergroup_wind_walkforward.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add v85 water-group wind walk-forward results"
            git pull --rebase origin main
            git push
          fi
