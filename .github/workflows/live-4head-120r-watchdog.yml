name: live-4head-120r-watchdog

on:
  schedule:
    - cron: '*/5 21-23 * * *' # 06:00-08:59 JST
    - cron: '*/5 0-13 * * *'  # 09:00-22:59 JST
  workflow_dispatch:
  push:
    paths:
      - '.github/live/head4_120r_watchlist.json'
      - 'resolve_4head_watchdog_targets.py'
      - 'run_4head_120r_lastminute_fast.py'
      - '.github/workflows/live-4head-120r-watchdog.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      count: ${{ steps.targets.outputs.count }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Fetch watchlist and resolver from this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/live/head4_120r_watchlist.json?ref=$GITHUB_SHA" --jq '.content' | base64 -d > /tmp/watchlist.json
          gh api "repos/$GITHUB_REPOSITORY/contents/resolve_4head_watchdog_targets.py?ref=$GITHUB_SHA" --jq '.content' | base64 -d > /tmp/resolve.py
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false) | .name' > /tmp/artifact_names.txt

      - name: Resolve every active target
        id: targets
        shell: bash
        run: |
          python /tmp/resolve.py \
            --watchlist /tmp/watchlist.json \
            --completed-names /tmp/artifact_names.txt \
            --out /tmp/resolved.json
          COUNT="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/resolved.json'))['count'])
          PY
          )"
          MATRIX="$(python - <<'PY'
          import json
          z=json.load(open('/tmp/resolved.json'))
          print(json.dumps({'include':z['include']},separators=(',',':')))
          PY
          )"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "HEAD4_WATCHDOG_ACTIVE_COUNT=$COUNT"
          cat /tmp/resolved.json

  resolve_onehead:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      count: ${{ steps.targets.outputs.count }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Resolve active 1HEAD targets from latest daily audit
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%Y%m%d)
          NAME="1head-current-day-audit-$DAY"
          mkdir -p /tmp/head1_resolve
          ART_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | last | .id // empty')"
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | last | .workflow_run.id // empty')"
          if [ -z "$ART_ID" ] || [ -z "$RUN_ID" ]; then
            echo "HEAD1_WATCHDOG_DAILY_AUDIT_NOT_READY name=$NAME"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$NAME" -D /tmp/head1_resolve/audit
          WATCH="$(find /tmp/head1_resolve/audit -name watchlist.json -print -quit)"
          test -n "$WATCH"
          gh api "repos/$GITHUB_REPOSITORY/contents/resolve_1head_watchdog_targets.py?ref=$GITHUB_SHA" --jq '.content' | base64 -d > /tmp/head1_resolve/resolve.py
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false) | .name' > /tmp/head1_resolve/artifact_names.txt
          python /tmp/head1_resolve/resolve.py             --watchlist "$WATCH"             --audit-run-id "$RUN_ID"             --completed-names /tmp/head1_resolve/artifact_names.txt             --out /tmp/head1_resolve/resolved.json
          COUNT="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/head1_resolve/resolved.json'))['count'])
          PY
          )"
          MATRIX="$(python - <<'PY'
          import json
          z=json.load(open('/tmp/head1_resolve/resolved.json'))
          print(json.dumps({'include':z['include']},separators=(',',':')))
          PY
          )"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "HEAD1_WATCHDOG_ACTIVE_COUNT=$COUNT"
          cat /tmp/head1_resolve/resolved.json

  monitor_onehead:
    needs: resolve_onehead
    if: needs.resolve_onehead.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.resolve_onehead.outputs.matrix) }}
    uses: ./.github/workflows/live-1head-current-day-monitor.yml
    with:
      race_code: ${{ matrix.race_code }}
      audit_run_id: ${{ matrix.audit_run_id }}
      deadline_jst: ${{ matrix.deadline_jst }}

  monitor:
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: head4-watchdog-${{ matrix.target_date }}-${{ matrix.jcd }}-${{ matrix.race }}
      cancel-in-progress: true
    env:
      TARGET_DATE: ${{ matrix.target_date }}
      JCD: ${{ matrix.jcd }}
      RACE: ${{ matrix.race }}
      DEADLINE_JST: ${{ matrix.deadline_jst }}
      PRE_RUN_ID: ${{ matrix.pre_run_id }}
      PRE_ARTIFACT_NAME: ${{ matrix.pre_artifact_name }}
      STATE_RUN_ID: ${{ matrix.state_run_id }}
      STATE_ARTIFACT_NAME: ${{ matrix.state_artifact_name }}
      ARTIFACT_NAME: ${{ matrix.artifact_name }}
      ULTRALOW_SHADOW: ${{ matrix.ultralow_shadow }}
      OPERATIONAL_CLASS: ${{ matrix.operational_class }}
      PRE_REASON: ${{ matrix.pre_reason }}
    steps:
      - name: Per-race idempotency guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=20" --jq '.artifacts | map(select(.expired==false)) | length')"
          if [ "$COUNT" -gt 0 ]; then
            echo "HEAD4_WATCHDOG_ALREADY_COMPLETED $ARTIFACT_NAME"
            echo "SHOULD_RUN=0" >> "$GITHUB_ENV"
          else
            echo "SHOULD_RUN=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SHOULD_RUN == '1'

      - uses: actions/setup-python@v5
        if: env.SHOULD_RUN == '1'
        with:
          python-version: '3.11'

      - name: Install runtime
        if: env.SHOULD_RUN == '1'
        run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml joblib

      - name: Download frozen PRE and daily state
        if: env.SHOULD_RUN == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p preseed stateseed
          gh run download "$PRE_RUN_ID" -n "$PRE_ARTIFACT_NAME" -D preseed
          if [ "$STATE_RUN_ID" = "$PRE_RUN_ID" ] && [ "$STATE_ARTIFACT_NAME" = "$PRE_ARTIFACT_NAME" ]; then
            cp -a preseed/. stateseed/
            echo "HEAD4_STATE_SOURCE same_artifact run=$STATE_RUN_ID artifact=$STATE_ARTIFACT_NAME"
          else
            gh run download "$STATE_RUN_ID" -n "$STATE_ARTIFACT_NAME" -D stateseed
            echo "HEAD4_STATE_SOURCE referenced run=$STATE_RUN_ID artifact=$STATE_ARTIFACT_NAME"
          fi

      - name: Locate frozen inputs
        if: env.SHOULD_RUN == '1'
        shell: bash
        run: |
          CARD="$(find preseed -type f -path "*/current_input/v291/$TARGET_DATE/race_cards.csv" | head -1)"
          WAKU="$(find preseed -type f -path "*/current_input/v291/$TARGET_DATE/waku10.csv" | head -1)"
          PRE="$(find preseed -type f -path "*/live_outputs/head4_120r_pre/$TARGET_DATE/pre_all.csv" | head -1)"
          STATE="$(find stateseed -type f -name 'head4_daily_state.json' | head -1)"
          test -n "$CARD" && test -n "$WAKU" && test -n "$PRE" && test -n "$STATE"
          echo "CARD=$CARD" >> "$GITHUB_ENV"
          echo "WAKU=$WAKU" >> "$GITHUB_ENV"
          echo "PRE=$PRE" >> "$GITHUB_ENV"
          echo "STATE=$STATE" >> "$GITHUB_ENV"

      - name: Strict monitored decision
        if: env.SHOULD_RUN == '1'
        shell: bash
        run: |
          OUT="/tmp/head4_watchdog_\${JCD}_\${RACE}.json"
          LOG="/tmp/head4_watchdog_\${JCD}_\${RACE}.log"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "LOG=$LOG" >> "$GITHUB_ENV"
          /usr/bin/time -f 'WATCHDOG_WALL_SECONDS=%e' python run_4head_120r_lastminute_fast.py \
            --date "$TARGET_DATE" --jcd "$JCD" --race "$RACE" --deadline-jst "$DEADLINE_JST" \
            --race-cards "$CARD" --waku10 "$WAKU" --pre-all "$PRE" --daily-state "$STATE" \
            --poll-interval 10 \
            --exhibition-safety-seconds 75 --max-exhibition-wait-seconds 1800 \
            --odds-safety-seconds 45 --max-odds-wait-seconds 15 \
            --decision-safety-seconds 60 \
            --out "$OUT" 2>&1 | tee "$LOG"
          grep -Eq 'HEAD4_120R_FAST_LASTMINUTE_OK|HEAD4_120R_FAST_NO_BET_DATA_NOT_READY' "$LOG"

      - name: Contract check
        if: env.SHOULD_RUN == '1'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          z=json.load(open(os.environ['OUT'],encoding='utf-8'))
          assert z.get('monitoring_parent') is True,z
          assert z.get('target_race_result_used') is False,z
          assert z.get('payout_used') is False,z
          assert z.get('decision') in {'BET','PASS','NO_BET_DATA_NOT_READY'},z
          if z.get('decision') in {'BET','PASS'}:
              assert z.get('profile') == 'HEAD4_NEWFEATURE_FIXED156_V1',z
          print('HEAD4_WATCHDOG_CONTRACT_OK',z.get('decision'),z.get('race_code'))
          PY

      - name: Notify GitHub Issue on BET
        if: env.SHOULD_RUN == '1' && env.ULTRALOW_SHADOW != '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python notify_head4_bet_github_issue.py \
            --decision-json "$OUT" \
            --target-date "$TARGET_DATE" \
            --jcd "$JCD" --race "$RACE" \
            --deadline-jst "$DEADLINE_JST"

      - name: Shadow notification guard
        if: env.SHOULD_RUN == '1' && env.ULTRALOW_SHADOW == '1'
        run: |
          echo "HEAD4_SHADOW_NO_PRODUCTION_NOTIFICATION class=$OPERATIONAL_CLASS pre_reason=$PRE_REASON"

      - name: Classify retry/completion artifact
        if: env.SHOULD_RUN == '1' && always()
        shell: bash
        run: |
          if [ -f "$OUT" ]; then
            DECISION="$(python - <<'PY'
          import json,os
          try:
              print(json.load(open(os.environ['OUT'],encoding='utf-8')).get('decision','UNKNOWN'))
          except Exception:
              print('UNKNOWN')
          PY
            )"
          else
            DECISION="UNKNOWN"
          fi
          echo "WATCHDOG_DECISION=$DECISION" >> "$GITHUB_ENV"
          if [ "$DECISION" = "BET" ] || [ "$DECISION" = "PASS" ]; then
            echo "UPLOAD_ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
            echo "HEAD4_WATCHDOG_TERMINAL_ARTIFACT $ARTIFACT_NAME decision=$DECISION"
          else
            # Important: resolver treats only the canonical ARTIFACT_NAME as completed.
            # Keep diagnostics, but give retryable/not-ready attempts a unique non-canonical name.
            echo "UPLOAD_ARTIFACT_NAME=${ARTIFACT_NAME}-retry-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
            echo "HEAD4_WATCHDOG_RETRYABLE_ARTIFACT ${ARTIFACT_NAME}-retry-${GITHUB_RUN_ID} decision=$DECISION"
          fi

      - uses: actions/upload-artifact@v4
        if: env.SHOULD_RUN == '1' && always()
        with:
          name: ${{ env.UPLOAD_ARTIFACT_NAME }}
          path: |
            /tmp/head4_watchdog_*.json
            /tmp/head4_watchdog_*.log
          if-no-files-found: warn
          retention-days: 30
