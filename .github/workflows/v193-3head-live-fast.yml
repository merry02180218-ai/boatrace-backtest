name: v193 3head live fast
on:
  push:
    paths:
      - 'prepare_v193_3head_live_cache.py'
      - 'predict_v193_3head_live_fast.py'
      - 'live_input_3head.json'
      - '.github/workflows/v193-3head-live-fast.yml'
permissions:
  contents: write
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-live-v193.txt
      - name: Install deps if needed
        run: |
          python - <<'PY' || pip install -r requirements-live-v193.txt
          import numpy,pandas,sklearn,joblib,requests,bs4
          PY
      - name: Build daily cache if missing
        run: |
          if [ ! -f cache_v193_3head_live.joblib ]; then python prepare_v193_3head_live_cache.py; fi
      - name: Run fast live v165-v166
        run: python predict_v193_3head_live_fast.py
      - name: Commit cache and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache_v193_3head_live.joblib cache_v193_3head_live_meta.json prediction_v193_3head_live_fast.json summary_v193_3head_live_fast.md
          git diff --cached --quiet || git commit -m "Update v193 fast live cache/result"
          git pull --rebase --autostash origin main
          git push
