name: v141 integrated PRE scenario
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v141_integrated_pre_scenario.py'
      - '.github/workflows/v141-integrated-pre-scenario.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scikit-learn requests beautifulsoup4
      - run: python analyze_v141_integrated_pre_scenario.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_v141_integrated_pre_scenario.csv summary_v141_integrated_pre_scenario.md pred_v141_20260906_kiryu_scenario.csv
          git diff --cached --quiet || git commit -m "Generate v141 integrated PRE scenario results"
          git push
