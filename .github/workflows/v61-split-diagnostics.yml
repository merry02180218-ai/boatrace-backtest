name: v61-split-diagnostics
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'analyze_v61_split_diagnostics.py'
      - '.github/workflows/v61-split-diagnostics.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python analyze_v61_split_diagnostics.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982818+github-actions[bot]@users.noreply.github.com"
          git add summary_v61_split_diagnostics.md
          if ! git diff --cached --quiet; then
            git commit -m "Run v61 split diagnostics"
            git pull --rebase origin main
            git push
          fi
