name: v188 v180-v166 monthly trifecta

on:
  push:
    paths:
      - 'analyze_v188_v180_v166_monthly_trifecta.py'
      - '.github/workflows/v188-v180-v166-monthly-trifecta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - name: Run v188
        run: python analyze_v188_v180_v166_monthly_trifecta.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v188_v180_v166_monthly_trifecta.csv summary_v188_v180_v166_monthly_trifecta.md
          git diff --cached --quiet && exit 0
          git commit -m 'Add v188 monthly trifecta results'
          git pull --rebase origin main
          git push
