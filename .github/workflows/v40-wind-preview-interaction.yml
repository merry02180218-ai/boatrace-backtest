name: v40-wind-preview-interaction
on:
  push:
    paths:
      - 'analyze_v40_wind_preview_interaction.py'
      - '.github/workflows/v40-wind-preview-interaction.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python analyze_v40_wind_preview_interaction.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary_v40_wind_preview_interaction.md analysis_v40_wind_preview_interaction.csv
          git diff --cached --quiet || git commit -m "Add v40 wind preview interaction results"
          git push
