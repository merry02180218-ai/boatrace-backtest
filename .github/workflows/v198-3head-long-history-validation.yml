name: v198 3head long history validation
on:
  push:
    paths:
      - 'analyze_v198_3head_long_history_validation.py'
      - '.github/workflows/v198-3head-long-history-validation.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pandas scikit-learn
      - run: python analyze_v198_3head_long_history_validation.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v198_3head_long_history_base.csv analysis_v198_3head_long_history_rolling.csv summary_v198_3head_long_history_validation.md
          git diff --cached --quiet || git commit -m 'Add v198 long-history validation results'
          git pull --rebase
          git push
