name: v255 4-head fixed TopN volume compare
on:
  workflow_dispatch:
  push:
    paths:
      - 'analyze_v255_4head_fixed_topn_volume_compare.py'
      - '.github/workflows/v255-4head-fixed-topn-volume-compare.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn requests
      - run: python analyze_v255_4head_fixed_topn_volume_compare.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_v255_4head_fixed_topn_volume_compare.csv summary_v255_4head_fixed_topn_volume_compare.md
          git diff --cached --quiet || git commit -m 'Add v255 4-head fixed TopN volume results'
          git pull --rebase
          git push
