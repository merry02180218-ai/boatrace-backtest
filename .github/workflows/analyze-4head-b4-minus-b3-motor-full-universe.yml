name: analyze-4head-b4-minus-b3-motor-full-universe
on:
  push:
    paths:
      - 'analyze_4head_b4_minus_b3_motor_full_universe.py'
      - '.github/workflows/analyze-4head-b4-minus-b3-motor-full-universe.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scipy scikit-learn requests beautifulsoup4 lxml tabulate
      - name: Guard full-universe fixed-rule and September blindness
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('analyze_4head_b4_minus_b3_motor_full_universe.py').read_text(encoding='utf-8')
          assert 'WIN_CUT=0.010782' in p and 'REN2_CUT=0.4000' in p
          assert "MONTHS=('2026-04','2026-05','2026-06','2026-07','2026-08')" in p
          assert 'p4head' not in p and 'BASE_PRE' not in p
          q=Path('analyze_4head_b4_minus_b3_motor_win_2ren.py').read_text(encoding='utf-8')
          assert 'END=date(2026,8,31)' in q
          print('full-universe fixed-rule / September blind guard PASS')
          PY
      - name: Run full-universe validation
        run: python analyze_4head_b4_minus_b3_motor_full_universe.py
      - uses: actions/upload-artifact@v4
        with:
          name: head4-b4-minus-b3-motor-full-universe
          path: |
            analysis_4head_b4_minus_b3_motor_full_universe_races.csv
            summary_4head_b4_minus_b3_motor_full_universe.md
