name: v370 1-head dynamic odds staking
on:
  push:
    paths:
      - 'run_v370_1head_dynamic_odds_staking.py'
      - '.github/workflows/v370-1head-dynamic-odds-staking.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas scipy 'scikit-learn==1.6.1' requests beautifulsoup4 lxml
      - name: Download v360 prepared artifact
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10539401122/zip" > /tmp/v360.zip
          mkdir -p /tmp/v360
          unzip -q /tmp/v360.zip -d /tmp/v360
          test -f /tmp/v360/prepared_rows.pkl
      - name: Download frozen v340 official odds fallback
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          mkdir -p /tmp/v340frozen
          for id in 10329564703 10330810260 10330651756 10329684566 10330273057 10330357729; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "/tmp/v340-$id.zip"
            unzip -q -o "/tmp/v340-$id.zip" -d /tmp/v340frozen
          done
          ls -l /tmp/v340frozen/odds_*.csv
      - name: Run dynamic odds staking audit
        run: python run_v370_1head_dynamic_odds_staking.py --prepared /tmp/v360/prepared_rows.pkl --frozen-odds /tmp/v340frozen
      - name: Show result
        if: always()
        run: |
          cat /tmp/v370-dynamic-staking/result.json 2>/dev/null || true
          cat /tmp/v370-dynamic-staking/selected_by_budget.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v370-dynamic-odds-staking-${{ github.run_id }}
          path: /tmp/v370-dynamic-staking/
          retention-days: 30

