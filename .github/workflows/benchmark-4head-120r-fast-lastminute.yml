name: benchmark-4head-120r-fast-lastminute

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/benchmark-4head-120r-fast-lastminute.txt'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sparse checkout historical data locally
        uses: actions/checkout@v4
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          path: brcsv
          fetch-depth: 1
          sparse-checkout: |
            data/programs/race_cards/2025/10
            data/programs/race_cards/2025/11
            data/programs/race_cards/2025/12
            data/programs/race_cards/2026/01
            data/programs/race_cards/2026/02
            data/programs/race_cards/2026/03
            data/programs/race_cards/2026/04
            data/programs/race_cards/2026/05
            data/programs/race_cards/2026/06
            data/programs/race_cards/2026/07
            data/programs/race_cards/2026/08
            data/programs/race_cards/2026/09
            data/results/realtime/2025/10
            data/results/realtime/2025/11
            data/results/realtime/2025/12
            data/results/realtime/2026/01
            data/results/realtime/2026/02
            data/results/realtime/2026/03
            data/results/realtime/2026/04
            data/results/realtime/2026/05
            data/results/realtime/2026/06
            data/results/realtime/2026/07
            data/results/realtime/2026/08
            data/results/realtime/2026/09
            data/previews/stt/2025/10
            data/previews/stt/2025/11
            data/previews/stt/2025/12
            data/previews/stt/2026/01
            data/previews/stt/2026/02
            data/previews/stt/2026/03
            data/previews/stt/2026/04
            data/previews/stt/2026/05
            data/previews/stt/2026/06
            data/previews/stt/2026/07
            data/previews/stt/2026/08
            data/previews/stt/2026/09
      - run: pip install numpy pandas scipy scikit-learn requests beautifulsoup4 lxml
      - name: Verify corrected POST/ST parser
        run: python verify_4head_post_live.py
      - name: Reuse corrected 2026-09-18 PRE artifact
        uses: actions/download-artifact@v4
        with:
          name: head4-120r-pre-live-trial-20260918
          path: seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35317588703
      - name: Locate current inputs
        run: |
          CARD="$(find seed -type f -path '*/current_input/v291/20260918/race_cards.csv' | head -1)"
          WAKU="$(find seed -type f -path '*/current_input/v291/20260918/waku10.csv' | head -1)"
          PRE="$(find seed -type f -path '*/live_outputs/head4_120r_pre/20260918/pre_all.csv' | head -1)"
          test -n "$CARD" && test -n "$WAKU" && test -n "$PRE"
          echo "CARD=$CARD" >> "$GITHUB_ENV"
          echo "WAKU=$WAKU" >> "$GITHUB_ENV"
          echo "PRE=$PRE" >> "$GITHUB_ENV"
      - name: Build once-daily state through Sep 17
        run: |
          /usr/bin/time -f 'DAILY_STATE_WALL_SECONDS=%e' python prepare_4head_120r_daily_state.py             --target-date 2026-09-18 --data-root brcsv --out /tmp/head4_daily_state.json 2>&1 | tee /tmp/daily_state.log
      - name: Fast last-minute benchmark Marugame 4R
        run: |
          /usr/bin/time -f 'FAST120_WALL_SECONDS=%e' python run_4head_120r_lastminute_fast.py             --date 20260918 --jcd 15 --race 4 --deadline-jst 16:42             --race-cards "$CARD" --waku10 "$WAKU" --pre-all "$PRE"             --daily-state /tmp/head4_daily_state.json             --allow-unmonitored-benchmark --out /tmp/fast120_marugame4.json 2>&1 | tee /tmp/fast120.log
          grep -q 'HEAD4_120R_FAST_LASTMINUTE_OK' /tmp/fast120.log
      - uses: actions/upload-artifact@v4
        with:
          name: head4-120r-fast-lastminute-benchmark
          path: |
            /tmp/head4_daily_state.json
            /tmp/daily_state.log
            /tmp/fast120_marugame4.json
            /tmp/fast120.log
