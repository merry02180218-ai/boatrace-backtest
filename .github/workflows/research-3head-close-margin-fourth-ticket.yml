name: research-3head-close-margin-fourth-ticket
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-3head-close-margin-fourth-ticket.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/3head-player-attack-mode
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn
      - name: Restore fixed pre-September source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34754875342 -n 3head-wave21-allrace-source-build
          SRC=$(find . -name 'analysis_v289_3head_wave21_allrace_feature_settled.csv' | head -1)
          test -n "$SRC"
          cp "$SRC" "$GITHUB_WORKSPACE/analysis_v289_3head_wave21_allrace_feature_settled.csv"
      - name: Close-margin fourth-ticket audit
        run: PYTHONPATH="$GITHUB_WORKSPACE" python research/run_3head_close_margin_fourth_ticket.py | tee research_v289_3head_close_margin_fourth_ticket.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-3head-close-margin-fourth-ticket
          path: |
            research_v289_3head_close_margin_fourth_ticket.json
            research_v289_3head_close_margin_fourth_ticket_march_grid.csv
            research_v289_3head_close_margin_fourth_ticket.log
